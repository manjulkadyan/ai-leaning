site_name: AI Engineering, From Zero
site_description: A zero-to-professional curriculum for AI, ML, LLMs, AI engineering and on-device AI, written for an experienced Android/Kotlin engineer.
site_url: https://manjulkadyan.github.io/ai-leaning/
repo_url: https://github.com/manjulkadyan/ai-leaning
repo_name: manjulkadyan/ai-leaning
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/vector-playground.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search

nav:
  - Home: index.md
  - How Lessons Work: how-lessons-work.md
  - Roadmap: roadmap/index.md
  - Study Plan:
      - plan/index.md
      - Monthly plan: plan/monthly.md
      - Month 1: plan/month-01.md
  - Lessons:
      - lessons/index.md
      - Phase 1 · Foundations:
          - "Day 1: Workstation setup": lessons/phase-1/day-01-setup.md
          - "Day 2: Python core types": lessons/phase-1/day-02-python-types.md
          - "Day 3: Functions & classes": lessons/phase-1/day-03-functions-classes.md
          - "Day 4: NumPy arrays": lessons/phase-1/day-04-numpy-arrays.md
          - "Day 5: Vectors": lessons/phase-1/day-05-vectors.md
          - "Day 8: Shapes & indexing": lessons/phase-1/day-08-shapes-indexing.md
          - "Day 9: Broadcasting": lessons/phase-1/day-09-broadcasting.md
