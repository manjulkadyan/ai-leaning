site_name: AI Engineering, From Zero
site_description: A zero-to-professional curriculum for AI, ML, LLMs, AI engineering and on-device AI, written for an experienced Android/Kotlin engineer.
site_url: https://manjulkadyan.github.io/ai-leaning/
repo_url: https://github.com/manjulkadyan/ai-leaning
repo_name: manjulkadyan/ai-leaning
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
  - stylesheets/matmul-stepper.css
  - stylesheets/run-python.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/vector-playground.js
  - javascripts/matmul-stepper.js
  - javascripts/run-python.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

hooks:
  - hooks/notebooks.py

plugins:
  - search

nav:
  - Home: index.md
  - How Lessons Work: how-lessons-work.md
  - Roadmap: roadmap/index.md
  - Progress: progress.md
  - Study Plan:
      - plan/index.md
      - Monthly plan: plan/monthly.md
      - Month 1: plan/month-01.md
  - Lessons:
      - lessons/index.md
      - Phase 1 · Foundations:
          - "Day 1: Workstation setup": lessons/phase-1/day-01-setup.md
          - "Day 2: Python core types": lessons/phase-1/day-02-python-types.md
          - "Day 3: Functions & classes": lessons/phase-1/day-03-functions-classes.md
          - "Day 4: NumPy arrays": lessons/phase-1/day-04-numpy-arrays.md
          - "Day 5: Vectors": lessons/phase-1/day-05-vectors.md
          - "Day 6: Week 1 review": lessons/phase-1/day-06-week1-review.md
          - "Day 8: Shapes & indexing": lessons/phase-1/day-08-shapes-indexing.md
          - "Day 9: Broadcasting": lessons/phase-1/day-09-broadcasting.md
          - "Day 10: Matrix multiplication": lessons/phase-1/day-10-matrices-matmul.md
          - "Day 11: Transpose & inverse": lessons/phase-1/day-11-transpose-identity-inverse.md
          - "Day 12: A layer is a matmul": lessons/phase-1/day-12-layer-is-matmul.md
          - "Day 13: Week 2 review": lessons/phase-1/day-13-week2-review.md
          - "Day 15: pandas DataFrames": lessons/phase-1/day-15-pandas-dataframes.md
          - "Day 16: Selecting & filtering": lessons/phase-1/day-16-pandas-selecting.md
          - "Day 17: Cleaning data": lessons/phase-1/day-17-pandas-cleaning.md
          - "Day 18: groupby & merge": lessons/phase-1/day-18-pandas-groupby-merge.md
          - "Day 19: Matplotlib": lessons/phase-1/day-19-matplotlib.md
          - "Day 20: Week 3 review": lessons/phase-1/day-20-week3-review.md
          - "Day 22: Norms & distances": lessons/phase-1/day-22-norms-distances.md
          - "Day 23: Rank & span": lessons/phase-1/day-23-rank-span.md
          - "Day 24: Eigenvectors": lessons/phase-1/day-24-eigenvectors.md
  - Datasets: datasets.md
  - Glossary: glossary.md
