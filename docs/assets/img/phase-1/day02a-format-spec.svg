<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-weight="bold">The parts of a format spec, always in this order</text>
  <text x="346" y="62" text-anchor="middle" font-size="12" fill="#e53935">the colon starts the spec</text>
  <line x1="346" y1="67" x2="346" y2="78" stroke="#e53935"/>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="30"><text x="185" y="104" fill="#222222">f</text><text x="204" y="104" fill="#222222">"</text><text x="223" y="104" fill="#222222">{</text><text x="242" y="104" fill="#222222">v</text><text x="261" y="104" fill="#222222">a</text><text x="280" y="104" fill="#222222">l</text><text x="299" y="104" fill="#222222">u</text><text x="318" y="104" fill="#222222">e</text><text x="337" y="104" fill="#e53935">:</text><text x="356" y="104" fill="#3949ab">*</text><text x="375" y="104" fill="#3949ab">&gt;</text><text x="394" y="104" fill="#3949ab">+</text><text x="413" y="104" fill="#3949ab">1</text><text x="432" y="104" fill="#3949ab">2</text><text x="451" y="104" fill="#3949ab">,</text><text x="470" y="104" fill="#3949ab">.</text><text x="489" y="104" fill="#3949ab">2</text><text x="508" y="104" fill="#3949ab">f</text><text x="527" y="104" fill="#222222">}</text><text x="546" y="104" fill="#222222">"</text></g>
  <text x="240" y="134" text-anchor="middle" font-size="12" fill="#555">the value</text>
  <path d="M356,114 v7 h16 v-7" fill="none" stroke="#3949ab" stroke-width="2"/>
  <line x1="364.0" y1="121" x2="56.0" y2="200" stroke="#3949ab" stroke-width="1.3"/>
  <rect x="6" y="200" width="100" height="72" rx="6" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="56.0" y="220" text-anchor="middle" font-weight="bold" font-size="13">fill</text>
  <text x="56.0" y="240" text-anchor="middle" font-size="12" fill="#555">padding char</text>
  <text x="56.0" y="256" text-anchor="middle" font-size="12" fill="#555">(needs an align)</text>
  <path d="M375,114 v7 h16 v-7" fill="none" stroke="#00897b" stroke-width="2"/>
  <line x1="383.0" y1="121" x2="164.0" y2="200" stroke="#00897b" stroke-width="1.3"/>
  <rect x="114" y="200" width="100" height="72" rx="6" fill="#e0f2f1" stroke="#00897b"/>
  <text x="164.0" y="220" text-anchor="middle" font-weight="bold" font-size="13">align</text>
  <text x="164.0" y="240" text-anchor="middle" font-size="12" fill="#555">&lt; left  &gt; right</text>
  <text x="164.0" y="256" text-anchor="middle" font-size="12" fill="#555">^ centre</text>
  <path d="M394,114 v7 h16 v-7" fill="none" stroke="#3949ab" stroke-width="2"/>
  <line x1="402.0" y1="121" x2="272.0" y2="200" stroke="#3949ab" stroke-width="1.3"/>
  <rect x="222" y="200" width="100" height="72" rx="6" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="272.0" y="220" text-anchor="middle" font-weight="bold" font-size="13">sign</text>
  <text x="272.0" y="240" text-anchor="middle" font-size="12" fill="#555">+ shows it</text>
  <text x="272.0" y="256" text-anchor="middle" font-size="12" fill="#555">on positives</text>
  <path d="M413,114 v7 h35 v-7" fill="none" stroke="#00897b" stroke-width="2"/>
  <line x1="430.5" y1="121" x2="380.0" y2="200" stroke="#00897b" stroke-width="1.3"/>
  <rect x="330" y="200" width="100" height="72" rx="6" fill="#e0f2f1" stroke="#00897b"/>
  <text x="380.0" y="220" text-anchor="middle" font-weight="bold" font-size="13">width</text>
  <text x="380.0" y="240" text-anchor="middle" font-size="12" fill="#555">minimum</text>
  <text x="380.0" y="256" text-anchor="middle" font-size="12" fill="#555">characters</text>
  <path d="M451,114 v7 h16 v-7" fill="none" stroke="#3949ab" stroke-width="2"/>
  <line x1="459.0" y1="121" x2="488.0" y2="200" stroke="#3949ab" stroke-width="1.3"/>
  <rect x="438" y="200" width="100" height="72" rx="6" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="488.0" y="220" text-anchor="middle" font-weight="bold" font-size="13">grouping</text>
  <text x="488.0" y="240" text-anchor="middle" font-size="12" fill="#555">, or _</text>
  <text x="488.0" y="256" text-anchor="middle" font-size="12" fill="#555">thousands</text>
  <path d="M470,114 v7 h35 v-7" fill="none" stroke="#00897b" stroke-width="2"/>
  <line x1="487.5" y1="121" x2="596.0" y2="200" stroke="#00897b" stroke-width="1.3"/>
  <rect x="546" y="200" width="100" height="72" rx="6" fill="#e0f2f1" stroke="#00897b"/>
  <text x="596.0" y="220" text-anchor="middle" font-weight="bold" font-size="13">precision</text>
  <text x="596.0" y="240" text-anchor="middle" font-size="12" fill="#555">digits after</text>
  <text x="596.0" y="256" text-anchor="middle" font-size="12" fill="#555">the dot</text>
  <path d="M508,114 v7 h16 v-7" fill="none" stroke="#3949ab" stroke-width="2"/>
  <line x1="516.0" y1="121" x2="704.0" y2="200" stroke="#3949ab" stroke-width="1.3"/>
  <rect x="654" y="200" width="100" height="72" rx="6" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="704.0" y="220" text-anchor="middle" font-weight="bold" font-size="13">type</text>
  <text x="704.0" y="240" text-anchor="middle" font-size="12" fill="#555">f  e  %  d</text>
  <text x="704.0" y="256" text-anchor="middle" font-size="12" fill="#555">x  b</text>
  <text x="20" y="315" font-size="13" fill="#555">result for 1234.567:</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24"><text x="170" y="316" fill="#ef6c00">*</text><text x="186" y="316" fill="#ef6c00">*</text><text x="202" y="316" fill="#ef6c00">*</text><text x="218" y="316" fill="#222222">+</text><text x="234" y="316" fill="#222222">1</text><text x="250" y="316" fill="#222222">,</text><text x="266" y="316" fill="#222222">2</text><text x="282" y="316" fill="#222222">3</text><text x="298" y="316" fill="#222222">4</text><text x="314" y="316" fill="#222222">.</text><text x="330" y="316" fill="#222222">5</text><text x="346" y="316" fill="#222222">7</text></g>
  <text x="378" y="315" font-size="12" fill="#ef6c00">3 stars of padding: 9 characters of text, width 12</text>
</svg>
