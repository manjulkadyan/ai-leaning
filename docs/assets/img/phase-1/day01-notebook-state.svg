<svg xmlns="http://www.w3.org/2000/svg" class="animated" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif" font-size="14">
<rect width="760" height="420" fill="#ffffff"/>
<text x="210" y="28" font-weight="bold" font-size="15" fill="#3949ab" text-anchor="middle">Notebook (what you see)</text>
<text x="600" y="28" font-weight="bold" font-size="15" fill="#00897b" text-anchor="middle">Kernel (what Python remembers)</text>
<rect x="90" y="60" width="300" height="44" rx="6" fill="#f5f5f5" stroke="#bbb"/>
<rect x="90" y="60" width="300" height="44" rx="6" fill="#fff59d" stroke="#ef6c00" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.100;0.300;1.000" values="0;1;0;0"/></rect>
<text x="104" y="87" font-family="Menlo, Consolas, monospace" font-size="14">lr = 0.1</text>
<text x="20" y="87" font-size="12" fill="#555">cell A</text>
<rect x="90" y="140" width="300" height="44" rx="6" fill="#f5f5f5" stroke="#bbb"/>
<rect x="90" y="140" width="300" height="44" rx="6" fill="#fff59d" stroke="#ef6c00" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.300;0.500;1.000" values="0;1;0;0"/></rect>
<rect x="90" y="140" width="300" height="44" rx="6" fill="#fff59d" stroke="#ef6c00" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.500;0.700;1.000" values="0;1;0;0"/></rect>
<text x="104" y="167" font-family="Menlo, Consolas, monospace" font-size="14">lr = lr * 10</text>
<text x="20" y="167" font-size="12" fill="#555">cell B</text>
<rect x="90" y="220" width="300" height="44" rx="6" fill="#f5f5f5" stroke="#bbb"/>
<rect x="90" y="220" width="300" height="44" rx="6" fill="#fff59d" stroke="#ef6c00" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.700;1.000" values="0;1;1"/></rect>
<text x="104" y="247" font-family="Menlo, Consolas, monospace" font-size="14">print(lr)</text>
<text x="20" y="247" font-size="12" fill="#555">cell C</text>
<text x="84" y="87" font-family="Menlo, Consolas, monospace" font-size="12" fill="#555" text-anchor="end" opacity="0">[ ]:<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.100;1.000" values="1;0;0"/></text>
<text x="84" y="87" font-family="Menlo, Consolas, monospace" font-size="12" fill="#3949ab" text-anchor="end" opacity="0">[1]:<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.100;1.000" values="0;1;1"/></text>
<text x="84" y="167" font-family="Menlo, Consolas, monospace" font-size="12" fill="#555" text-anchor="end" opacity="0">[ ]:<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.300;1.000" values="1;0;0"/></text>
<text x="84" y="167" font-family="Menlo, Consolas, monospace" font-size="12" fill="#3949ab" text-anchor="end" opacity="0">[2]:<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.300;0.500;1.000" values="0;1;0;0"/></text>
<text x="84" y="167" font-family="Menlo, Consolas, monospace" font-size="12" fill="#e53935" text-anchor="end" opacity="0">[3]:<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.500;1.000" values="0;1;1"/></text>
<text x="84" y="247" font-family="Menlo, Consolas, monospace" font-size="12" fill="#555" text-anchor="end" opacity="0">[ ]:<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.700;1.000" values="1;0;0"/></text>
<text x="84" y="247" font-family="Menlo, Consolas, monospace" font-size="12" fill="#3949ab" text-anchor="end" opacity="0">[4]:<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.700;1.000" values="0;1;1"/></text>
<text x="104" y="290" font-family="Menlo, Consolas, monospace" font-size="14" fill="#e53935" opacity="0">10.0<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.720;1.000" values="0;1;1"/></text>
<text x="150" y="290" font-size="12" fill="#555" opacity="0">output under cell C<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.720;1.000" values="0;1;1"/></text>
<rect x="450" y="60" width="290" height="204" rx="10" fill="#e0f2f1" stroke="#00897b"/>
<text x="466" y="86" font-size="12" fill="#555">one long-running python process</text>
<rect x="480" y="110" width="230" height="56" rx="8" fill="#ffffff" stroke="#00897b"/>
<text x="498" y="145" font-family="Menlo, Consolas, monospace" font-size="18">lr</text>
<text x="530" y="145" font-size="18" fill="#555">→</text>
<text x="566" y="145" font-size="14" fill="#555" opacity="0">(not defined)<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.100;1.000" values="1;0;0"/></text>
<text x="566" y="145" font-family="Menlo, Consolas, monospace" font-size="18" fill="#00897b" font-weight="bold" opacity="0">0.1<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.100;0.300;1.000" values="0;1;0;0"/></text>
<text x="566" y="145" font-family="Menlo, Consolas, monospace" font-size="18" fill="#00897b" font-weight="bold" opacity="0">1.0<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.300;0.500;1.000" values="0;1;0;0"/></text>
<text x="566" y="145" font-family="Menlo, Consolas, monospace" font-size="18" fill="#00897b" font-weight="bold" opacity="0">10.0<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.500;0.700;1.000" values="0;1;0;0"/></text>
<text x="566" y="145" font-family="Menlo, Consolas, monospace" font-size="18" fill="#00897b" font-weight="bold" opacity="0">10.0<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.700;1.000" values="0;1;1"/></text>
<text x="595" y="200" font-size="14" text-anchor="middle" fill="#ef6c00" opacity="0">you run cell A<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.100;0.300;1.000" values="0;1;0;0"/></text>
<text x="595" y="200" font-size="14" text-anchor="middle" fill="#ef6c00" opacity="0">you run cell B<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.300;0.500;1.000" values="0;1;0;0"/></text>
<text x="595" y="200" font-size="14" text-anchor="middle" fill="#ef6c00" opacity="0">you run cell B again<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.500;0.700;1.000" values="0;1;0;0"/></text>
<text x="595" y="200" font-size="14" text-anchor="middle" fill="#ef6c00" opacity="0">you run cell C<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.700;1.000" values="0;1;1"/></text>
<text x="595" y="200" font-size="14" text-anchor="middle" fill="#555" opacity="0">nothing run yet<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.100;1.000" values="1;0;0"/></text>
<text x="595" y="236" font-size="12" text-anchor="middle" fill="#555">execution count goes up by one per run</text>
<rect x="20" y="320" width="720" height="84" rx="8" fill="#fff3e0" stroke="#ef6c00"/>
<text x="380" y="346" font-size="13" text-anchor="middle">Reading the cells top to bottom, you would expect 1.0. The kernel holds 10.0, because cell B ran twice.</text>
<text x="380" y="368" font-size="13" text-anchor="middle">The counters read [1], [3], [4]: number 2 is gone because cell B ran again and took number 3. That gap is the clue.</text>
<text x="380" y="390" font-size="13" text-anchor="middle">Kernel → Restart Kernel and Run All Cells throws the memory away and runs A, B, C once: 1.0.</text>
</svg>
