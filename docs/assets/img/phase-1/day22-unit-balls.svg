  <!-- explanation panel -->
  <rect x="400" y="60" width="290" height="230" rx="8" fill="#e8eaf6"/>
  <g opacity="1">
    <animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" values="1;0;0;1" keyTimes="0;0.175;0.525;0.925"/>
    <text x="545" y="88" text-anchor="middle" font-weight="bold" font-size="16" fill="#3949ab">L1 norm (Manhattan)</text>
    <text x="545" y="124" text-anchor="middle" font-size="17">|x₁| + |x₂| = 1</text>
    <text x="545" y="166" text-anchor="middle" font-size="13" fill="#333">a diamond: corners on the axes</text>
    <text x="545" y="206" text-anchor="middle" font-size="13" fill="#333">on the diagonal:</text>
    <text x="545" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#e53935">[0.5, 0.5]</text>
    <text x="545" y="268" text-anchor="middle" font-size="12" fill="#555">0.5 + 0.5 = 1</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.175;0.525;0.925"/>
    <text x="545" y="88" text-anchor="middle" font-weight="bold" font-size="16" fill="#00897b">L2 norm (Euclidean)</text>
    <text x="545" y="124" text-anchor="middle" font-size="17">√(x₁² + x₂²) = 1</text>
    <text x="545" y="166" text-anchor="middle" font-size="13" fill="#333">a circle: every direction alike</text>
    <text x="545" y="206" text-anchor="middle" font-size="13" fill="#333">on the diagonal:</text>
    <text x="545" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#e53935">[0.71, 0.71]</text>
    <text x="545" y="268" text-anchor="middle" font-size="12" fill="#555">√(0.5 + 0.5) = 1</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" values="0;0;1;0" keyTimes="0;0.175;0.525;0.925"/>
    <text x="545" y="88" text-anchor="middle" font-weight="bold" font-size="16" fill="#ef6c00">L∞ norm (max)</text>
    <text x="545" y="124" text-anchor="middle" font-size="17">max(|x₁|, |x₂|) = 1</text>
    <text x="545" y="166" text-anchor="middle" font-size="13" fill="#333">a square: corners on the diagonals</text>
    <text x="545" y="206" text-anchor="middle" font-size="13" fill="#333">on the diagonal:</text>
    <text x="545" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#e53935">[1, 1]</text>
    <text x="545" y="268" text-anchor="middle" font-size="12" fill="#555">max(1, 1) = 1</text>
  </g>
  <text x="545" y="316" text-anchor="middle" font-size="12" fill="#555">dashed: all three shapes, nested</text>
  <text x="545" y="334" text-anchor="middle" font-size="12" fill="#555">L1 inside L2 inside L∞</text>
</svg>
