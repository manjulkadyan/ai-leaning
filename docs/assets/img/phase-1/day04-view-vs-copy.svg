<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<rect width="760" height="390" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3949ab"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00897b"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker></defs>
<text x="20" y="26" font-weight="bold" font-size="15">A slice is a window onto the same memory. A mask builds new memory.</text>
<text x="20" y="58" font-family="Menlo, Consolas, monospace" font-size="13">a = np.array([10, 20, 30, 40, 50, 60])</text>
<text x="20" y="100" font-size="12" fill="#555">a's buffer</text>
<rect x="140" y="74" width="70" height="40" fill="#e0f2f1" stroke="#00897b"/><text x="144" y="134" font-size="10" fill="#555">byte 0</text><text x="175" y="99" text-anchor="middle" font-family="Menlo, Consolas, monospace">10</text>
<rect x="210" y="74" width="70" height="40" fill="#e0f2f1" stroke="#00897b"/><text x="214" y="134" font-size="10" fill="#555">byte 8</text><rect x="211" y="75" width="68" height="38" fill="#fff59d" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></rect><text x="245" y="99" text-anchor="middle" font-family="Menlo, Consolas, monospace">20<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.3;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text><text x="245" y="99" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#e53935" opacity="0">99<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<rect x="280" y="74" width="70" height="40" fill="#e0f2f1" stroke="#00897b"/><text x="284" y="134" font-size="10" fill="#555">byte 16</text><text x="315" y="99" text-anchor="middle" font-family="Menlo, Consolas, monospace">30</text>
<rect x="350" y="74" width="70" height="40" fill="#e0f2f1" stroke="#00897b"/><text x="354" y="134" font-size="10" fill="#555">byte 24</text><text x="385" y="99" text-anchor="middle" font-family="Menlo, Consolas, monospace">40</text>
<rect x="420" y="74" width="70" height="40" fill="#e0f2f1" stroke="#00897b"/><text x="424" y="134" font-size="10" fill="#555">byte 32</text><text x="455" y="99" text-anchor="middle" font-family="Menlo, Consolas, monospace">50</text>
<rect x="490" y="74" width="70" height="40" fill="#e0f2f1" stroke="#00897b"/><text x="494" y="134" font-size="10" fill="#555">byte 40</text><text x="525" y="99" text-anchor="middle" font-family="Menlo, Consolas, monospace">60</text>
<rect x="206" y="68" width="218" height="52" fill="none" stroke="#3949ab" stroke-width="2.5" stroke-dasharray="7 4" rx="4"/>
<line x1="260" y1="170" x2="260" y2="124" stroke="#3949ab" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="20" y="160" font-weight="bold" fill="#3949ab">view</text><text x="20" y="186" font-family="Menlo, Consolas, monospace" font-size="13">v = a[1:4]</text>
<text x="20" y="208" font-size="12" fill="#555">no new buffer: v starts at byte 8 of a's buffer, shape (3,)</text>
<text x="20" y="230" font-family="Menlo, Consolas, monospace" font-size="12" fill="#3949ab">np.shares_memory(a, v)  →  True</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/><text x="470" y="234" font-weight="bold" fill="#ef6c00">copy</text><text x="520" y="234" font-family="Menlo, Consolas, monospace" font-size="13">c = a[a &gt; 30]</text>
<rect x="470" y="170" width="70" height="40" fill="#fff3e0" stroke="#ef6c00"/><text x="505" y="195" text-anchor="middle" font-family="Menlo, Consolas, monospace">40<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.75;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text><text x="505" y="195" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#e53935" opacity="0">-1<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.75;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text><line x1="385" y1="140" x2="505" y2="168" stroke="#ef6c00" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#ao)"/>
<rect x="540" y="170" width="70" height="40" fill="#fff3e0" stroke="#ef6c00"/><text x="575" y="195" text-anchor="middle" font-family="Menlo, Consolas, monospace">50</text><line x1="455" y1="140" x2="575" y2="168" stroke="#ef6c00" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#ao)"/>
<rect x="610" y="170" width="70" height="40" fill="#fff3e0" stroke="#ef6c00"/><text x="645" y="195" text-anchor="middle" font-family="Menlo, Consolas, monospace">60</text><line x1="525" y1="140" x2="645" y2="168" stroke="#ef6c00" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#ao)"/>
<text x="470" y="256" font-size="12" fill="#555">a brand-new buffer: the values were copied</text>
<text x="470" y="276" font-family="Menlo, Consolas, monospace" font-size="12" fill="#ef6c00">np.shares_memory(a, c)  →  False</text></g>
<line x1="20" y1="300" x2="740" y2="300" stroke="#ddd"/>
<text x="20" y="330" font-size="14" fill="#222" opacity="1">Step 1: v = a[1:4] makes a view. Nothing is copied.<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.3;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="20" y="330" font-size="14" fill="#3949ab" opacity="0">Step 2: v[0] = 99 writes into a's buffer, so a[1] is now 99 too.<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="20" y="330" font-size="14" fill="#ef6c00" opacity="0">Step 3: c = a[a &gt; 30] picks 40, 50, 60 into a new buffer.<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5;0.75;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="20" y="330" font-size="14" fill="#ef6c00" opacity="0">Step 4: c[0] = -1 changes only the copy: a[3] is still 40.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.75;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="20" y="360" font-family="Menlo, Consolas, monospace" font-size="13" fill="#555">a  →  </text><text x="70" y="360" font-family="Menlo, Consolas, monospace" font-size="13" fill="#555">array([10, 20, 30, 40, 50, 60])<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.3;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text><text x="70" y="360" font-family="Menlo, Consolas, monospace" font-size="13" fill="#555" opacity="0">array([10, 99, 30, 40, 50, 60])<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
</svg>
