<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#90a4ae"/></marker></defs>
  <text x="20" y="28" font-weight="bold" font-size="15">The broadcasting rule check: align right, compare column by column</text>
  <text x="300" y="72" text-anchor="middle" font-size="12" fill="#555">axis -2</text>
  <text x="420" y="72" text-anchor="middle" font-size="12" fill="#555">axis -1</text>
  <line x1="450" y1="52" x2="270" y2="52" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="460" y="56" font-size="12" fill="#555">compare from the right</text>
  <text x="20" y="112" font-weight="bold">(4, 3) + (3,)</text>
  <text x="20" y="132" font-size="12" fill="#555">matrix + row vector</text>
  <text x="258" y="105" text-anchor="end" font-size="12" fill="#3949ab">first</text>
  <text x="258" y="139" text-anchor="end" font-size="12" fill="#ef6c00">second</text>
  <rect x="272" y="86" width="56" height="28" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/><text x="300" y="105" text-anchor="middle" fill="#3949ab" font-weight="bold">4</text>
  <rect x="392" y="86" width="56" height="28" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/><text x="420" y="105" text-anchor="middle" fill="#3949ab" font-weight="bold">3</text>
  <rect x="272" y="120" width="56" height="28" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4 3"/><text x="300" y="139" text-anchor="middle" fill="#9e9e9e" font-weight="bold">1</text>
  <rect x="392" y="120" width="56" height="28" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/><text x="420" y="139" text-anchor="middle" fill="#ef6c00" font-weight="bold">3</text>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.07;0.97;1" dur="10s" repeatCount="indefinite"/>
    <rect x="386" y="81" width="68" height="72" rx="6" fill="none" stroke="#00897b" stroke-width="3"/>
    <text x="420" y="170" text-anchor="middle" font-size="11" fill="#00897b">3 = 3, equal</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.14;0.97;1" dur="10s" repeatCount="indefinite"/>
    <rect x="266" y="81" width="68" height="72" rx="6" fill="none" stroke="#00897b" stroke-width="3"/>
    <text x="300" y="170" text-anchor="middle" font-size="11" fill="#00897b">missing = 1, stretches</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.19;0.21;0.97;1" dur="10s" repeatCount="indefinite"/>
    <text x="500" y="126" font-weight="bold" font-size="17" fill="#00897b">→ (4, 3)</text>
  </g>
  <text x="20" y="222" font-weight="bold">(4, 3) + (4,)</text>
  <text x="20" y="242" font-size="12" fill="#555">matrix + vector of length 4</text>
  <text x="258" y="215" text-anchor="end" font-size="12" fill="#3949ab">first</text>
  <text x="258" y="249" text-anchor="end" font-size="12" fill="#ef6c00">second</text>
  <rect x="272" y="196" width="56" height="28" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/><text x="300" y="215" text-anchor="middle" fill="#3949ab" font-weight="bold">4</text>
  <rect x="392" y="196" width="56" height="28" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/><text x="420" y="215" text-anchor="middle" fill="#3949ab" font-weight="bold">3</text>
  <rect x="272" y="230" width="56" height="28" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4 3"/><text x="300" y="249" text-anchor="middle" fill="#9e9e9e" font-weight="bold">1</text>
  <rect x="392" y="230" width="56" height="28" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/><text x="420" y="249" text-anchor="middle" fill="#ef6c00" font-weight="bold">4</text>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.30;0.97;1" dur="10s" repeatCount="indefinite"/>
    <rect x="386" y="191" width="68" height="72" rx="6" fill="none" stroke="#e53935" stroke-width="3"/>
    <text x="420" y="280" text-anchor="middle" font-size="11" fill="#e53935">3 ≠ 4, neither is 1</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.37;0.97;1" dur="10s" repeatCount="indefinite"/>
    <text x="500" y="236" font-weight="bold" font-size="17" fill="#e53935">ValueError</text>
    <text x="500" y="254" font-size="11" fill="#555">the 4 lines up with the</text>
    <text x="500" y="268" font-size="11" fill="#555">3 columns, not the 4 rows</text>
  </g>
  <text x="20" y="332" font-weight="bold">(4, 1) + (1, 3)</text>
  <text x="20" y="352" font-size="12" fill="#555">column + row (outer)</text>
  <text x="258" y="325" text-anchor="end" font-size="12" fill="#3949ab">first</text>
  <text x="258" y="359" text-anchor="end" font-size="12" fill="#ef6c00">second</text>
  <rect x="272" y="306" width="56" height="28" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/><text x="300" y="325" text-anchor="middle" fill="#3949ab" font-weight="bold">4</text>
  <rect x="392" y="306" width="56" height="28" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/><text x="420" y="325" text-anchor="middle" fill="#3949ab" font-weight="bold">1</text>
  <rect x="272" y="340" width="56" height="28" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/><text x="300" y="359" text-anchor="middle" fill="#ef6c00" font-weight="bold">1</text>
  <rect x="392" y="340" width="56" height="28" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/><text x="420" y="359" text-anchor="middle" fill="#ef6c00" font-weight="bold">3</text>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.46;0.97;1" dur="10s" repeatCount="indefinite"/>
    <rect x="386" y="301" width="68" height="72" rx="6" fill="none" stroke="#00897b" stroke-width="3"/>
    <text x="420" y="390" text-anchor="middle" font-size="11" fill="#00897b">1 stretches to 3</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.51;0.53;0.97;1" dur="10s" repeatCount="indefinite"/>
    <rect x="266" y="301" width="68" height="72" rx="6" fill="none" stroke="#00897b" stroke-width="3"/>
    <text x="300" y="390" text-anchor="middle" font-size="11" fill="#00897b">1 stretches to 4</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.60;0.97;1" dur="10s" repeatCount="indefinite"/>
    <text x="500" y="346" font-weight="bold" font-size="17" fill="#00897b">→ (4, 3)</text>
  </g>
</svg>
