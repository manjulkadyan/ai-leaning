<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
  <rect x="0" y="0" width="680" height="260" fill="#ffffff"/>
  <!-- highlight that moves between slices -->
  <rect x="88" y="88" width="336" height="60" rx="6" fill="#fff59d" stroke="#ef6c00" stroke-width="3">
    <animate attributeName="x" values="88;424;424" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="width" values="336;168;168" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
  </rect>
  <!-- character boxes -->
  <g fill="none" stroke="#3949ab" stroke-width="1.5">
    <rect x="88" y="92" width="56" height="52"/><rect x="144" y="92" width="56" height="52"/>
    <rect x="200" y="92" width="56" height="52"/><rect x="256" y="92" width="56" height="52"/>
    <rect x="312" y="92" width="56" height="52"/><rect x="368" y="92" width="56" height="52"/>
    <rect x="424" y="92" width="56" height="52"/><rect x="480" y="92" width="56" height="52"/>
    <rect x="536" y="92" width="56" height="52"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="24" text-anchor="middle">
    <text x="116" y="127">M</text><text x="172" y="127">o</text><text x="228" y="127">b</text>
    <text x="284" y="127">i</text><text x="340" y="127">l</text><text x="396" y="127">e</text>
    <text x="452" y="127">N</text><text x="508" y="127">e</text><text x="564" y="127">t</text>
  </g>
  <!-- positive fences -->
  <text x="10" y="70" font-size="12" fill="#555">fences</text>
  <g font-family="Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#3949ab">
    <text x="88" y="70">0</text><text x="144" y="70">1</text><text x="200" y="70">2</text>
    <text x="256" y="70">3</text><text x="312" y="70">4</text><text x="368" y="70">5</text>
    <text x="424" y="70">6</text><text x="480" y="70">7</text><text x="536" y="70">8</text>
    <text x="592" y="70">9</text>
  </g>
  <g stroke="#3949ab" stroke-width="1">
    <line x1="88" y1="76" x2="88" y2="88"/><line x1="144" y1="76" x2="144" y2="88"/>
    <line x1="200" y1="76" x2="200" y2="88"/><line x1="256" y1="76" x2="256" y2="88"/>
    <line x1="312" y1="76" x2="312" y2="88"/><line x1="368" y1="76" x2="368" y2="88"/>
    <line x1="424" y1="76" x2="424" y2="88"/><line x1="480" y1="76" x2="480" y2="88"/>
    <line x1="536" y1="76" x2="536" y2="88"/><line x1="592" y1="76" x2="592" y2="88"/>
  </g>
  <!-- negative indices, on the fences -->
  <text x="10" y="178" font-size="12" fill="#555">negative</text>
  <g stroke="#00897b" stroke-width="1">
    <line x1="88" y1="148" x2="88" y2="160"/><line x1="144" y1="148" x2="144" y2="160"/>
    <line x1="200" y1="148" x2="200" y2="160"/><line x1="256" y1="148" x2="256" y2="160"/>
    <line x1="312" y1="148" x2="312" y2="160"/><line x1="368" y1="148" x2="368" y2="160"/>
    <line x1="424" y1="148" x2="424" y2="160"/><line x1="480" y1="148" x2="480" y2="160"/>
    <line x1="536" y1="148" x2="536" y2="160"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#00897b">
    <text x="88" y="178">-9</text><text x="144" y="178">-8</text><text x="200" y="178">-7</text>
    <text x="256" y="178">-6</text><text x="312" y="178">-5</text><text x="368" y="178">-4</text>
    <text x="424" y="178">-3</text><text x="480" y="178">-2</text><text x="536" y="178">-1</text>
  </g>
  <!-- the code and result for each phase -->
  <g font-family="Menlo, Consolas, monospace" font-size="18">
    <text x="340" y="220" text-anchor="middle">s[0:6]  →  'Mobile'
      <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="340" y="220" text-anchor="middle" opacity="0">s[6:]  →  'Net'
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="340" y="220" text-anchor="middle" opacity="0">s[-3:]  →  'Net'
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="340" y="245">from fence 0 up to fence 6: 6 characters, fence 6 not included
      <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="340" y="245" opacity="0">from fence 6 to the end: picks up exactly where s[0:6] stopped
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="340" y="245" opacity="0">from fence -3 to the end: the last three characters
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>
  <!-- marker on the -3 label in phase 3 -->
  <circle cx="424" cy="173" r="13" fill="none" stroke="#e53935" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>
