<g font-size="12"><line x1="30" y1="312" x2="56" y2="312" stroke="#3949ab" stroke-width="3"/><text x="62" y="316">y = x²</text><line x1="120" y1="312" x2="146" y2="312" stroke="#e53935" stroke-width="2" stroke-dasharray="7 4"/><text x="152" y="316">tangent y = 1 + 2(x − 1), slope f′(1) = 2</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="11.0s" repeatCount="indefinite" keyTimes="0;0.6000" values="0;1"/><rect x="30" y="328" width="690" height="56" rx="8" fill="#fff59d"/><text x="44" y="351" font-size="14" font-weight="bold">Close up, f behaves like a line of slope f′(1) = 2: nudge x by Δx and y moves by ≈ 2·Δx.</text><text x="44" y="372" font-size="13" fill="#555">Δx = 0.01: f(1.01) − f(1) = 0.0201, and 2 × 0.01 = 0.02. The leftover 0.0001 is Δx², which shrinks far faster than Δx.</text></g>
