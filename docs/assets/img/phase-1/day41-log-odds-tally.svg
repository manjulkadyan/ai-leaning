<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 374" font-family="Helvetica, Arial, sans-serif" font-size="13" class="animated">
<text x="14" y="24" font-weight="bold" font-size="15">Adding up the evidence: "You won! Reply WIN to get your prize today"</text>
<text x="14" y="44" font-size="12" fill="#555">Each word adds log P(word | spam) − log P(word | ham) to the log-odds. Right of 0 means spam is more likely.</text>
<rect x="165.0" y="72" width="112.5" height="222" fill="#e0f2f1" opacity="0.6"/>
<rect x="277.5" y="72" width="337.5" height="222" fill="#fff3e0" opacity="0.6"/>
<text x="271.5" y="67" font-size="11" fill="#00897b" text-anchor="end">← ham more likely</text>
<text x="283.5" y="67" font-size="11" fill="#ef6c00">spam more likely →</text>
<text x="632" y="67" font-size="11" fill="#555">word adds → total</text>
<line x1="165.0" y1="72" x2="165.0" y2="294" stroke="#bbb" stroke-width="0.7" stroke-dasharray="3 3"/>
<line x1="277.5" y1="72" x2="277.5" y2="294" stroke="#bbb" stroke-width="1.5" />
<line x1="390.0" y1="72" x2="390.0" y2="294" stroke="#bbb" stroke-width="0.7" stroke-dasharray="3 3"/>
<line x1="502.5" y1="72" x2="502.5" y2="294" stroke="#bbb" stroke-width="0.7" stroke-dasharray="3 3"/>
<line x1="615.0" y1="72" x2="615.0" y2="294" stroke="#bbb" stroke-width="0.7" stroke-dasharray="3 3"/>
<line x1="165" y1="294" x2="615" y2="294" stroke="#555" stroke-width="1.2"/>
<text x="165.0" y="310" text-anchor="middle" font-size="11">-2</text>
<text x="165.0" y="325" text-anchor="middle" font-size="10.5" fill="#555">P = 0.119</text>
<text x="277.5" y="310" text-anchor="middle" font-size="11">0</text>
<text x="277.5" y="325" text-anchor="middle" font-size="10.5" fill="#555">P = 0.500</text>
<text x="390.0" y="310" text-anchor="middle" font-size="11">+2</text>
<text x="390.0" y="325" text-anchor="middle" font-size="10.5" fill="#555">P = 0.881</text>
<text x="502.5" y="310" text-anchor="middle" font-size="11">+4</text>
<text x="502.5" y="325" text-anchor="middle" font-size="10.5" fill="#555">P = 0.982</text>
<text x="615.0" y="310" text-anchor="middle" font-size="11">+6</text>
<text x="615.0" y="325" text-anchor="middle" font-size="10.5" fill="#555">P = 0.998</text>
<text x="14" y="310" font-size="11" fill="#555">log-odds</text>
<text x="14" y="325" font-size="10.5" fill="#555">same as P(spam)</text>
<g opacity="1"><text x="14" y="92" font-family="Menlo, Consolas, monospace" font-size="12" fill="#3949ab">prior P(spam)=0.4</text><rect x="254.7" y="81" width="22.8" height="15" rx="2" fill="#80cbc4" stroke="#00897b" stroke-width="1.2"/><line x1="254.7" y1="96" x2="254.7" y2="102" stroke="#555" stroke-width="1"/><text x="632.0" y="92" font-size="11" fill="#00897b">-0.41  → -0.41</text></g>
