<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.5455" dur="14.3s" repeatCount="indefinite"/><text x="14" y="218" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">get</text><rect x="490.8" y="207" width="1.9" height="15" rx="2" fill="#ef9a9a" stroke="#e53935" stroke-width="1.2"/><line x1="492.7" y1="222" x2="492.7" y2="228" stroke="#555" stroke-width="1"/><text x="632.0" y="218" font-size="11" fill="#e53935">+0.03  → +3.83</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.6364" dur="14.3s" repeatCount="indefinite"/><text x="14" y="239" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">your</text><rect x="492.7" y="228" width="30.7" height="15" rx="2" fill="#ef9a9a" stroke="#e53935" stroke-width="1.2"/><line x1="523.4" y1="243" x2="523.4" y2="249" stroke="#555" stroke-width="1"/><text x="632.0" y="239" font-size="11" fill="#e53935">+0.55  → +4.37</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.7273" dur="14.3s" repeatCount="indefinite"/><text x="14" y="260" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">prize</text><rect x="523.4" y="249" width="63.7" height="15" rx="2" fill="#ef9a9a" stroke="#e53935" stroke-width="1.2"/><line x1="587.1" y1="264" x2="587.1" y2="270" stroke="#555" stroke-width="1"/><text x="632.0" y="260" font-size="11" fill="#e53935">+1.13  → +5.50</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.8182" dur="14.3s" repeatCount="indefinite"/><text x="14" y="281" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">today</text><rect x="587.1" y="270" width="1.9" height="15" rx="2" fill="#ef9a9a" stroke="#e53935" stroke-width="1.2"/><text x="632.0" y="281" font-size="11" fill="#e53935">+0.03  → +5.54</text></g>
<line x1="254.7" y1="72" x2="254.7" y2="294" stroke="#3949ab" stroke-width="2"><animate attributeName="x1" calcMode="discrete" values="254.7;211.0;274.7;338.5;379.4;490.8;492.7;523.4;587.1;589.1;589.1" keyTimes="0.0000;0.0909;0.1818;0.2727;0.3636;0.4545;0.5455;0.6364;0.7273;0.8182;0.9091" dur="14.3s" repeatCount="indefinite"/><animate attributeName="x2" calcMode="discrete" values="254.7;211.0;274.7;338.5;379.4;490.8;492.7;523.4;587.1;589.1;589.1" keyTimes="0.0000;0.0909;0.1818;0.2727;0.3636;0.4545;0.5455;0.6364;0.7273;0.8182;0.9091" dur="14.3s" repeatCount="indefinite"/></line>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.9091" dur="14.3s" repeatCount="indefinite"/><rect x="300" y="338" width="446" height="26" rx="6" fill="#fff59d" stroke="#ef6c00"/><text x="523" y="356" text-anchor="middle" font-weight="bold" fill="#e53935">log-odds +5.54  →  P(spam) = 0.996  →  spam (correct)</text></g>
<text x="14" y="356" font-size="11" fill="#555">P(spam) = 1 / (1 + e^(−log-odds))</text>
