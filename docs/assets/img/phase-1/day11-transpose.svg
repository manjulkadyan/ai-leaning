<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" font-family="Helvetica, Arial, sans-serif" font-size="18">
  <defs>
    <marker id="d11t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <text x="20" y="28" font-weight="bold" font-size="15">Transpose: flip across the main diagonal</text>
  <!-- A: 2 x 3, cells 50px, top-left (50,70) -->
  <g stroke="#fff" stroke-width="2">
    <rect x="50" y="70" width="50" height="50" fill="#c5cae9"/><rect x="100" y="70" width="50" height="50" fill="#c5cae9"/><rect x="150" y="70" width="50" height="50" fill="#c5cae9"/>
    <rect x="50" y="120" width="50" height="50" fill="#b2dfdb"/><rect x="100" y="120" width="50" height="50" fill="#b2dfdb"/><rect x="150" y="120" width="50" height="50" fill="#b2dfdb"/>
  </g>
  <line x1="42" y1="62" x2="160" y2="180" stroke="#e53935" stroke-width="2" stroke-dasharray="6 4"/>
  <g text-anchor="middle">
    <text x="75" y="102" fill="#3949ab" font-weight="bold" stroke="#fff" stroke-width="5" paint-order="stroke">1</text><text x="125" y="102" fill="#3949ab">2</text><text x="175" y="102" fill="#3949ab">3</text>
    <text x="75" y="152" fill="#00897b">4</text><text x="125" y="152" fill="#00897b" font-weight="bold" stroke="#fff" stroke-width="5" paint-order="stroke">5</text><text x="175" y="152" fill="#00897b">6</text>
  </g>
  <text x="125" y="205" text-anchor="middle" font-size="14" font-weight="bold">A</text>
  <text x="125" y="224" text-anchor="middle" font-size="13" fill="#555">shape (2, 3)</text>

  <!-- arrow -->
  <line x1="240" y1="120" x2="330" y2="120" stroke="#555" stroke-width="2" marker-end="url(#d11t)"/>
  <text x="285" y="108" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace">A.T</text>
  <text x="285" y="142" text-anchor="middle" font-size="12" fill="#555">rows become</text>
  <text x="285" y="157" text-anchor="middle" font-size="12" fill="#555">columns</text>

  <!-- A.T: 3 x 2, top-left (370,45) -->
  <g stroke="#fff" stroke-width="2">
    <rect x="370" y="45" width="50" height="50" fill="#c5cae9"/><rect x="370" y="95" width="50" height="50" fill="#c5cae9"/><rect x="370" y="145" width="50" height="50" fill="#c5cae9"/>
    <rect x="420" y="45" width="50" height="50" fill="#b2dfdb"/><rect x="420" y="95" width="50" height="50" fill="#b2dfdb"/><rect x="420" y="145" width="50" height="50" fill="#b2dfdb"/>
  </g>
  <line x1="362" y1="37" x2="480" y2="155" stroke="#e53935" stroke-width="2" stroke-dasharray="6 4"/>
  <g text-anchor="middle">
    <text x="395" y="77" fill="#3949ab" font-weight="bold" stroke="#fff" stroke-width="5" paint-order="stroke">1</text><text x="395" y="127" fill="#3949ab">2</text><text x="395" y="177" fill="#3949ab">3</text>
    <text x="445" y="77" fill="#00897b">4</text><text x="445" y="127" fill="#00897b" font-weight="bold" stroke="#fff" stroke-width="5" paint-order="stroke">5</text><text x="445" y="177" fill="#00897b">6</text>
  </g>
  <text x="420" y="220" text-anchor="middle" font-size="14" font-weight="bold" font-family="Menlo, Consolas, monospace">A.T</text>
  <text x="420" y="239" text-anchor="middle" font-size="13" fill="#555">shape (3, 2)</text>

  <text x="495" y="90" font-size="12" fill="#e53935">diagonal</text>
  <text x="495" y="105" font-size="12" fill="#e53935">(1 and 5)</text>
  <text x="495" y="120" font-size="12" fill="#e53935">stays put</text>
  <text x="300" y="262" text-anchor="middle" font-size="12" fill="#555">A[i, j] moves to A.T[j, i]: row 0 [1, 2, 3] becomes column 0</text>
</svg>
