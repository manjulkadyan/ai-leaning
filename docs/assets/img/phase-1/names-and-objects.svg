<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Helvetica, Arial, sans-serif" font-size="15" class="animated">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3949ab"/>
    </marker>
  </defs>
  <!-- code lines, highlighted one after another -->
  <g font-family="Menlo, Consolas, monospace" font-size="14">
    <rect x="15" y="22" width="200" height="26" rx="4" fill="#fff59d" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.3;0.33;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="15" y="52" width="200" height="26" rx="4" fill="#fff59d" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.63;0.66;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="15" y="82" width="200" height="26" rx="4" fill="#fff59d" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.69;0.95;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="25" y="40">a = [1, 2]</text>
    <text x="25" y="70">b = a</text>
    <text x="25" y="100">b.append(3)</text>
  </g>
  <text x="270" y="150" font-size="13" fill="#555">Names (labels)</text>
  <text x="420" y="150" font-size="13" fill="#555">Object in memory</text>

  <!-- name a -->
  <rect x="270" y="170" width="60" height="34" rx="6" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="300" y="192" text-anchor="middle" font-weight="bold">a</text>
  <!-- name b appears at step 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.33;0.36;0.95;1" dur="9s" repeatCount="indefinite"/>
    <rect x="270" y="215" width="60" height="34" rx="6" fill="#e8eaf6" stroke="#3949ab"/>
    <text x="300" y="237" text-anchor="middle" font-weight="bold">b</text>
    <line x1="330" y1="232" x2="418" y2="200" stroke="#3949ab" stroke-width="2" marker-end="url(#h)"/>
  </g>
  <line x1="330" y1="187" x2="418" y2="187" stroke="#3949ab" stroke-width="2" marker-end="url(#h)"/>

  <!-- the list object -->
  <rect x="420" y="165" width="130" height="44" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="440" y="193" font-family="Menlo, Consolas, monospace">[1, 2</text>
  <text x="490" y="193" font-family="Menlo, Consolas, monospace" fill="#c62828" font-weight="bold" opacity="0">, 3
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.69;0.72;0.95;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="530" y="193" font-family="Menlo, Consolas, monospace">]</text>
  <text x="420" y="235" font-size="12" fill="#555">one list, two names: changing it</text>
  <text x="420" y="251" font-size="12" fill="#555">through b is visible through a</text>
</svg>
