<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 304" font-family="Helvetica, Arial, sans-serif" font-size="14">
<text x="20" y="28" font-weight="bold" font-size="15">s + t matches values by label, not by position</text>
<text x="100" y="60" text-anchor="middle" font-weight="bold" fill="#3949ab">s</text>
<rect x="20" y="70" width="78" height="34" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/><text x="59" y="92" text-anchor="middle" fill="#555" font-weight="bold">chat</text><rect x="98" y="70" width="82" height="34" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.4"/><text x="139" y="92" text-anchor="middle" fill="#222" font-weight="normal">4.5</text>
<rect x="20" y="104" width="78" height="34" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/><text x="59" y="126" text-anchor="middle" fill="#555" font-weight="bold">maps</text><rect x="98" y="104" width="82" height="34" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.4"/><text x="139" y="126" text-anchor="middle" fill="#222" font-weight="normal">3.9</text>
<rect x="20" y="138" width="78" height="34" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/><text x="59" y="160" text-anchor="middle" fill="#555" font-weight="bold">notes</text><rect x="98" y="138" width="82" height="34" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.4"/><text x="139" y="160" text-anchor="middle" fill="#222" font-weight="normal">4.8</text>
<text x="200" y="125" text-anchor="middle" font-size="24" fill="#555">+</text>
<text x="300" y="60" text-anchor="middle" font-weight="bold" fill="#ef6c00">t</text>
<rect x="220" y="70" width="78" height="34" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/><text x="259" y="92" text-anchor="middle" fill="#555" font-weight="bold">notes</text><rect x="298" y="70" width="82" height="34" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.4"/><text x="339" y="92" text-anchor="middle" fill="#222" font-weight="normal">100</text>
<rect x="220" y="104" width="78" height="34" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/><text x="259" y="126" text-anchor="middle" fill="#555" font-weight="bold">chat</text><rect x="298" y="104" width="82" height="34" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.4"/><text x="339" y="126" text-anchor="middle" fill="#222" font-weight="normal">200</text>
<rect x="220" y="138" width="78" height="34" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/><text x="259" y="160" text-anchor="middle" fill="#555" font-weight="bold">camera</text><rect x="298" y="138" width="82" height="34" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.4"/><text x="339" y="160" text-anchor="middle" fill="#222" font-weight="normal">300</text>
<text x="400" y="125" text-anchor="middle" font-size="24" fill="#555">=</text>
<text x="500" y="60" text-anchor="middle" font-weight="bold" fill="#00897b">s + t</text>
<rect x="420" y="70" width="78" height="34" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/><text x="459" y="92" text-anchor="middle" fill="#555" font-weight="bold">camera</text><rect x="498" y="70" width="82" height="34" fill="#ffebee" stroke="#00897b" stroke-width="1.4"/><text x="539" y="92" text-anchor="middle" fill="#e53935" font-weight="bold">NaN</text>
<rect x="420" y="104" width="78" height="34" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/><text x="459" y="126" text-anchor="middle" fill="#555" font-weight="bold">chat</text><rect x="498" y="104" width="82" height="34" fill="#e0f2f1" stroke="#00897b" stroke-width="1.4"/><text x="539" y="126" text-anchor="middle" fill="#222" font-weight="normal">204.5</text>
<rect x="420" y="138" width="78" height="34" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/><text x="459" y="160" text-anchor="middle" fill="#555" font-weight="bold">maps</text><rect x="498" y="138" width="82" height="34" fill="#ffebee" stroke="#00897b" stroke-width="1.4"/><text x="539" y="160" text-anchor="middle" fill="#e53935" font-weight="bold">NaN</text>
<rect x="420" y="172" width="78" height="34" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/><text x="459" y="194" text-anchor="middle" fill="#555" font-weight="bold">notes</text><rect x="498" y="172" width="82" height="34" fill="#e0f2f1" stroke="#00897b" stroke-width="1.4"/><text x="539" y="194" text-anchor="middle" fill="#222" font-weight="normal">104.8</text>
<text x="20" y="230" font-size="12" fill="#555">chat: 4.5 + 200 = 204.5 and notes: 4.8 + 100 = 104.8, even though they sit in different rows.</text>
<text x="20" y="250" font-size="12" fill="#555">maps is only in s and camera only in t, so they have no partner and become NaN ("not a number" = missing).</text>
<text x="20" y="270" font-size="12" fill="#555">The result index is the union of both indexes, sorted.</text>
<text x="20" y="290" font-size="12" fill="#555">Plain NumPy arrays would add by position instead: [104.5, 203.9, 304.8].</text>
</svg>