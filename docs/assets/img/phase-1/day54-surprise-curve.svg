<text x="592" y="230" text-anchor="middle" font-size="12">independent events: probabilities</text>
<text x="592" y="248" text-anchor="middle" font-size="12">multiply, surprises add,</text>
<text x="592" y="266" text-anchor="middle" font-size="12">because log(a·b) = log a + log b</text>
