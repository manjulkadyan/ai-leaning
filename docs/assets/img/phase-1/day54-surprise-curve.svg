<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12.5s" repeatCount="indefinite" keyTimes="0;0.400;0.600" values="0;1;0"/><line x1="165.0" y1="280" x2="165.0" y2="214.3" stroke="#ef6c00" stroke-dasharray="4 3"/><line x1="70" y1="214.3" x2="165.0" y2="214.3" stroke="#ef6c00" stroke-dasharray="4 3"/><circle cx="165.0" cy="214.3" r="7" fill="#e53935"/><rect x="480" y="70" width="225" height="120" rx="8" fill="#fff3e0"/><text x="592" y="98" text-anchor="middle" font-weight="bold" fill="#ef6c00">p = 1/4</text><text x="592" y="124" text-anchor="middle" font-size="13">two heads in a row</text><text x="592" y="150" text-anchor="middle" font-size="13">log₂(1/p) = <tspan font-weight="bold" fill="#e53935">2</tspan></text><text x="592" y="174" text-anchor="middle" font-size="12" fill="#555">2 bits = 1 + 1</text></g>
