<circle r="6" fill="#e53935" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.5444;0.6000" values="0;1;0"/><animateMotion dur="18s" repeatCount="indefinite" path="M317.1,222.2 L116.0,285.5" keyPoints="0;0;1;1" keyTimes="0;0.5444;0.6000;1" calcMode="linear"/></circle>
