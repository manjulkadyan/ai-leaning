<text x="610" y="221" text-anchor="middle" font-size="17" font-weight="bold">L</text>
<text x="318" y="160" text-anchor="middle" font-size="13" fill="#3949ab" font-weight="bold" opacity="0">w·x = 1.5<animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.0667;0.9667" values="0;1;0"/></text>
<text x="405" y="205" text-anchor="middle" font-size="13" fill="#3949ab" font-weight="bold" opacity="0">z = 1<animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.1333;0.9667" values="0;1;0"/></text>
<text x="540" y="205" text-anchor="middle" font-size="13" fill="#3949ab" font-weight="bold" opacity="0">a = 0.731<animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.2000;0.9667" values="0;1;0"/></text>
<text x="690" y="220" text-anchor="middle" font-size="13" fill="#3949ab" font-weight="bold" opacity="0">L = 0.0723<animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.2667;0.9667" values="0;1;0"/></text>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.3667;0.9667" values="0;1;0"/><rect x="572.6" y="154" width="74.8" height="20" rx="4" fill="#ffebee"/><text x="610" y="169" text-anchor="middle" font-size="13" fill="#e53935" font-weight="bold">∂L/∂L = 1</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.4444;0.9667" values="0;1;0"/><rect x="484.6" y="230" width="110.8" height="20" rx="4" fill="#ffebee"/><text x="540" y="245" text-anchor="middle" font-size="13" fill="#e53935" font-weight="bold">∂L/∂a = −0.538</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.5222;0.9667" values="0;1;0"/><rect x="349.6" y="230" width="110.8" height="20" rx="4" fill="#ffebee"/><text x="405" y="245" text-anchor="middle" font-size="13" fill="#e53935" font-weight="bold">∂L/∂z = −0.106</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.6000;0.9667" values="0;1;0"/><rect x="278.4" y="99" width="53.2" height="20" rx="4" fill="#ffebee"/><text x="305" y="114" text-anchor="middle" font-size="13" fill="#e53935" font-weight="bold">−0.106</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.6000;0.9667" values="0;1;0"/><rect x="149.6" y="286" width="110.8" height="20" rx="4" fill="#ffebee"/><text x="205" y="301" text-anchor="middle" font-size="13" fill="#e53935" font-weight="bold">∂L/∂b = −0.106</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.6778;0.9667" values="0;1;0"/><rect x="14.6" y="44" width="110.8" height="20" rx="4" fill="#ffebee"/><text x="70" y="59" text-anchor="middle" font-size="13" fill="#e53935" font-weight="bold">∂L/∂w = −0.212</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.6778;0.9667" values="0;1;0"/><rect x="14.6" y="218" width="110.8" height="20" rx="4" fill="#ffebee"/><text x="70" y="233" text-anchor="middle" font-size="13" fill="#e53935" font-weight="bold">∂L/∂x = −0.079</text></g>
<circle r="6" fill="#e53935" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.6222;0.6778" values="0;1;0"/><animateMotion dur="18s" repeatCount="indefinite" path="M192.3,132.2 L116.0,105.9" keyPoints="0;0;1;1" keyTimes="0;0.6222;0.6778;1" calcMode="linear"/></circle>
<circle r="6" fill="#e53935" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.6222;0.6778" values="0;1;0"/><animateMotion dur="18s" repeatCount="indefinite" path="M192.3,147.8 L116.0,174.1" keyPoints="0;0;1;1" keyTimes="0;0.6222;0.6778;1" calcMode="linear"/></circle>
