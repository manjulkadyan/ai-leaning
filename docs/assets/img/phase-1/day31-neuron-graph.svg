<circle r="6" fill="#e53935" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.3889;0.4444" values="0;1;0"/><animateMotion dur="18s" repeatCount="indefinite" path="M586.0,215.0 L494.0,215.0" keyPoints="0;0;1;1" keyTimes="0;0.3889;0.4444;1" calcMode="linear"/></circle>
<rect x="20" y="350" width="720" height="36" rx="8" fill="#f5f5f5"/>
<text x="380.0" y="373" text-anchor="middle" font-size="14" opacity="1"><tspan fill="#555">Forward: weighted sum, sigmoid, squared error against the target y = 1.</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.0667" values="1;0"/></text>
<text x="380.0" y="373" text-anchor="middle" font-size="14" opacity="0">forward: <tspan font-style="italic">w</tspan> · <tspan font-style="italic">x</tspan> = 0.75 · 2 = <tspan fill="#3949ab" font-weight="bold">1.5</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.0667;0.1333" values="0;1;0"/></text>
<text x="380.0" y="373" text-anchor="middle" font-size="14" opacity="0">forward: <tspan font-style="italic">z</tspan> = 1.5 + (−0.5) = <tspan fill="#3949ab" font-weight="bold">1</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.1333;0.2000" values="0;1;0"/></text>
<text x="380.0" y="373" text-anchor="middle" font-size="14" opacity="0">forward: <tspan font-style="italic">a</tspan> = σ(1) = <tspan fill="#3949ab" font-weight="bold">0.731</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.2000;0.2667" values="0;1;0"/></text>
<text x="380.0" y="373" text-anchor="middle" font-size="14" opacity="0">forward: <tspan font-style="italic">L</tspan> = (0.731 − 1)² = <tspan fill="#3949ab" font-weight="bold">0.0723</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.2667;0.3667" values="0;1;0"/></text>
<text x="380.0" y="373" text-anchor="middle" font-size="14" opacity="0">backward starts at the loss: ∂L/∂L = <tspan fill="#e53935" font-weight="bold">1</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.3667;0.4444" values="0;1;0"/></text>
<text x="380.0" y="373" text-anchor="middle" font-size="14" opacity="0">squared error: local gradient 2(<tspan font-style="italic">a</tspan> − <tspan font-style="italic">y</tspan>) = <tspan fill="#e53935" font-weight="bold">−0.538</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.4444;0.5222" values="0;1;0"/></text>
<text x="380.0" y="373" text-anchor="middle" font-size="14" opacity="0">sigmoid: local gradient σ(1)(1 − σ(1)) = 0.197, so −0.538 · 0.197 = <tspan fill="#e53935" font-weight="bold">−0.106</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.5222;0.6000" values="0;1;0"/></text>
<text x="380.0" y="373" text-anchor="middle" font-size="14" opacity="0">adding passes −0.106 unchanged to both inputs: b gets <tspan fill="#e53935" font-weight="bold">−0.106</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.6000;0.6778" values="0;1;0"/></text>
<text x="380.0" y="373" text-anchor="middle" font-size="14" opacity="0">multiplying: w gets x · (−0.106) = <tspan fill="#e53935" font-weight="bold">−0.212</tspan>, x gets w · (−0.106) = <tspan fill="#e53935" font-weight="bold">−0.079</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.6778;1.0000" values="0;1;0"/></text>
<text x="740" y="314" text-anchor="end" font-size="12" fill="#555"><tspan fill="#3949ab" font-weight="bold">blue</tspan> = value</text>
<text x="740" y="330" text-anchor="end" font-size="12" fill="#555"><tspan fill="#e53935" font-weight="bold">red</tspan> = gradient</text>
</svg>