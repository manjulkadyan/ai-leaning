<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<text x="20" y="28" font-weight="bold" font-size="15">One joint table gives you the marginals, the conditionals and an independence test</text>
<text x="176.0" y="85" text-anchor="middle" font-weight="bold">no crash</text>
<text x="268.0" y="85" text-anchor="middle" font-weight="bold">crash</text>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite" keyTimes="0;0.600" values="0;1"/><rect x="30" y="100" width="284" height="40" fill="#fff59d" stroke="#ef6c00" stroke-width="2.5"/></g>
<text x="35" y="125" font-weight="bold">low-end</text>
<rect x="130" y="100" width="92" height="40" fill="#e8eaf6" fill-opacity="0.6" stroke="#9fa8da"/>
<text x="176.0" y="126" text-anchor="middle" font-size="16">0.17</text>
<rect x="222" y="100" width="92" height="40" fill="#e8eaf6" fill-opacity="0.6" stroke="#9fa8da"/>
<text x="268.0" y="126" text-anchor="middle" font-size="16">0.03</text>
<text x="35" y="165" font-weight="bold">mid-range</text>
<rect x="130" y="140" width="92" height="40" fill="#e8eaf6" fill-opacity="0.6" stroke="#9fa8da"/>
<text x="176.0" y="166" text-anchor="middle" font-size="16">0.38</text>
<rect x="222" y="140" width="92" height="40" fill="#e8eaf6" fill-opacity="0.6" stroke="#9fa8da"/>
<text x="268.0" y="166" text-anchor="middle" font-size="16">0.02</text>
<text x="35" y="205" font-weight="bold">high-end</text>
<rect x="130" y="180" width="92" height="40" fill="#e8eaf6" fill-opacity="0.6" stroke="#9fa8da"/>
<text x="176.0" y="206" text-anchor="middle" font-size="16">0.39</text>
<rect x="222" y="180" width="92" height="40" fill="#e8eaf6" fill-opacity="0.6" stroke="#9fa8da"/>
<text x="268.0" y="206" text-anchor="middle" font-size="16">0.01</text>
<text x="130" y="284" font-size="12" fill="#555">Each cell: P(tier and crash). All six add to 1.</text>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite" keyTimes="0;0.200" values="0;1"/><text x="360.0" y="76" text-anchor="middle" font-weight="bold" fill="#00897b">P(tier)</text><text x="360.0" y="93" text-anchor="middle" font-size="11" fill="#00897b">add across →</text><rect x="314" y="100" width="92" height="40" fill="#e0f2f1" stroke="#00897b"/><text x="360.0" y="126" text-anchor="middle" font-size="16" fill="#00897b" font-weight="bold">0.20</text><rect x="314" y="140" width="92" height="40" fill="#e0f2f1" stroke="#00897b"/><text x="360.0" y="166" text-anchor="middle" font-size="16" fill="#00897b" font-weight="bold">0.40</text><rect x="314" y="180" width="92" height="40" fill="#e0f2f1" stroke="#00897b"/><text x="360.0" y="206" text-anchor="middle" font-size="16" fill="#00897b" font-weight="bold">0.40</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite" keyTimes="0;0.400" values="0;1"/><text x="35" y="245" font-weight="bold" fill="#ef6c00">P(crash)</text><rect x="130" y="220" width="92" height="40" fill="#fff3e0" stroke="#ef6c00"/><text x="176.0" y="246" text-anchor="middle" font-size="16" fill="#ef6c00" font-weight="bold">0.94</text><rect x="222" y="220" width="92" height="40" fill="#fff3e0" stroke="#ef6c00"/><text x="268.0" y="246" text-anchor="middle" font-size="16" fill="#ef6c00" font-weight="bold">0.06</text><text x="322" y="246" font-size="12" fill="#ef6c00">↑ add down</text></g>
<rect x="460" y="45" width="270" height="285" rx="8" fill="#fff3e0" fill-opacity="0.5"/>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite" keyTimes="0;0.200" values="0;1"/><text x="470" y="72" font-size="13" font-weight="bold" fill="#00897b">Marginal: ignore the other variable</text><text x="470" y="92" font-size="13">P(low) = 0.17 + 0.03 = 0.20</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite" keyTimes="0;0.400" values="0;1"/><text x="470" y="116" font-size="13">P(crash) = 0.03 + 0.02 + 0.01 = 0.06</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite" keyTimes="0;0.600" values="0;1"/><text x="470" y="148" font-size="13" font-weight="bold" fill="#ef6c00">Conditional: zoom into one row</text><text x="470" y="168" font-size="13">P(crash | low) = 0.03 / 0.20 = 0.15</text><text x="470" y="188" font-size="13">P(no crash | low) = 0.17 / 0.20 = 0.85</text><text x="470" y="206" font-size="12" fill="#555">(the row, divided by its total)</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite" keyTimes="0;0.800" values="0;1"/><text x="470" y="238" font-size="13" font-weight="bold" fill="#e53935">Independent? Test one cell:</text><text x="470" y="258" font-size="13">P(low) × P(crash) = 0.20 × 0.06</text><text x="470" y="278" font-size="13">= 0.012, but the table says 0.03</text><text x="470" y="304" font-size="13" fill="#e53935" font-weight="bold">Not independent: low-end phones</text><text x="470" y="322" font-size="13" fill="#e53935" font-weight="bold">crash more often.</text></g>
</svg>