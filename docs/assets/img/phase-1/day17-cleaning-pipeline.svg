</g>
<text x="380" y="300" text-anchor="middle" font-size="13" fill="#333">A raw row, plus an exact duplicate of it further down the file.<animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.125" dur="16s" repeatCount="indefinite"/></text>
<text x="380" y="300" text-anchor="middle" font-size="13" fill="#333" opacity="0">Step 1: drop_duplicates() keeps the first copy and drops the twin (486 → 480 rows).<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.125;0.25" dur="16s" repeatCount="indefinite"/></text>
<text x="380" y="300" text-anchor="middle" font-size="13" fill="#333" opacity="0">Step 2: strip the space, title-case the text: 26 spellings become 8 categories.<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.25;0.375" dur="16s" repeatCount="indefinite"/></text>
<text x="380" y="300" text-anchor="middle" font-size="13" fill="#333" opacity="0">Step 3: remove &quot;,&quot; and &quot;+&quot;, then astype(int64): the text becomes a number you can sum.<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.375;0.5" dur="16s" repeatCount="indefinite"/></text>
<text x="380" y="300" text-anchor="middle" font-size="13" fill="#333" opacity="0">Step 4: &quot;Varies with device&quot; becomes NaN, so the column can be float64.<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.5;0.625" dur="16s" repeatCount="indefinite"/></text>
<text x="380" y="300" text-anchor="middle" font-size="13" fill="#333" opacity="0">Step 5: pd.to_datetime turns text into real dates you can subtract and sort.<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.625;0.75" dur="16s" repeatCount="indefinite"/></text>
<text x="380" y="300" text-anchor="middle" font-size="13" fill="#333" opacity="0">Step 6: 10.0 becomes the version string &quot;10&quot; (8.0 stays &quot;8.0&quot;).<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.75;0.875" dur="16s" repeatCount="indefinite"/></text>
<text x="380" y="300" text-anchor="middle" font-size="13" fill="#333" opacity="0">Done: one meaning and one dtype per column. Missing values are visible as NaN.<animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.875" dur="16s" repeatCount="indefinite"/></text>
<text x="380" y="336" text-anchor="middle" font-size="11" fill="#555">Illustrative row combining the kinds of mess in play_store_apps.csv. Yellow = step in progress, teal = done.</text>
</svg>
