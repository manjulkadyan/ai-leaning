<text x="30" y="300" font-size="12" fill="#555">H(p) is fixed by reality: no model can get below it.</text>
<text x="30" y="318" font-size="12" fill="#555">KL(p ‖ q) is the extra cost of believing q; it shrinks to 0 only when q = p.</text>
<text x="30" y="336" font-size="12" fill="#555">Training a classifier pushes q towards p, which removes the red part.</text>
</svg>