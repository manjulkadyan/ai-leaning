<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
  <defs>
    <marker id="d5ha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3949ab"/></marker>
    <marker id="d5hb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00897b"/></marker>
    <marker id="d5hs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53935"/></marker>
  </defs>
  <!-- grid: origin at (60,300), 1 unit = 50px -->
  <g stroke="#eceff1">
    <line x1="60" y1="50" x2="60" y2="300"/><line x1="110" y1="50" x2="110" y2="300"/><line x1="160" y1="50" x2="160" y2="300"/><line x1="210" y1="50" x2="210" y2="300"/><line x1="260" y1="50" x2="260" y2="300"/><line x1="310" y1="50" x2="310" y2="300"/><line x1="360" y1="50" x2="360" y2="300"/>
    <line x1="60" y1="300" x2="360" y2="300"/><line x1="60" y1="250" x2="360" y2="250"/><line x1="60" y1="200" x2="360" y2="200"/><line x1="60" y1="150" x2="360" y2="150"/><line x1="60" y1="100" x2="360" y2="100"/><line x1="60" y1="50" x2="360" y2="50"/>
  </g>
  <g stroke="#90a4ae" stroke-width="1.5"><line x1="60" y1="300" x2="370" y2="300"/><line x1="60" y1="300" x2="60" y2="40"/></g>
  <g font-size="11" fill="#90a4ae"><text x="106" y="316">1</text><text x="156" y="316">2</text><text x="206" y="316">3</text><text x="256" y="316">4</text><text x="306" y="316">5</text><text x="46" y="254">1</text><text x="46" y="204">2</text><text x="46" y="154">3</text><text x="46" y="104">4</text></g>

  <!-- a = [3, 1] -->
  <line x1="60" y1="300" x2="210" y2="250" stroke="#3949ab" stroke-width="3" marker-end="url(#d5ha)"/>
  <text x="130" y="292" fill="#3949ab" font-weight="bold">a = [3, 1]</text>

  <!-- b = [1, 3], slides from origin to the tip of a -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;150,-50;150,-50;0,0" keyTimes="0;0.2;0.45;0.95;1" dur="6s" repeatCount="indefinite"/>
    <line x1="60" y1="300" x2="110" y2="150" stroke="#00897b" stroke-width="3" marker-end="url(#d5hb)"/>
    <text x="94" y="236" fill="#00897b" font-weight="bold">b = [1, 3]</text>
  </g>

  <!-- sum appears -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.6;0.95;1" dur="6s" repeatCount="indefinite"/>
    <line x1="60" y1="300" x2="260" y2="100" stroke="#e53935" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#d5hs)"/>
    <text x="268" y="98" fill="#e53935" font-weight="bold">a + b = [4, 4]</text>
  </g>
  <text x="390" y="140" font-size="12" fill="#555">1. draw a</text>
  <text x="390" y="160" font-size="12" fill="#555">2. slide b so its tail</text>
  <text x="390" y="176" font-size="12" fill="#555">   sits on a's tip</text>
  <text x="390" y="196" font-size="12" fill="#555">3. the sum goes from</text>
  <text x="390" y="212" font-size="12" fill="#555">   origin to b's new tip</text>
  <text x="20" y="28" font-weight="bold" font-size="15">Adding vectors: tip to tail</text>
</svg>
