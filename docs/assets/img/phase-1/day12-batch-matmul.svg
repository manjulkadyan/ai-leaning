<text x="360" y="300" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace">(5, <tspan fill="#e53935" font-weight="bold">3</tspan>) @ (<tspan fill="#e53935" font-weight="bold">3</tspan>, 4) + (4,) → (5, 4)</text>
<text x="360" y="320" text-anchor="middle" font-size="12" fill="#555">inner sizes must match (the 3s); the outer sizes become the result's shape</text>
