<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
  <defs>
    <marker id="v3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3949ab"/></marker>
    <marker id="v3b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00897b"/></marker>
  </defs>
  <text x="20" y="28" font-weight="bold" font-size="15">One vector, three readings</text>
  <!-- list view -->
  <g><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.0;0.02;0.31;0.33;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="62" width="60" height="44" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
    <rect x="100" y="62" width="60" height="44" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
    <text x="70" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#3949ab">3</text>
    <text x="130" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#3949ab">2</text>
    <text x="70" y="124" text-anchor="middle" font-size="12" fill="#555">a[0]</text>
    <text x="130" y="124" text-anchor="middle" font-size="12" fill="#555">a[1]</text>
  </g>
  <g font-size="13">
    <g><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.0;0.02;0.31;0.33;1" dur="12s" repeatCount="indefinite"/><text x="30" y="170" font-weight="bold" fill="#3949ab">1. A list of numbers</text><text x="44" y="188" fill="#555" font-size="12">a fixed set of fields, in order</text></g>
    <g><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.33;0.35;0.64;0.66;1" dur="12s" repeatCount="indefinite"/><text x="30" y="216" font-weight="bold" fill="#3949ab">2. An arrow (a movement)</text><text x="44" y="234" fill="#555" font-size="12">3 to the right, 2 up</text></g>
    <g><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.66;0.68;0.98;1.0;1" dur="12s" repeatCount="indefinite"/><text x="30" y="262" font-weight="bold" fill="#ef6c00">3. A point (a location)</text><text x="44" y="280" fill="#555" font-size="12">where the arrow ends,</text><text x="44" y="296" fill="#555" font-size="12">starting from the origin</text></g>
  </g>
  <!-- grid -->
  <g stroke="#eceff1"><line x1="300" y1="290" x2="300" y2="65"/><line x1="345" y1="290" x2="345" y2="65"/><line x1="390" y1="290" x2="390" y2="65"/><line x1="435" y1="290" x2="435" y2="65"/><line x1="480" y1="290" x2="480" y2="65"/><line x1="525" y1="290" x2="525" y2="65"/><line x1="570" y1="290" x2="570" y2="65"/><line x1="300" y1="290" x2="570" y2="290"/><line x1="300" y1="245" x2="570" y2="245"/><line x1="300" y1="200" x2="570" y2="200"/><line x1="300" y1="155" x2="570" y2="155"/><line x1="300" y1="110" x2="570" y2="110"/><line x1="300" y1="65" x2="570" y2="65"/></g>
  <g stroke="#90a4ae" stroke-width="1.5"><line x1="300" y1="290" x2="580" y2="290"/><line x1="300" y1="290" x2="300" y2="55"/></g>
  <g font-size="11" fill="#90a4ae"><text x="341" y="306">1</text><text x="386" y="306">2</text><text x="431" y="306">3</text><text x="476" y="306">4</text><text x="521" y="306">5</text><text x="566" y="306">6</text><text x="286" y="249">1</text><text x="286" y="204">2</text><text x="286" y="159">3</text><text x="286" y="114">4</text><text x="286" y="69">5</text></g>
  <text x="292" y="306" font-size="11" fill="#90a4ae">0</text>
  <!-- arrow view -->
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.33;0.36;0.98;1" dur="12s" repeatCount="indefinite"/>
    <line x1="300" y1="290" x2="435" y2="290" stroke="#3949ab" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="435" y1="290" x2="435" y2="200" stroke="#3949ab" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="353.5" y="284" font-size="12" fill="#3949ab">3 right</text>
    <text x="441" y="249.0" font-size="12" fill="#3949ab">2 up</text>
    <line x1="300" y1="290" x2="435" y2="200" stroke="#3949ab" stroke-width="3" marker-end="url(#v3a)"/>
    <text x="330" y="202" font-weight="bold" fill="#3949ab">a = [3, 2]</text>
  </g>
  <!-- point view -->
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.69;0.98;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="435" cy="200" r="7" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/>
    <text x="447" y="192" font-weight="bold" fill="#ef6c00">point (3, 2)</text>
    <circle cx="300" cy="290" r="4" fill="#555"/>
    <text x="306" y="320" font-size="12" fill="#555">origin (0, 0)</text>
    <line x1="345" y1="155" x2="480" y2="65" stroke="#00897b" stroke-width="3" marker-end="url(#v3b)"/>
    <circle cx="345" cy="155" r="3.5" fill="#00897b"/>
    <text x="490" y="85" font-size="12" fill="#00897b">same vector [3, 2],</text>
    <text x="490" y="101" font-size="12" fill="#00897b">starting at (1, 3)</text>
  </g>
</svg>
