</g>
<rect x="425" y="60" width="280" height="240" rx="8" fill="#fff3e0"/>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.25" values="0;1;0"/><text x="565" y="92" text-anchor="middle" font-weight="bold" fill="#e53935">Step 1: pool all apps</text><text x="565" y="118" text-anchor="middle" >bigger apps rate higher?</text><text x="565" y="144" text-anchor="middle" font-size="16" font-weight="bold">pooled r = +0.73</text><text x="565" y="170" text-anchor="middle" ></text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.5" values="0;1;0"/><text x="565" y="92" text-anchor="middle" font-weight="bold" fill="#3949ab">Step 2: colour by category</text><text x="565" y="118" text-anchor="middle" >Games are big AND</text><text x="565" y="144" text-anchor="middle" >rated high; Tools are</text><text x="565" y="170" text-anchor="middle" >small AND rated lower</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0;0.5;0.83" values="0;1;0"/><text x="565" y="92" text-anchor="middle" font-weight="bold" fill="#00897b">Step 3: look inside groups</text><text x="565" y="118" text-anchor="middle" >within every category,</text><text x="565" y="144" text-anchor="middle" >bigger apps rate LOWER</text><text x="565" y="170" text-anchor="middle" font-size="15" font-weight="bold">r = -0.89, -0.85, -0.86</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0;0.83;1" values="0;1;1"/><text x="565" y="92" text-anchor="middle" font-weight="bold" fill="#ef6c00">The lesson</text><text x="565" y="118" text-anchor="middle" >category drives both size</text><text x="565" y="144" text-anchor="middle" >and rating: a confounder.</text><text x="565" y="170" text-anchor="middle" font-style="italic" fill="#555">Ask the right question first</text><text x="565" y="196" text-anchor="middle" font-style="italic" fill="#555">(pooled or within groups?)</text></g>
</svg>