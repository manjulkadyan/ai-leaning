<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <text x="20" y="30" font-weight="bold" font-size="16" fill="#3949ab">Kotlin on Android</text>
  <g>
    <rect x="20" y="45" width="120" height="50" rx="8" fill="#e8eaf6" stroke="#3949ab"/>
    <text x="80" y="75" text-anchor="middle">Main.kt</text>
    <rect x="190" y="45" width="140" height="50" rx="8" fill="#e8eaf6" stroke="#3949ab"/>
    <text x="260" y="68" text-anchor="middle">kotlinc + D8</text>
    <text x="260" y="86" text-anchor="middle" font-size="12" fill="#555">compile ahead</text>
    <rect x="380" y="45" width="130" height="50" rx="8" fill="#e8eaf6" stroke="#3949ab"/>
    <text x="445" y="75" text-anchor="middle">classes.dex</text>
    <rect x="560" y="45" width="180" height="50" rx="8" fill="#e8eaf6" stroke="#3949ab"/>
    <text x="650" y="68" text-anchor="middle">ART runtime</text>
    <text x="650" y="86" text-anchor="middle" font-size="12" fill="#555">AOT/JIT to machine code</text>
    <line x1="140" y1="70" x2="188" y2="70" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
    <line x1="330" y1="70" x2="378" y2="70" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
    <line x1="510" y1="70" x2="558" y2="70" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
    <text x="260" y="118" text-anchor="middle" font-size="12" fill="#c62828">type errors caught here</text>
  </g>
  <text x="20" y="170" font-weight="bold" font-size="16" fill="#00897b">Python</text>
  <g>
    <rect x="20" y="185" width="120" height="50" rx="8" fill="#e0f2f1" stroke="#00897b"/>
    <text x="80" y="215" text-anchor="middle">main.py</text>
    <rect x="190" y="185" width="320" height="50" rx="8" fill="#e0f2f1" stroke="#00897b"/>
    <text x="350" y="208" text-anchor="middle">python interpreter (CPython)</text>
    <text x="350" y="226" text-anchor="middle" font-size="12" fill="#555">compiles to bytecode and runs it, line by line, at run time</text>
    <rect x="560" y="185" width="180" height="50" rx="8" fill="#fff3e0" stroke="#ef6c00"/>
    <text x="650" y="208" text-anchor="middle">NumPy / PyTorch</text>
    <text x="650" y="226" text-anchor="middle" font-size="12" fill="#555">heavy math in C/C++/CUDA</text>
    <line x1="140" y1="210" x2="188" y2="210" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
    <line x1="510" y1="210" x2="558" y2="210" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
    <text x="350" y="258" text-anchor="middle" font-size="12" fill="#c62828">type errors only appear when that line runs</text>
    <text x="650" y="258" text-anchor="middle" font-size="12" fill="#ef6c00">this is why Python is fast enough for ML</text>
  </g>
</svg>
