<text x="95" y="335" font-size="12" fill="#555">each cell shows the sum of the two dice</text>
<rect x="360" y="60" width="340" height="250" rx="8" fill="#f5f5f5"/>
<g opacity="1"><animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite" keyTimes="0;0.3333" values="1;0"/><text x="376" y="90" font-weight="bold" fill="#ef6c00">Step 1 · the event “sum is 7”</text><text x="376" y="117" >It is the 6 yellow cells on the diagonal.</text><text x="376" y="144" >Every cell has the same chance, so</text><text x="376" y="171" >P(sum = 7) = cells in event ÷ all cells</text><text x="376" y="198" font-weight="bold">= 6 / 36 = 1/6 ≈ 0.167</text><text x="376" y="225" fill="#555" font-size="12">No other sum has as many cells.</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite" keyTimes="0;0.3333;0.6667" values="0;1;0"/><text x="376" y="90" font-weight="bold" fill="#3949ab">Step 2 · addition rule</text><text x="376" y="117" ><tspan fill="#ef6c00" font-weight="bold">A</tspan>: first die is 6 (bottom row, 6 cells)</text><text x="376" y="144" ><tspan fill="#00897b" font-weight="bold">B</tspan>: second die is 6 (right column, 6 cells)</text><text x="376" y="171" >the <tspan fill="#e53935" font-weight="bold">red</tspan> corner (6, 6) is in both</text><text x="376" y="198" >P(A or B) = 6/36 + 6/36 − 1/36</text><text x="376" y="225" font-weight="bold">= 11/36 ≈ 0.306</text><text x="376" y="252" fill="#555" font-size="12">subtract the overlap, or you count it twice</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite" keyTimes="0;0.6667" values="0;1"/><text x="376" y="90" font-weight="bold" fill="#00897b">Step 3 · complement and multiplication</text><text x="376" y="117" >“no six at all” = the <tspan fill="#3949ab" font-weight="bold">blue</tspan> 5 × 5 = 25 cells</text><text x="376" y="144" >P(at least one six) = 1 − 25/36</text><text x="376" y="171" font-weight="bold">= 11/36, the same answer as step 2</text><text x="376" y="198" >independent dice: P(no six) = 5/6 × 5/6</text><text x="376" y="225" >and P(both six) = 1/6 × 1/6 = 1/36</text><text x="376" y="252" fill="#555" font-size="12">three rules, one consistent picture</text></g>
</svg>