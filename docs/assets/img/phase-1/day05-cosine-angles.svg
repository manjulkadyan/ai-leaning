<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
  <defs>
    <marker id="d5ca" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3949ab"/></marker>
    <marker id="d5cb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00897b"/></marker>
  </defs>
  <text x="20" y="28" font-weight="bold" font-size="15">Cosine similarity is about the angle</text>
  <circle cx="160" cy="170" r="110" fill="none" stroke="#eceff1" stroke-width="2"/>
  <line x1="40" y1="170" x2="280" y2="170" stroke="#eceff1"/>
  <line x1="160" y1="50" x2="160" y2="290" stroke="#eceff1"/>
  <!-- fixed vector a pointing right -->
  <line x1="160" y1="170" x2="235" y2="170" stroke="#3949ab" stroke-width="4" marker-end="url(#d5ca)"/>
  <text x="212" y="192" fill="#3949ab" font-weight="bold">a</text>
  <text x="320" y="90" font-size="13"><tspan fill="#3949ab" font-weight="bold">a</tspan> stays fixed, <tspan fill="#00897b" font-weight="bold">b</tspan> rotates</text>
  <!-- rotating vector b: 0°, 45°, 90°, 135°, 180° (rotate is clockwise in SVG, so negate) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" calcMode="discrete"
      values="0 160 170;-45 160 170;-90 160 170;-135 160 170;-180 160 170"
      keyTimes="0;0.2;0.4;0.6;0.8" dur="10s" repeatCount="indefinite"/>
    <line x1="160" y1="170" x2="268" y2="170" stroke="#00897b" stroke-width="3" marker-end="url(#d5cb)"/>
  </g>
  <!-- b label, drop line and its x-coordinate (= cos) per state -->
  <g>
    <g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
      <text x="272.0" y="160.0" fill="#00897b" font-weight="bold" font-size="15" text-anchor="middle">b</text>
      <circle cx="270.0" cy="170" r="5" fill="#ef6c00"/>
      <text x="270.0" y="192" fill="#ef6c00" font-size="12" text-anchor="middle">1.00</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
      <text x="231.1" y="73.4" fill="#00897b" font-weight="bold" font-size="15" text-anchor="middle">b</text>
      <line x1="237.8" y1="92.2" x2="237.8" y2="170" stroke="#555" stroke-dasharray="4 3"/><circle cx="237.8" cy="170" r="5" fill="#ef6c00"/>
      <text x="237.8" y="192" fill="#ef6c00" font-size="12" text-anchor="middle">0.71</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
      <text x="138.5" y="52.9" fill="#00897b" font-weight="bold" font-size="15" text-anchor="middle">b</text>
      <line x1="160.0" y1="60.0" x2="160.0" y2="170" stroke="#555" stroke-dasharray="4 3"/><circle cx="160.0" cy="170" r="5" fill="#ef6c00"/>
      <text x="160.0" y="192" fill="#ef6c00" font-size="12" text-anchor="middle">0.00</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
      <text x="58.4" y="103.9" fill="#00897b" font-weight="bold" font-size="15" text-anchor="middle">b</text>
      <line x1="82.2" y1="92.2" x2="82.2" y2="170" stroke="#555" stroke-dasharray="4 3"/><circle cx="82.2" cy="170" r="5" fill="#ef6c00"/>
      <text x="82.2" y="192" fill="#ef6c00" font-size="12" text-anchor="middle">−0.71</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
      <text x="44.0" y="160.0" fill="#00897b" font-weight="bold" font-size="15" text-anchor="middle">b</text>
      <circle cx="50.0" cy="170" r="5" fill="#ef6c00"/>
      <text x="50.0" y="192" fill="#ef6c00" font-size="12" text-anchor="middle">−1.00</text></g>
  </g>
  <!-- labels in sync -->
  <g font-size="15">
    <g><animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
      <text x="320" y="130" font-weight="bold">angle 0°</text><text x="320" y="155">cos = 1.00</text><text x="320" y="180" fill="#2e7d32">same direction: very similar</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
      <text x="320" y="130" font-weight="bold">angle 45°</text><text x="320" y="155">cos = 0.71</text><text x="320" y="180" fill="#558b2f">fairly similar</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
      <text x="320" y="130" font-weight="bold">angle 90°</text><text x="320" y="155">cos = 0.00</text><text x="320" y="180" fill="#757575">unrelated (orthogonal)</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
      <text x="320" y="130" font-weight="bold">angle 135°</text><text x="320" y="155">cos = −0.71</text><text x="320" y="180" fill="#ef6c00">leaning opposite</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
      <text x="320" y="130" font-weight="bold">angle 180°</text><text x="320" y="155">cos = −1.00</text><text x="320" y="180" fill="#c62828">exact opposites</text></g>
  </g>
  <text x="320" y="212" font-size="12" fill="#ef6c00">orange dot: the x-coordinate of b's tip</text>
  <text x="320" y="228" font-size="12" fill="#ef6c00">on the unit circle, which is cos θ</text>
  <text x="320" y="252" font-size="12" fill="#555">Length doesn't matter, only direction.</text>
  <text x="320" y="268" font-size="12" fill="#555">That's why it's the standard way to</text>
  <text x="320" y="284" font-size="12" fill="#555">compare embeddings.</text>
</svg>
