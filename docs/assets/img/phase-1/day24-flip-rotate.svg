<line x1="540" y1="195" x2="582.5" y2="121.4" stroke="#3949ab" stroke-width="3.5" marker-end="url(#d24fb)"><animate attributeName="x2" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.35;0.8;0.95;1" values="582.5;582.5;582.5;582.5;582.5;582.5"/><animate attributeName="y2" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.35;0.8;0.95;1" values="121.4;121.4;121.4;121.4;121.4;121.4"/></line>
<line x1="540" y1="195" x2="479.9" y2="134.9" stroke="#2e7d32" stroke-width="3.5" marker-end="url(#d24fn)"><animate attributeName="x2" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.35;0.8;0.95;1" values="479.9;479.9;479.9;479.9;479.9;479.9"/><animate attributeName="y2" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.35;0.8;0.95;1" values="134.9;134.9;134.9;134.9;134.9;134.9"/></line>
</g>
<text x="540" y="88" text-anchor="middle" fill="#e53935" font-size="13" font-weight="bold" opacity="0">no real eigenvectors<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.33;0.37;0.8;0.83;1" values="0;0;1;1;0;0"/></text>
