<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<defs><marker id="d24fo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker><marker id="d24ft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00897b"/></marker><marker id="d24fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#90a4ae"/></marker><marker id="d24fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53935"/></marker><marker id="d24fb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3949ab"/></marker><marker id="d24fn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker></defs>
<text x="20" y="28" font-weight="bold" font-size="15">A flip keeps two lines; a rotation keeps none</text>
<rect x="15" y="45" width="340" height="300" rx="8" fill="#f5f5f5"/>
<text x="185" y="68" text-anchor="middle" font-weight="bold">Mirror F = [[1, 0], [0, −1]]</text>
<text x="185" y="334" text-anchor="middle" font-size="12" fill="#555">orange and teal stay on their lines: eigenvectors</text>
<g stroke="#cfd8dc" stroke-width="1"><line x1="35" y1="195" x2="335" y2="195"/><line x1="185" y1="80" x2="185" y2="310"/></g>
<line x1="80.0" y1="195.0" x2="290.0" y2="195.0" stroke="#ef6c00" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="185.0" y1="300.0" x2="185.0" y2="90.0" stroke="#00897b" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="185" y1="195" x2="236.0" y2="127.0" stroke="#90a4ae" stroke-width="2.5" marker-end="url(#d24fg)"><animate attributeName="x2" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.35;0.8;0.95;1" values="236.0;236.0;236.0;236.0;236.0;236.0"/><animate attributeName="y2" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.35;0.8;0.95;1" values="127.0;127.0;263.0;263.0;127.0;127.0"/></line>
<line x1="185" y1="195" x2="270.0" y2="195.0" stroke="#ef6c00" stroke-width="3.5" marker-end="url(#d24fo)"><animate attributeName="x2" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.35;0.8;0.95;1" values="270.0;270.0;270.0;270.0;270.0;270.0"/><animate attributeName="y2" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.35;0.8;0.95;1" values="195.0;195.0;195.0;195.0;195.0;195.0"/></line>
<line x1="185" y1="195" x2="185.0" y2="110.0" stroke="#00897b" stroke-width="3.5" marker-end="url(#d24ft)"><animate attributeName="x2" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.35;0.8;0.95;1" values="185.0;185.0;185.0;185.0;185.0;185.0"/><animate attributeName="y2" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.35;0.8;0.95;1" values="110.0;110.0;280.0;280.0;110.0;110.0"/></line>
<text x="278" y="187" fill="#ef6c00" font-weight="bold" font-size="13">λ = 1</text>
<text x="195" y="302" text-anchor="start" fill="#00897b" font-size="13" font-weight="bold" opacity="0">λ = −1 (flipped)<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.33;0.37;0.8;0.83;1" values="0;0;1;1;0;0"/></text>
<text x="244.0" y="261.0" text-anchor="start" fill="#607d8b" font-size="12" opacity="0">turned<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.33;0.37;0.8;0.83;1" values="0;0;1;1;0;0"/></text>
<rect x="370" y="45" width="340" height="300" rx="8" fill="#f5f5f5"/>
<text x="540" y="68" text-anchor="middle" font-weight="bold">Rotate 90° R = [[0, −1], [1, 0]]</text>
<text x="540" y="334" text-anchor="middle" font-size="12" fill="#555">every arrow leaves its own line: λ = ±i</text>
<g stroke="#cfd8dc" stroke-width="1"><line x1="390" y1="195" x2="690" y2="195"/><line x1="540" y1="80" x2="540" y2="310"/></g>
<line x1="435.0" y1="195.0" x2="645.0" y2="195.0" stroke="#e53935" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="487.5" y1="285.9" x2="592.5" y2="104.1" stroke="#3949ab" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="614.2" y1="269.2" x2="465.8" y2="120.8" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6 5"/>
<g><animateTransform attributeName="transform" type="rotate" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.35;0.8;0.95;1" values="0 540 195;0 540 195;-90 540 195;-90 540 195;0 540 195;0 540 195"/>
