<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 435" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3949ab"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00897b"/></marker></defs>
<rect x="0" y="0" width="740" height="435" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16">The mutable default: one list, built when def runs</text>
<rect x="15" y="45" width="400" height="355" rx="8" fill="none" stroke="#e53935" stroke-width="1.5"/>
<text x="30" y="68" font-weight="bold" fill="#e53935">Buggy: def add_layer(name, layers=[])</text>
<rect x="30" y="85" width="170" height="70" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="115" y="105" text-anchor="middle" font-weight="bold" fill="#3949ab">function add_layer</text>
<text x="115" y="125" text-anchor="middle" font-size="12" fill="#555">__defaults__ = (L,)</text>
<text x="115" y="144" text-anchor="middle" font-size="11" fill="#555">built once, by def</text>
<rect x="228" y="85" width="178" height="70" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="317" y="103" text-anchor="middle" font-size="12" fill="#ef6c00" font-weight="bold">list L (one object)</text>
<line x1="200" y1="121" x2="226" y2="121" stroke="#3949ab" stroke-width="1.5" marker-end="url(#ar)"/>
<g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.110;0.125;0.98;1" dur="12s" repeatCount="indefinite"/><text x="317" y="133" text-anchor="middle" font-family="Courier New, monospace" font-size="13">[]</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.130;0.145;0.360;0.375;1" dur="12s" repeatCount="indefinite"/><text x="317" y="133" text-anchor="middle" font-family="Courier New, monospace" font-size="11" font-weight="bold">['conv']</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.380;0.395;0.610;0.625;1" dur="12s" repeatCount="indefinite"/><text x="317" y="133" text-anchor="middle" font-family="Courier New, monospace" font-size="11" font-weight="bold">['conv', 'relu']</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.625;0.645;0.97;1" dur="12s" repeatCount="indefinite"/><text x="317" y="133" text-anchor="middle" font-family="Courier New, monospace" font-size="11" font-weight="bold">['conv', 'relu', 'pool']</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.125;0.145;0.97;1" dur="12s" repeatCount="indefinite"/><rect x="30" y="185" width="200" height="50" rx="5" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/><text x="40" y="205" font-size="12" font-family="Courier New, monospace">call 1: add_layer("conv")</text><text x="40" y="224" font-size="11" fill="#555">layers → the same L; returns L</text><path d="M230,210 C 300,210 325,175 325,157" fill="none" stroke="#00897b" stroke-width="1.5" marker-end="url(#ag)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.375;0.395;0.97;1" dur="12s" repeatCount="indefinite"/><rect x="30" y="250" width="200" height="50" rx="5" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/><text x="40" y="270" font-size="12" font-family="Courier New, monospace">call 2: add_layer("relu")</text><text x="40" y="289" font-size="11" fill="#555">layers → the same L; returns L</text><path d="M230,275 C 300,275 325,240 325,157" fill="none" stroke="#00897b" stroke-width="1.5" marker-end="url(#ag)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.625;0.645;0.97;1" dur="12s" repeatCount="indefinite"/><rect x="30" y="315" width="200" height="50" rx="5" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/><text x="40" y="335" font-size="12" font-family="Courier New, monospace">call 3: add_layer("pool")</text><text x="40" y="354" font-size="11" fill="#555">layers → the same L; returns L</text><path d="M230,340 C 300,340 325,305 325,157" fill="none" stroke="#00897b" stroke-width="1.5" marker-end="url(#ag)"/></g>
<text x="30" y="390" font-size="12" fill="#555">All three results are the same object L.</text>
<rect x="430" y="45" width="295" height="355" rx="8" fill="none" stroke="#00897b" stroke-width="1.5"/>
<text x="445" y="68" font-weight="bold" fill="#00897b">Fixed: layers=None</text>
<rect x="445" y="85" width="265" height="70" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="577" y="105" text-anchor="middle" font-weight="bold" fill="#3949ab">function add_layer_fixed</text>
<text x="577" y="125" text-anchor="middle" font-size="12" fill="#555">__defaults__ = (None,)</text>
<text x="577" y="144" text-anchor="middle" font-size="11" fill="#555">None can't be changed: safe to share</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.125;0.145;0.97;1" dur="12s" repeatCount="indefinite"/><rect x="445" y="185" width="120" height="50" rx="5" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/><text x="505" y="206" text-anchor="middle" font-size="12">call 1</text><text x="505" y="224" text-anchor="middle" font-size="11" fill="#555">layers = None → []</text><line x1="565" y1="210" x2="588" y2="210" stroke="#00897b" stroke-width="1.5" marker-end="url(#ag)"/><rect x="590" y="193" width="120" height="34" rx="5" fill="#fff59d" stroke="#ef6c00" stroke-width="1.5"/><text x="650" y="215" text-anchor="middle" font-family="Courier New, monospace" font-size="12">['conv']</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.375;0.395;0.97;1" dur="12s" repeatCount="indefinite"/><rect x="445" y="250" width="120" height="50" rx="5" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/><text x="505" y="271" text-anchor="middle" font-size="12">call 2</text><text x="505" y="289" text-anchor="middle" font-size="11" fill="#555">layers = None → []</text><line x1="565" y1="275" x2="588" y2="275" stroke="#00897b" stroke-width="1.5" marker-end="url(#ag)"/><rect x="590" y="258" width="120" height="34" rx="5" fill="#fff59d" stroke="#ef6c00" stroke-width="1.5"/><text x="650" y="280" text-anchor="middle" font-family="Courier New, monospace" font-size="12">['relu']</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.625;0.645;0.97;1" dur="12s" repeatCount="indefinite"/><rect x="445" y="315" width="120" height="50" rx="5" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/><text x="505" y="336" text-anchor="middle" font-size="12">call 3</text><text x="505" y="354" text-anchor="middle" font-size="11" fill="#555">layers = None → []</text><line x1="565" y1="340" x2="588" y2="340" stroke="#00897b" stroke-width="1.5" marker-end="url(#ag)"/><rect x="590" y="323" width="120" height="34" rx="5" fill="#fff59d" stroke="#ef6c00" stroke-width="1.5"/><text x="650" y="345" text-anchor="middle" font-family="Courier New, monospace" font-size="12">['pool']</text></g>
<text x="445" y="390" font-size="12" fill="#555">Each call builds a new list.</text>
<text x="20" y="422" font-size="12" fill="#555">Defaults are evaluated once, when def runs, and stored on the function object.</text>
</svg>