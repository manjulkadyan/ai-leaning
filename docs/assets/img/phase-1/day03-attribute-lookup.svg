<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 450" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="740" height="450" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16">Attribute lookup: instance dict, then class, then parents</text>
<rect x="30" y="55" width="190" height="90" rx="6" fill="#ffffff" stroke="#3949ab" stroke-width="1.5"/>
<text x="40" y="74" font-weight="bold" font-size="13" fill="#3949ab">instance a: a.__dict__</text>
<text x="40" y="95" font-family="Courier New, monospace" font-size="12">'name': 'conv1'</text>
<rect x="250" y="55" width="190" height="90" rx="6" fill="#ffffff" stroke="#3949ab" stroke-width="1.5"/>
<text x="260" y="74" font-weight="bold" font-size="13" fill="#3949ab">instance b: b.__dict__</text>
<text x="260" y="95" font-family="Courier New, monospace" font-size="12">'name': 'fc1'</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.40;0.41;0.97;1" dur="15s" repeatCount="indefinite"/><text x="40" y="113" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#ef6c00">'kind': 'conv'  (new)</text></g>
<rect x="110" y="190" width="250" height="95" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="120" y="209" font-weight="bold" font-size="13" fill="#3949ab">class Layer: Layer.__dict__</text>
<text x="120" y="230" font-family="Courier New, monospace" font-size="12">'created': 2</text>
<text x="120" y="248" font-family="Courier New, monospace" font-size="12">'kind': 'generic'</text>
<text x="120" y="266" font-family="Courier New, monospace" font-size="12">'__init__': &lt;function&gt;</text>
<rect x="110" y="330" width="250" height="70" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="120" y="349" font-weight="bold" font-size="13" fill="#555">class object (every class's parent)</text>
<text x="120" y="370" font-family="Courier New, monospace" font-size="12">'__repr__', '__eq__', ...</text>
<path d="M125,145 L235,188" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M345,145 L235,188" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M235,285 L235,328" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="245" y="312" font-size="11" fill="#555">parent</text>
<text x="70" y="172" font-size="11" fill="#555">its class</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.052;0.34;0.352;1" dur="15s" repeatCount="indefinite"/><rect x="27" y="52" width="196" height="96" rx="8" fill="none" stroke="#e53935" stroke-width="3"/><text x="130" y="138" font-size="12" font-weight="bold" fill="#e53935">✗ no 'kind'</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.132;0.34;0.352;1" dur="15s" repeatCount="indefinite"/><rect x="107" y="187" width="256" height="101" rx="8" fill="none" stroke="#00897b" stroke-width="3"/><text x="372" y="214" font-size="12" font-weight="bold" fill="#00897b">✓ found</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.392;0.6;0.612;1" dur="15s" repeatCount="indefinite"/><rect x="27" y="52" width="196" height="96" rx="8" fill="none" stroke="#ef6c00" stroke-width="3"/><text x="0" y="0" font-size="12" font-weight="bold" fill="#ef6c00"></text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.64;0.652;0.97;0.982;1" dur="15s" repeatCount="indefinite"/><rect x="27" y="52" width="196" height="96" rx="8" fill="none" stroke="#00897b" stroke-width="3"/><text x="140" y="138" font-size="12" font-weight="bold" fill="#00897b">✓ 'conv'</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.732;0.97;0.982;1" dur="15s" repeatCount="indefinite"/><rect x="247" y="52" width="196" height="96" rx="8" fill="none" stroke="#e53935" stroke-width="3"/><text x="350" y="138" font-size="12" font-weight="bold" fill="#e53935">✗ no 'kind'</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.812;0.97;0.982;1" dur="15s" repeatCount="indefinite"/><rect x="107" y="187" width="256" height="101" rx="8" fill="none" stroke="#00897b" stroke-width="3"/><text x="372" y="214" font-size="12" font-weight="bold" fill="#00897b">✓ b.kind</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.032;0.34;0.352;1" dur="15s" repeatCount="indefinite"/><text x="20" y="435" font-size="13" fill="#555">Read a.kind: not in a's own dict, so Python looks in the class and finds 'generic'.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.372;0.6;0.612;1" dur="15s" repeatCount="indefinite"/><text x="20" y="435" font-size="13" fill="#555">Assign a.kind = 'conv': assignment always writes into a's own dict.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.632;0.97;0.982;1" dur="15s" repeatCount="indefinite"/><text x="20" y="435" font-size="13" fill="#555">Now a.kind finds 'conv' first. b has no 'kind', so b.kind still reaches the class.</text></g>
<rect x="475" y="55" width="250" height="365" rx="8" fill="none" stroke="#e53935" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="490" y="78" font-weight="bold" font-size="13" fill="#e53935">The shared-list bug</text>
<rect x="490" y="95" width="100" height="50" rx="6" fill="#ffffff" stroke="#3949ab" stroke-width="1.5"/>
<text x="500" y="114" font-weight="bold" font-size="13" fill="#3949ab">e1</text>
<text x="500" y="135" font-family="Courier New, monospace" font-size="12">name only</text>
<rect x="610" y="95" width="100" height="50" rx="6" fill="#ffffff" stroke="#3949ab" stroke-width="1.5"/>
<text x="620" y="114" font-weight="bold" font-size="13" fill="#3949ab">e2</text>
<text x="620" y="135" font-family="Courier New, monospace" font-size="12">name only</text>
<rect x="490" y="200" width="220" height="95" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="500" y="219" font-weight="bold" font-size="13" fill="#3949ab">class Experiment</text>
<text x="500" y="240" font-family="Courier New, monospace" font-size="12">'results': ─────┐</text>
<text x="500" y="258" font-family="Courier New, monospace" font-size="12">'log': &lt;function&gt;</text>
<rect x="545" y="330" width="130" height="34" rx="5" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="610" y="352" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="bold">[0.81, 0.64]</text>
<path d="M540,145 L560,198" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M660,145 L640,198" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M640,240 L640,280 L610,280 L610,328" fill="none" stroke="#ef6c00" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="490" y="388" font-size="11" fill="#555">e1.results and e2.results both find</text>
<text x="490" y="401" font-size="11" fill="#555">the one list stored on the class.</text>
</svg>