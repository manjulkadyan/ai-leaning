<rect x="138" y="44" width="112" height="150" rx="8" fill="#fff59d" stroke="#00897b" stroke-width="3" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/></rect>
<text x="194.0" y="64" text-anchor="middle" font-size="11" fill="#555">Day 30</text>
<text x="194.0" y="84" text-anchor="middle" font-weight="bold" fill="#00897b">rules</text>
