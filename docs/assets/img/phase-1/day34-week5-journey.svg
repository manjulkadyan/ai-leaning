<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="Helvetica, Arial, sans-serif" font-size="13" class="animated">
<defs><marker id="wa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e53935"/></marker></defs>
<text x="14" y="26" font-weight="bold" font-size="15">Week 5 in one picture: from a slope to an engine that finds every slope</text>
