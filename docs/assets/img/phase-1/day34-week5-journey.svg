<text x="690.0" y="64" text-anchor="middle" font-size="11" fill="#555">Day 34</text>
<text x="690.0" y="84" text-anchor="middle" font-weight="bold" fill="#ef6c00">autodiff</text>
<path d="M28 108 Q70 194 112 108" fill="none" stroke="#3949ab" stroke-width="2"/>
<line x1="54" y1="171.0" x2="118" y2="118.6" stroke="#ef6c00" stroke-width="2"/>
<circle cx="86.8" cy="144.1" r="3.5" fill="#e53935"/>
<text x="70" y="186" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10">slope = f'(x)</text>
<text x="194" y="114" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10.5">(x²)′ = 2x</text>
<text x="194" y="134" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10.5">(eˣ)′ = eˣ</text>
<text x="194" y="154" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10.5">σ′ = σ(1−σ)</text>
<text x="194" y="174" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10.5">relu′ = 0 or 1</text>
<circle cx="284" cy="132" r="11" fill="#fff" stroke="#3949ab" stroke-width="1.5"/>
<line x1="295" y1="132" x2="307" y2="132" stroke="#555" stroke-width="1.4"/>
<circle cx="318" cy="132" r="11" fill="#fff" stroke="#3949ab" stroke-width="1.5"/>
<line x1="329" y1="132" x2="341" y2="132" stroke="#555" stroke-width="1.4"/>
<circle cx="352" cy="132" r="11" fill="#fff" stroke="#3949ab" stroke-width="1.5"/>
<path d="M352 152 Q318 170 286 152" fill="none" stroke="#e53935" stroke-width="2" marker-end="url(#wa)"/>
<text x="318" y="186" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10">rates multiply</text>
<ellipse cx="442" cy="140" rx="40" ry="24" fill="none" stroke="#00897b" stroke-width="1.3"/>
<ellipse cx="442" cy="140" rx="27" ry="16" fill="none" stroke="#00897b" stroke-width="1.3"/>
<ellipse cx="442" cy="140" rx="14" ry="8" fill="none" stroke="#00897b" stroke-width="1.3"/>
<line x1="442" y1="124" x2="442" y2="106" stroke="#e53935" stroke-width="2" marker-end="url(#wa)"/>
<text x="454" y="114" font-family="Menlo, Consolas, monospace" font-size="10" fill="#e53935">∇f</text>
<text x="442" y="186" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10">points uphill</text>
<text x="566" y="116" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10.5">w: shape (3,)</text>
<text x="566" y="136" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10.5">∇: shape (3,)</text>
<text x="566" y="160" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10">(2/n)Xᵀ(Xw−y)</text>
<text x="566" y="186" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10">grad_check ✓</text>
<rect x="650" y="100" width="80" height="30" rx="5" fill="#fff" stroke="#ef6c00"/>
<text x="690" y="120" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="bold">Value</text>
<text x="690" y="148" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10">+ − * / **</text>
<text x="690" y="164" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10">exp tanh relu</text>
<text x="690" y="186" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10">.backward()</text>
<circle cx="70.0" cy="206" r="5" fill="#e53935"><animate attributeName="cx" calcMode="discrete" values="70.0;194.0;318.0;442.0;566.0;690.0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/></circle>
<g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/><text x="14" y="236" font-size="12.5" fill="#555">Day 29: a derivative is the slope of the tangent: nudge x by a tiny h and</text><text x="14" y="256" font-size="12.5" fill="#555">watch how far f moves. The central difference measures it numerically.</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/><text x="14" y="236" font-size="12.5" fill="#555">Day 30: a handful of rules give exact slopes: powers, exp and ln, and the</text><text x="14" y="256" font-size="12.5" fill="#555">activations: sigmoid (never above 0.25), tanh, ReLU (0 or 1).</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/><text x="14" y="236" font-size="12.5" fill="#555">Day 31: for a chain of functions, local slopes multiply along a path and</text><text x="14" y="256" font-size="12.5" fill="#555">add across paths. Run that backwards through a graph: backpropagation.</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/><text x="14" y="236" font-size="12.5" fill="#555">Day 32: with many inputs, freeze all but one (a partial derivative). The</text><text x="14" y="256" font-size="12.5" fill="#555">gradient collects them; it points uphill and crosses contours at right angles.</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/><text x="14" y="236" font-size="12.5" fill="#555">Day 33: the gradient has the parameter's shape. For linear regression</text><text x="14" y="256" font-size="12.5" fill="#555">it is (2/n)Xᵀ(Xw − y), and grad_check confirms it with central differences.</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/><text x="14" y="236" font-size="12.5" fill="#555">Day 34 (today): a Value class applies Day 30's rules with Day 31's chain</text><text x="14" y="256" font-size="12.5" fill="#555">rule automatically, and Day 29's nudges check it. Then it trains a neuron.</text></g>
</svg>