<rect x="262" y="44" width="112" height="150" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<rect x="262" y="44" width="112" height="150" rx="8" fill="#fff59d" stroke="#3949ab" stroke-width="3" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/></rect>
<text x="318.0" y="64" text-anchor="middle" font-size="11" fill="#555">Day 31</text>
<text x="318.0" y="84" text-anchor="middle" font-weight="bold" fill="#3949ab">chain rule</text>
<path d="M375 119.0 L385 119.0" stroke="#555" stroke-width="1.5"/><path d="M381 115.0 L385 119.0 L381 123.0" fill="none" stroke="#555" stroke-width="1.5"/>
<rect x="386" y="44" width="112" height="150" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
<rect x="386" y="44" width="112" height="150" rx="8" fill="#fff59d" stroke="#00897b" stroke-width="3" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/></rect>
<text x="442.0" y="64" text-anchor="middle" font-size="11" fill="#555">Day 32</text>
<text x="442.0" y="84" text-anchor="middle" font-weight="bold" fill="#00897b">gradient</text>
<path d="M499 119.0 L509 119.0" stroke="#555" stroke-width="1.5"/><path d="M505 115.0 L509 119.0 L505 123.0" fill="none" stroke="#555" stroke-width="1.5"/>
<rect x="510" y="44" width="112" height="150" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<rect x="510" y="44" width="112" height="150" rx="8" fill="#fff59d" stroke="#3949ab" stroke-width="3" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/></rect>
<text x="566.0" y="64" text-anchor="middle" font-size="11" fill="#555">Day 33</text>
<text x="566.0" y="84" text-anchor="middle" font-weight="bold" fill="#3949ab">vector grads</text>
<path d="M623 119.0 L633 119.0" stroke="#555" stroke-width="1.5"/><path d="M629 115.0 L633 119.0 L629 123.0" fill="none" stroke="#555" stroke-width="1.5"/>
