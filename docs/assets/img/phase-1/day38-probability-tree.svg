<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" font-family="Helvetica, Arial, sans-serif" font-size="14">
<text x="20" y="26" font-weight="bold" font-size="15">A probability tree: multiply along a path, add across paths</text>
<line x1="135" y1="175" x2="225" y2="100" stroke="#e53935" stroke-width="2"/><text x="175" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#e53935">1%</text>
<line x1="135" y1="175" x2="225" y2="250" stroke="#3949ab" stroke-width="2"/><text x="175" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#3949ab">99%</text>
<line x1="335" y1="100" x2="420" y2="62" stroke="#00897b" stroke-width="2"/><text x="377.5" y="73.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#00897b">90%</text>
<line x1="335" y1="100" x2="420" y2="132" stroke="#00897b" stroke-width="2"/><text x="377.5" y="136.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#00897b">10%</text>
<line x1="335" y1="250" x2="420" y2="215" stroke="#00897b" stroke-width="2"/><text x="377.5" y="224.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#00897b">9%</text>
<line x1="335" y1="250" x2="420" y2="285" stroke="#00897b" stroke-width="2"/><text x="377.5" y="287.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#00897b">91%</text>
<rect x="25.0" y="150.0" width="110" height="50" rx="7" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="80" y="180.0" text-anchor="middle" font-weight="bold">1000 people</text>
<rect x="225.0" y="77.0" width="110" height="46" rx="7" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
<text x="280" y="96.5" text-anchor="middle" font-weight="bold" fill="#e53935">sick</text>
<text x="280" y="113.5" text-anchor="middle" >10</text>
<rect x="225.0" y="227.0" width="110" height="46" rx="7" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="280" y="246.5" text-anchor="middle" font-weight="bold" fill="#3949ab">healthy</text>
<text x="280" y="263.5" text-anchor="middle" >990</text>
<rect x="420.0" y="39.0" width="160" height="46" rx="7" fill="#fff59d" stroke="#ef6c00" stroke-width="1.5"/>
<text x="500" y="58.5" text-anchor="middle" font-size="13" font-weight="bold">tests positive</text>
<text x="500" y="75.5" text-anchor="middle" >9 people</text>
<text x="595" y="67" font-size="12" fill="#555">0.01 × 0.90 = 0.009</text>
<rect x="420.0" y="109.0" width="160" height="46" rx="7" fill="#f5f5f5" stroke="#b0bec5" stroke-width="1.5"/>
<text x="500" y="128.5" text-anchor="middle" font-size="13" font-weight="bold">tests negative</text>
<text x="500" y="145.5" text-anchor="middle" >1 people</text>
<text x="595" y="137" font-size="12" fill="#555">0.01 × 0.10 = 0.001</text>
<rect x="420.0" y="192.0" width="160" height="46" rx="7" fill="#fff59d" stroke="#ef6c00" stroke-width="1.5"/>
<text x="500" y="211.5" text-anchor="middle" font-size="13" font-weight="bold">tests positive</text>
<text x="500" y="228.5" text-anchor="middle" >89 people</text>
<text x="595" y="220" font-size="12" fill="#555">0.99 × 0.09 = 0.0891</text>
<rect x="420.0" y="262.0" width="160" height="46" rx="7" fill="#f5f5f5" stroke="#b0bec5" stroke-width="1.5"/>
<text x="500" y="281.5" text-anchor="middle" font-size="13" font-weight="bold">tests negative</text>
<text x="500" y="298.5" text-anchor="middle" >901 people</text>
<text x="595" y="290" font-size="12" fill="#555">0.99 × 0.91 = 0.9009</text>
<text x="20" y="325" font-size="13" fill="#555">P(positive) = 0.009 + 0.0891 = 0.0981 (98 of 1000, the yellow leaves): the law of total probability</text>
</svg>