<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<rect width="760" height="380" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16">What a for loop does: iter() once, then next() until StopIteration</text>
<text x="20" y="58" font-weight="bold" fill="#3949ab">What you write</text>
<rect x="20" y="66" width="230" height="64" rx="6" fill="#f5f5f5" stroke="#999"/>
<g style="white-space:pre" font-family="Courier New, monospace" font-size="14"><text x="32" y="92">for name in names:</text><text x="32" y="116">    print(name)</text></g>
<text x="20" y="160" font-weight="bold" fill="#00897b">Printed</text>
<rect x="20" y="168" width="230" height="62" rx="6" fill="#ffffff" stroke="#bbb"/>
<text x="40" y="205" style="white-space:pre" font-family="Courier New, monospace" font-size="15">cat<animate attributeName="opacity" values="0;1" keyTimes="0;0.2500" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="110" y="205" style="white-space:pre" font-family="Courier New, monospace" font-size="15">dog<animate attributeName="opacity" values="0;1" keyTimes="0;0.4000" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="180" y="205" style="white-space:pre" font-family="Courier New, monospace" font-size="15">fox<animate attributeName="opacity" values="0;1" keyTimes="0;0.5500" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="300" y="44" font-weight="bold" fill="#3949ab">names (the iterable)</text>
<text x="335" y="62" text-anchor="middle" font-size="12" fill="#555">index 0</text>
<rect x="300" y="68" width="70" height="40" rx="4" fill="#e8eaf6" stroke="#3949ab"/>
<text x="335" y="93" text-anchor="middle" style="white-space:pre" font-family="Courier New, monospace">'cat'</text>
<text x="415" y="62" text-anchor="middle" font-size="12" fill="#555">index 1</text>
<rect x="380" y="68" width="70" height="40" rx="4" fill="#e8eaf6" stroke="#3949ab"/>
<text x="415" y="93" text-anchor="middle" style="white-space:pre" font-family="Courier New, monospace">'dog'</text>
<text x="495" y="62" text-anchor="middle" font-size="12" fill="#555">index 2</text>
<rect x="460" y="68" width="70" height="40" rx="4" fill="#e8eaf6" stroke="#3949ab"/>
<text x="495" y="93" text-anchor="middle" style="white-space:pre" font-family="Courier New, monospace">'fox'</text>
<rect x="540" y="68" width="70" height="40" rx="4" fill="none" stroke="#999" stroke-dasharray="4 3"/>
<text x="575" y="93" text-anchor="middle" font-size="12" fill="#555">end</text>
<rect x="300" y="160" width="310" height="44" rx="6" fill="#fff3e0" stroke="#ef6c00"/>
<text x="312" y="187" style="white-space:pre" font-family="Courier New, monospace" font-size="14">it: list_iterator</text>
<text x="480" y="187" style="white-space:pre" font-family="Courier New, monospace" font-size="14">position=0<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1000;0.2500" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="480" y="187" style="white-space:pre" font-family="Courier New, monospace" font-size="14">position=1<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2500;0.4000" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="480" y="187" style="white-space:pre" font-family="Courier New, monospace" font-size="14">position=2<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4000;0.5500" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="480" y="187" style="white-space:pre" font-family="Courier New, monospace" font-size="14">position=3<animate attributeName="opacity" values="0;1" keyTimes="0;0.5500" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="300" y="224" font-size="12" fill="#555">iter(names) made this once; the list itself never changes</text>
<g>
<animateTransform attributeName="transform" type="translate" values="0,0;0,0;80,0;160,0;240,0" keyTimes="0;0.1000;0.2500;0.4000;0.5500" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1" keyTimes="0;0.1000" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
<rect x="298" y="66" width="74" height="44" rx="5" fill="none" stroke="#ef6c00" stroke-width="3"/>
<polygon points="335,114 327,128 343,128" fill="#ef6c00"/>
<line x1="335" y1="128" x2="335" y2="160" stroke="#ef6c00" stroke-width="2"/>
</g>
<text x="20" y="262" font-weight="bold" fill="#ef6c00">What Python calls</text>
<rect x="20" y="270" width="720" height="100" rx="6" fill="#f5f5f5" stroke="#999"/>
<g style="white-space:pre" font-family="Courier New, monospace" font-size="13" fill="#222"><animate attributeName="opacity" values="0;1" keyTimes="0;0.1000" dur="10s" calcMode="discrete" repeatCount="indefinite"/><text x="34" y="292">it = iter(names)</text><text x="200" y="292">→ a list_iterator at position 0</text></g>
<g style="white-space:pre" font-family="Courier New, monospace" font-size="13" fill="#222"><animate attributeName="opacity" values="0;1" keyTimes="0;0.2500" dur="10s" calcMode="discrete" repeatCount="indefinite"/><text x="34" y="309">name = next(it)</text><text x="200" y="309">→ 'cat'   then the body prints it</text></g>
<g style="white-space:pre" font-family="Courier New, monospace" font-size="13" fill="#222"><animate attributeName="opacity" values="0;1" keyTimes="0;0.4000" dur="10s" calcMode="discrete" repeatCount="indefinite"/><text x="34" y="326">name = next(it)</text><text x="200" y="326">→ 'dog'</text></g>
<g style="white-space:pre" font-family="Courier New, monospace" font-size="13" fill="#222"><animate attributeName="opacity" values="0;1" keyTimes="0;0.5500" dur="10s" calcMode="discrete" repeatCount="indefinite"/><text x="34" y="343">name = next(it)</text><text x="200" y="343">→ 'fox'</text></g>
<g style="white-space:pre" font-family="Courier New, monospace" font-size="13" fill="#e53935"><animate attributeName="opacity" values="0;1" keyTimes="0;0.7000" dur="10s" calcMode="discrete" repeatCount="indefinite"/><text x="34" y="360">name = next(it)</text><text x="200" y="360">→ raises StopIteration: the loop catches it and ends</text></g>
</svg>