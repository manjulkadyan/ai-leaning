<line x1="126.0" y1="280.4" x2="416.5" y2="219.9" stroke="#78909c" stroke-width="2" marker-end="url(#day31a)"/>
<line x1="464.0" y1="215.0" x2="576.0" y2="215.0" stroke="#78909c" stroke-width="2" marker-end="url(#day31a)"/>
<line x1="624.0" y1="215.0" x2="681.0" y2="215.0" stroke="#78909c" stroke-width="2" marker-end="url(#day31a)"/>
<rect x="34" y="72" width="92" height="36" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="80" y="95" text-anchor="middle" font-weight="bold">x = 2</text>
<rect x="34" y="162" width="92" height="36" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="80" y="185" text-anchor="middle" font-weight="bold">y = 3</text>
<rect x="34" y="272" width="92" height="36" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="80" y="295" text-anchor="middle" font-weight="bold">z = 1</text>
<circle cx="270" cy="135" r="24" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="270" y="141" text-anchor="middle" font-size="17" font-weight="bold">×</text>
<circle cx="440" cy="215" r="24" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="440" y="221" text-anchor="middle" font-size="17" font-weight="bold">+</text>
<circle cx="600" cy="215" r="24" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="600" y="221" text-anchor="middle" font-size="17" font-weight="bold">( )²</text>
<circle cx="705" cy="215" r="24" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="705" y="221" text-anchor="middle" font-size="17" font-weight="bold">f</text>
<text x="358" y="160" text-anchor="middle" font-size="13" fill="#3949ab" font-weight="bold" opacity="0">a = 6<animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.0833;0.9667" values="0;1;0"/></text>
<text x="520" y="205" text-anchor="middle" font-size="13" fill="#3949ab" font-weight="bold" opacity="0">b = 7<animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.1667;0.9667" values="0;1;0"/></text>
<text x="705" y="260" text-anchor="middle" font-size="13" fill="#3949ab" font-weight="bold" opacity="0">f = 49<animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.2500;0.9667" values="0;1;0"/></text>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.3611;0.9667" values="0;1;0"/><rect x="667.6" y="154" width="74.8" height="20" rx="4" fill="#ffebee"/><text x="705" y="169" text-anchor="middle" font-size="13" fill="#e53935" font-weight="bold">∂f/∂f = 1</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.4444;0.9667" values="0;1;0"/><rect x="479.0" y="230" width="82.0" height="20" rx="4" fill="#ffebee"/><text x="520" y="245" text-anchor="middle" font-size="13" fill="#e53935" font-weight="bold">∂f/∂b = 14</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.5278;0.9667" values="0;1;0"/><rect x="299.0" y="188" width="82.0" height="20" rx="4" fill="#ffebee"/><text x="340" y="203" text-anchor="middle" font-size="13" fill="#e53935" font-weight="bold">∂f/∂a = 14</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.5278;0.9667" values="0;1;0"/><rect x="191.0" y="284" width="82.0" height="20" rx="4" fill="#ffebee"/><text x="232" y="299" text-anchor="middle" font-size="13" fill="#e53935" font-weight="bold">∂f/∂z = 14</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.6111;0.9667" values="0;1;0"/><rect x="39.0" y="44" width="82.0" height="20" rx="4" fill="#ffebee"/><text x="80" y="59" text-anchor="middle" font-size="13" fill="#e53935" font-weight="bold">∂f/∂x = 42</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0.0000;0.6111;0.9667" values="0;1;0"/><rect x="39.0" y="208" width="82.0" height="20" rx="4" fill="#ffebee"/><text x="80" y="223" text-anchor="middle" font-size="13" fill="#e53935" font-weight="bold">∂f/∂y = 28</text></g>
<circle r="6" fill="#e53935" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.5556;0.6111" values="0;1;0"/><animateMotion dur="18s" repeatCount="indefinite" path="M246.6,129.5 L126.0,100.9" keyPoints="0;0;1;1" keyTimes="0;0.5556;0.6111;1" calcMode="linear"/></circle>
<circle r="6" fill="#e53935" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.5556;0.6111" values="0;1;0"/><animateMotion dur="18s" repeatCount="indefinite" path="M246.6,140.5 L126.0,169.1" keyPoints="0;0;1;1" keyTimes="0;0.5556;0.6111;1" calcMode="linear"/></circle>
<circle r="6" fill="#e53935" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.4722;0.5278" values="0;1;0"/><animateMotion dur="18s" repeatCount="indefinite" path="M418.3,204.8 L291.7,145.2" keyPoints="0;0;1;1" keyTimes="0;0.4722;0.5278;1" calcMode="linear"/></circle>
<circle r="6" fill="#e53935" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.4722;0.5278" values="0;1;0"/><animateMotion dur="18s" repeatCount="indefinite" path="M416.5,219.9 L126.0,280.4" keyPoints="0;0;1;1" keyTimes="0;0.4722;0.5278;1" calcMode="linear"/></circle>
<circle r="6" fill="#e53935" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.3889;0.4444" values="0;1;0"/><animateMotion dur="18s" repeatCount="indefinite" path="M576.0,215.0 L464.0,215.0" keyPoints="0;0;1;1" keyTimes="0;0.3889;0.4444;1" calcMode="linear"/></circle>
<rect x="20" y="326" width="720" height="36" rx="8" fill="#f5f5f5"/>
<text x="380.0" y="349" text-anchor="middle" font-size="14" opacity="1"><tspan fill="#555">A graph of three operations. Forward pass first: left to right.</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.0833" values="1;0"/></text>
<text x="380.0" y="349" text-anchor="middle" font-size="14" opacity="0">forward: <tspan font-style="italic">a</tspan> = <tspan font-style="italic">x</tspan> · <tspan font-style="italic">y</tspan> = 2 · 3 = <tspan fill="#3949ab" font-weight="bold">6</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.0833;0.1667" values="0;1;0"/></text>
<text x="380.0" y="349" text-anchor="middle" font-size="14" opacity="0">forward: <tspan font-style="italic">b</tspan> = <tspan font-style="italic">a</tspan> + <tspan font-style="italic">z</tspan> = 6 + 1 = <tspan fill="#3949ab" font-weight="bold">7</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.1667;0.2500" values="0;1;0"/></text>
<text x="380.0" y="349" text-anchor="middle" font-size="14" opacity="0">forward: <tspan font-style="italic">f</tspan> = <tspan font-style="italic">b</tspan>² = 7² = <tspan fill="#3949ab" font-weight="bold">49</tspan>   (every value is saved)<animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.2500;0.3611" values="0;1;0"/></text>
<text x="380.0" y="349" text-anchor="middle" font-size="14" opacity="0">backward starts at the output: ∂f/∂f = <tspan fill="#e53935" font-weight="bold">1</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.3611;0.4444" values="0;1;0"/></text>
<text x="380.0" y="349" text-anchor="middle" font-size="14" opacity="0">squaring: local gradient 2<tspan font-style="italic">b</tspan> = 14, times 1 = <tspan fill="#e53935" font-weight="bold">14</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.4444;0.5278" values="0;1;0"/></text>
<text x="380.0" y="349" text-anchor="middle" font-size="14" opacity="0">adding: local gradient 1 for both inputs, so both get <tspan fill="#e53935" font-weight="bold">14</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.5278;0.6111" values="0;1;0"/></text>
<text x="380.0" y="349" text-anchor="middle" font-size="14" opacity="0">multiplying: each input gets the other one: 3 · 14 = <tspan fill="#e53935" font-weight="bold">42</tspan>, 2 · 14 = <tspan fill="#e53935" font-weight="bold">28</tspan><animate attributeName="opacity" calcMode="discrete" dur="18s" repeatCount="indefinite" keyTimes="0;0.6111;1.0000" values="0;1;0"/></text>
<text x="700" y="310" text-anchor="end" font-size="12" fill="#555"><tspan fill="#3949ab" font-weight="bold">blue</tspan> = value (forward)   <tspan fill="#e53935" font-weight="bold">red</tspan> = gradient (backward)</text>
</svg>