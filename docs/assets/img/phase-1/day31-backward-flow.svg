<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<defs><marker id="day31a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs>
<text x="20" y="28" font-weight="bold" font-size="15">f = (x·y + z)²: forward pass, then gradients flow backward</text>
