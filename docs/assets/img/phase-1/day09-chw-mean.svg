<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
  <text x="20" y="28" font-weight="bold" font-size="15">Channels first: a (3,) mean lines up with the width, not the channels</text>

  <!-- three channel planes, back to front: B, G, R -->
  <rect x="88" y="82" width="120" height="120" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
  <text x="196" y="100" text-anchor="end" font-weight="bold" fill="#3949ab">B</text>
  <rect x="70" y="100" width="120" height="120" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
  <text x="178" y="118" text-anchor="end" font-weight="bold" fill="#00897b">G</text>
  <rect x="52" y="118" width="120" height="120" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="62" y="136" font-weight="bold" fill="#ef6c00">R</text>
  <text x="112" y="196" text-anchor="middle" font-size="12" fill="#555">H × W</text>
  <text x="112" y="212" text-anchor="middle" font-size="12" fill="#555">pixels</text>
  <text x="30" y="264" font-size="13">chw, shape (3, H, W)</text>
  <text x="30" y="282" font-size="12" fill="#555">one full plane per channel</text>

  <!-- axis headers -->
  <text x="420" y="66" text-anchor="middle" font-size="12" fill="#555">axis 0 (C)</text>
  <text x="520" y="66" text-anchor="middle" font-size="12" fill="#555">axis 1 (H)</text>
  <text x="620" y="66" text-anchor="middle" font-size="12" fill="#555">axis 2 (W)</text>

  <!-- table 1: chw - mean -->
  <text x="380" y="98" text-anchor="end" font-size="13" fill="#3949ab">chw</text>
  <g font-weight="bold" text-anchor="middle" fill="#3949ab">
    <rect x="390" y="78" width="60" height="28" fill="#e8eaf6" stroke="#3949ab"/><text x="420" y="97">3</text>
    <rect x="490" y="78" width="60" height="28" fill="#e8eaf6" stroke="#3949ab"/><text x="520" y="97">224</text>
    <rect x="590" y="78" width="60" height="28" fill="#e8eaf6" stroke="#3949ab"/><text x="620" y="97">224</text>
  </g>
  <text x="380" y="132" text-anchor="end" font-size="13" fill="#ef6c00">mean</text>
  <g font-weight="bold" text-anchor="middle">
    <rect x="390" y="112" width="60" height="28" fill="#ffffff" stroke="#9e9e9e" stroke-dasharray="4 3"/><text x="420" y="131" fill="#9e9e9e">1</text>
    <rect x="490" y="112" width="60" height="28" fill="#ffffff" stroke="#9e9e9e" stroke-dasharray="4 3"/><text x="520" y="131" fill="#9e9e9e">1</text>
    <rect x="590" y="112" width="60" height="28" fill="#fff3e0" stroke="#ef6c00"/><text x="620" y="131" fill="#ef6c00">3</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.13;0.96;1" dur="10s" repeatCount="indefinite"/>
    <rect x="584" y="73" width="72" height="72" rx="6" fill="none" stroke="#e53935" stroke-width="3"/>
    <text x="300" y="168" font-weight="bold" fill="#e53935">224 vs 3 → ValueError</text>
    <text x="300" y="188" font-size="12" fill="#555">If W happened to be 3, this would run and subtract</text>
    <text x="300" y="204" font-size="12" fill="#555">one mean per column of pixels: wrong, and silent.</text>
  </g>

  <!-- table 2: chw - mean[:, None, None] -->
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.43;0.96;1" dur="10s" repeatCount="indefinite"/>
    <text x="380" y="252" text-anchor="end" font-size="13" fill="#3949ab">chw</text>
    <g font-weight="bold" text-anchor="middle" fill="#3949ab">
      <rect x="390" y="232" width="60" height="28" fill="#e8eaf6" stroke="#3949ab"/><text x="420" y="251">3</text>
      <rect x="490" y="232" width="60" height="28" fill="#e8eaf6" stroke="#3949ab"/><text x="520" y="251">224</text>
      <rect x="590" y="232" width="60" height="28" fill="#e8eaf6" stroke="#3949ab"/><text x="620" y="251">224</text>
    </g>
    <text x="374" y="285" text-anchor="end" font-size="12" fill="#ef6c00">mean[:, None, None]</text>
    <g font-weight="bold" text-anchor="middle" fill="#ef6c00">
      <rect x="390" y="266" width="60" height="28" fill="#fff3e0" stroke="#ef6c00"/><text x="420" y="285">3</text>
      <rect x="490" y="266" width="60" height="28" fill="#fff3e0" stroke="#ef6c00"/><text x="520" y="285">1</text>
      <rect x="590" y="266" width="60" height="28" fill="#fff3e0" stroke="#ef6c00"/><text x="620" y="285">1</text>
    </g>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.58;0.96;1" dur="10s" repeatCount="indefinite"/>
    <rect x="384" y="227" width="72" height="72" rx="6" fill="none" stroke="#00897b" stroke-width="3"/>
    <rect x="484" y="227" width="172" height="72" rx="6" fill="none" stroke="#00897b" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="300" y="324" font-weight="bold" fill="#00897b">3 = 3; both 1s stretch → (3, 224, 224)</text>
    <text x="300" y="344" font-size="12" fill="#555">one mean per plane, the same for every pixel in it</text>
  </g>
  <g opacity="0" font-size="13" font-weight="bold"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.71;0.96;1" dur="10s" repeatCount="indefinite"/>
    <text x="30" y="318" fill="#ef6c00">R plane − 0.485</text>
    <text x="30" y="340" fill="#00897b">G plane − 0.456</text>
    <text x="30" y="362" fill="#3949ab">B plane − 0.406</text>
  </g>
</svg>
