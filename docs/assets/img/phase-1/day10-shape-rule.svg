<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<text x="20" y="26" font-weight="bold" font-size="15">The shape rule: inner dimensions must match, outer dimensions survive</text>
<text x="88" y="135" text-anchor="middle" font-size="30" fill="#333" font-weight="normal">(</text>
<text x="114" y="135" text-anchor="middle" font-size="30" fill="#3949ab" font-weight="bold">m</text>
<text x="138" y="135" text-anchor="middle" font-size="30" fill="#333" font-weight="normal">,</text>
<text x="164" y="135" text-anchor="middle" font-size="30" fill="#e53935" font-weight="bold">n</text>
<text x="190" y="135" text-anchor="middle" font-size="30" fill="#333" font-weight="normal">)</text>
<text x="328" y="135" text-anchor="middle" font-size="30" fill="#333" font-weight="normal">(</text>
<text x="354" y="135" text-anchor="middle" font-size="30" fill="#e53935" font-weight="bold">n</text>
<text x="378" y="135" text-anchor="middle" font-size="30" fill="#333" font-weight="normal">,</text>
<text x="404" y="135" text-anchor="middle" font-size="30" fill="#00897b" font-weight="bold">p</text>
<text x="430" y="135" text-anchor="middle" font-size="30" fill="#333" font-weight="normal">)</text>
<text x="568" y="135" text-anchor="middle" font-size="30" fill="#333" font-weight="normal">(</text>
<text x="594" y="135" text-anchor="middle" font-size="30" fill="#3949ab" font-weight="bold">m</text>
<text x="618" y="135" text-anchor="middle" font-size="30" fill="#333" font-weight="normal">,</text>
<text x="644" y="135" text-anchor="middle" font-size="30" fill="#00897b" font-weight="bold">p</text>
<text x="670" y="135" text-anchor="middle" font-size="30" fill="#333" font-weight="normal">)</text>
<text x="260" y="135" text-anchor="middle" font-size="28" fill="#555">@</text>
<text x="500" y="135" text-anchor="middle" font-size="28" fill="#555">→</text>
<text x="140" y="165" text-anchor="middle" font-size="12" fill="#555">A</text>
<text x="380" y="165" text-anchor="middle" font-size="12" fill="#555">B</text>
<text x="620" y="165" text-anchor="middle" font-size="12" fill="#555">C = A @ B</text>
<path d="M164,175 L164,187 L354,187 L354,175" fill="none" stroke="#e53935" stroke-width="2.5"/>
<text x="259" y="207" text-anchor="middle" font-size="13" fill="#e53935" font-weight="bold">inner: must be equal (they get summed away)</text>
<path d="M114,105 C114,55 594,55 594,105" fill="none" stroke="#3949ab" stroke-width="2.5" stroke-dasharray="560" stroke-dashoffset="560"><animate attributeName="stroke-dashoffset" values="560;560;0;0;560" keyTimes="0;0.15;0.45;0.95;1" dur="6s" repeatCount="indefinite"/></path>
<path d="M404,105 C404,73 644,73 644,105" fill="none" stroke="#00897b" stroke-width="2.5" stroke-dasharray="300" stroke-dashoffset="300"><animate attributeName="stroke-dashoffset" values="300;300;0;0;300" keyTimes="0;0.15;0.45;0.95;1" dur="6s" repeatCount="indefinite"/></path>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.95;1" dur="6s" repeatCount="indefinite"/><text x="354" y="50" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">outer: become the result shape</text></g>
<rect x="20" y="224" width="680" height="98" rx="8" fill="#e8eaf6" fill-opacity="0.5"/>
<text x="36" y="246" font-family="Menlo, Consolas, monospace" font-size="14" fill="#00897b">(2, 3) @ (3, 2) → (2, 2)</text>
<text x="400" y="246" font-size="12" fill="#555">the worked example above</text>
<text x="36" y="268" font-family="Menlo, Consolas, monospace" font-size="14" fill="#00897b">(3,) @ (3,) → ()</text>
<text x="400" y="268" font-size="12" fill="#555">vector · vector = one number (Day 5)</text>
<text x="36" y="290" font-family="Menlo, Consolas, monospace" font-size="14" fill="#00897b">(32, 784) @ (784, 128) → (32, 128)</text>
<text x="400" y="290" font-size="12" fill="#555">32 images × 128 neurons (Day 12)</text>
<text x="36" y="312" font-family="Menlo, Consolas, monospace" font-size="14" fill="#e53935">(2, 3) @ (2, 3) → ValueError</text>
<text x="400" y="312" font-size="12" fill="#555">inner 3 ≠ 2: transpose one first (Day 11)</text>
