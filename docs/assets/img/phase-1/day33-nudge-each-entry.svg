<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
  <defs>
    <marker id="d33n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <text x="20" y="28" font-weight="bold" font-size="15">One nudge per entry: the gradient has the same shape as w</text>
  <text x="20" y="48" font-size="12" fill="#555">f(w) = 3w₁ + 5w₂ − 2w₃ + w₁w₂ at w = [1, 2, 3], so f(w) = 9. Nudge size h = 0.1.</text>

  <!-- left: the parameter vector w -->
  <text x="75" y="84" text-anchor="middle" font-weight="bold" fill="#3949ab">w</text>
  <g fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5">
    <rect x="45" y="96" width="60" height="44" rx="4"/>
    <rect x="45" y="146" width="60" height="44" rx="4"/>
    <rect x="45" y="196" width="60" height="44" rx="4"/>
  </g>
  <!-- highlight on the entry being nudged -->
  <rect x="45" y="96" width="60" height="44" rx="4" fill="#fff59d" stroke="#ef6c00" stroke-width="3" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.06;0.86;1" values="0;1;0;0"/>
    <animate attributeName="y" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.33;0.6;1" values="96;146;196;196"/>
  </rect>
  <g text-anchor="middle" font-size="16">
    <text x="75" y="124">1</text>
    <text x="75" y="174">2</text>
    <text x="75" y="224">3</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="20" y="123">w₁</text><text x="20" y="173">w₂</text><text x="20" y="223">w₃</text>
  </g>
  <text x="75" y="260" text-anchor="middle" font-size="12" fill="#555">shape (3,)</text>

  <!-- middle: the computation for the current entry -->
  <rect x="150" y="80" width="370" height="190" rx="8" fill="#fff3e0"/>
  <line x1="112" y1="175" x2="146" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#d33n)"/>
  <line x1="524" y1="175" x2="560" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#d33n)"/>
  <text x="335" y="104" text-anchor="middle" font-weight="bold">Central difference (Day 29), one entry at a time</text>

  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.06;0.33;1" values="0;1;0;0"/>
    <text x="165" y="138">nudge w₁ up:    f(1.1, 2, 3) = 9.5</text>
    <text x="165" y="164">nudge w₁ down:  f(0.9, 2, 3) = 8.5</text>
    <text x="165" y="200">∂f/∂w₁ ≈ (9.5 − 8.5) / 0.2 = <tspan font-weight="bold" fill="#e53935">5</tspan></text>
    <text x="165" y="226" font-size="12" fill="#555">by hand: 3 + w₂ = 3 + 2 = 5</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.33;0.6;1" values="0;1;0;0"/>
    <text x="165" y="138">nudge w₂ up:    f(1, 2.1, 3) = 9.6</text>
    <text x="165" y="164">nudge w₂ down:  f(1, 1.9, 3) = 8.4</text>
    <text x="165" y="200">∂f/∂w₂ ≈ (9.6 − 8.4) / 0.2 = <tspan font-weight="bold" fill="#e53935">6</tspan></text>
    <text x="165" y="226" font-size="12" fill="#555">by hand: 5 + w₁ = 5 + 1 = 6</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6;0.86;1" values="0;1;0;0"/>
    <text x="165" y="138">nudge w₃ up:    f(1, 2, 3.1) = 8.8</text>
    <text x="165" y="164">nudge w₃ down:  f(1, 2, 2.9) = 9.2</text>
    <text x="165" y="200">∂f/∂w₃ ≈ (8.8 − 9.2) / 0.2 = <tspan font-weight="bold" fill="#e53935">−2</tspan></text>
    <text x="165" y="226" font-size="12" fill="#555">by hand: −2 (w₃ only appears in −2w₃)</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.86;1" values="0;1;1"/>
    <text x="335" y="150" text-anchor="middle">3 entries → 3 nudges → 3 slopes</text>
    <text x="335" y="180" text-anchor="middle">∇f = [5, 6, −2]</text>
    <text x="335" y="212" text-anchor="middle" font-size="12" fill="#555">a 2×3 matrix W would take 6 nudges</text>
    <text x="335" y="230" text-anchor="middle" font-size="12" fill="#555">and give a 2×3 gradient</text>
  </g>
  <text x="335" y="258" text-anchor="middle" font-size="12" fill="#555">the other entries stay frozen while one moves (Day 32)</text>

  <!-- right: the gradient filling in -->
  <text x="600" y="84" text-anchor="middle" font-weight="bold" fill="#00897b">∇f</text>
  <g fill="#e0f2f1" stroke="#00897b" stroke-width="1.5">
    <rect x="570" y="96" width="60" height="44" rx="4"/>
    <rect x="570" y="146" width="60" height="44" rx="4"/>
    <rect x="570" y="196" width="60" height="44" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="16" font-weight="bold" fill="#e53935">
    <text x="600" y="124" opacity="0">5<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.22;1" values="0;1;1"/></text>
    <text x="600" y="174" opacity="0">6<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.49;1" values="0;1;1"/></text>
    <text x="600" y="224" opacity="0">−2<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.76;1" values="0;1;1"/></text>
  </g>
  <g font-size="12" fill="#555">
    <text x="640" y="123">∂f/∂w₁</text><text x="640" y="173">∂f/∂w₂</text><text x="640" y="223">∂f/∂w₃</text>
  </g>
  <text x="600" y="260" text-anchor="middle" font-size="12" fill="#555">shape (3,)</text>

  <text x="20" y="300" font-size="12" fill="#555">Each slot of the gradient answers one question: "if I nudge this one parameter, how fast does f change?"</text>
  <text x="20" y="318" font-size="12" fill="#555">That is why the gradient always has exactly the parameter's shape. (f is linear in each single entry, so h = 0.1 is exact here.)</text>
</svg>
