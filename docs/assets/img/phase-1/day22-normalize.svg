    <text x="555" y="86" text-anchor="middle" font-weight="bold" font-size="15">Before: any length</text><text x="555" y="120" text-anchor="middle" font-size="13">‖a‖ = 3.16,  ‖b‖ = 2.69</text><text x="555" y="146" text-anchor="middle" font-size="13">‖c‖ = 1.58,  ‖d‖ = 0.50</text><text x="555" y="190" text-anchor="middle" font-size="13" fill="#7b1fa2">distance a to b: 2.50</text><text x="555" y="214" text-anchor="middle" font-size="12" fill="#555">mixes length and direction</text>
