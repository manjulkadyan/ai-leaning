<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 295" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<text x="20" y="28" font-weight="bold" font-size="15">Conditioning = zooming into one row or one column of the count table</text>
<rect x="20" y="150" width="410" height="50" fill="#fff59d" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13.0s" repeatCount="indefinite" keyTimes="0.0000;0.2308;0.5385;0.8462" values="0;1;0;0"/></rect>
<rect x="250" y="55" width="100" height="195" fill="#b2dfdb" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13.0s" repeatCount="indefinite" keyTimes="0.0000;0.2308;0.5385;0.8462" values="0;0;1;0"/></rect>
<g stroke="#9fa8da" stroke-width="1.2" fill="none">
<line x1="20" y1="55" x2="20" y2="250"/>
<line x1="150" y1="55" x2="150" y2="250"/>
<line x1="250" y1="55" x2="250" y2="250"/>
<line x1="350" y1="55" x2="350" y2="250"/>
<line x1="430" y1="55" x2="430" y2="250"/>
<line x1="20" y1="55" x2="430" y2="55"/>
<line x1="20" y1="100" x2="430" y2="100"/>
<line x1="20" y1="150" x2="430" y2="150"/>
<line x1="20" y1="200" x2="430" y2="200"/>
<line x1="20" y1="250" x2="430" y2="250"/>
<line x1="20" y1="200" x2="430" y2="200" stroke-width="2.5"/>
<line x1="350" y1="55" x2="350" y2="250" stroke-width="2.5"/>
</g>
<text x="200.0" y="82.5" text-anchor="middle" font-weight="bold" font-size="13">rating &lt; 4.5</text>
<text x="300.0" y="82.5" text-anchor="middle" font-weight="bold" font-size="13">rating ≥ 4.5</text>
<text x="390.0" y="82.5" text-anchor="middle" font-weight="bold" font-size="13">total</text>
<text x="32" y="130.0" font-weight="bold" font-size="13">no ads</text>
<text x="200.0" y="130.0" text-anchor="middle" font-size="16">121</text>
<text x="300.0" y="130.0" text-anchor="middle" font-size="16">50</text>
<text x="390.0" y="130.0" text-anchor="middle" font-size="16">171</text>
<text x="32" y="180.0" font-weight="bold" font-size="13">has ads</text>
<text x="200.0" y="180.0" text-anchor="middle" font-size="16">208</text>
<text x="300.0" y="180.0" text-anchor="middle" font-size="16" fill="#e53935" font-weight="bold">83</text>
<text x="390.0" y="180.0" text-anchor="middle" font-size="16">291</text>
<text x="32" y="230.0" font-weight="bold" font-size="13">total</text>
<text x="200.0" y="230.0" text-anchor="middle" font-size="16">329</text>
<text x="300.0" y="230.0" text-anchor="middle" font-size="16">133</text>
<text x="390.0" y="230.0" text-anchor="middle" font-size="16">462</text>
<rect x="21" y="101" width="408" height="48" fill="#ffffff" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13.0s" repeatCount="indefinite" keyTimes="0.0000;0.2308;0.5385;0.8462" values="0;0.75;0;0"/></rect>
<rect x="21" y="201" width="408" height="48" fill="#ffffff" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13.0s" repeatCount="indefinite" keyTimes="0.0000;0.2308;0.5385;0.8462" values="0;0.75;0;0"/></rect>
<rect x="151" y="101" width="98" height="148" fill="#ffffff" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13.0s" repeatCount="indefinite" keyTimes="0.0000;0.2308;0.5385;0.8462" values="0;0;0.75;0"/></rect>
<rect x="351" y="101" width="78" height="148" fill="#ffffff" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13.0s" repeatCount="indefinite" keyTimes="0.0000;0.2308;0.5385;0.8462" values="0;0;0.75;0"/></rect>
<text x="20" y="278" font-size="12" fill="#555">462 rated Play Store apps (course dataset), counted by "has ads" and "rating ≥ 4.5"</text>
<rect x="460" y="55" width="265" height="195" rx="8" fill="#e8eaf6"/>
<g opacity="1"><animate attributeName="opacity" calcMode="discrete" dur="13.0s" repeatCount="indefinite" keyTimes="0.0000;0.2308;0.5385;0.8462" values="1;0;0;0"/>
<text x="592.5" y="85" text-anchor="middle" font-weight="bold" font-size="16">The whole table</text>
<text x="592.5" y="118" text-anchor="middle" font-size="15">P(rating ≥ 4.5) = 133 / 462</text>
<text x="592.5" y="146" text-anchor="middle" font-size="18" font-weight="bold" fill="#3949ab">= 0.288</text>
<text x="592.5" y="184" text-anchor="middle" font-size="12" fill="#555">denominator: all 462 apps</text>
</g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13.0s" repeatCount="indefinite" keyTimes="0.0000;0.2308;0.5385;0.8462" values="0;1;0;0"/>
<text x="592.5" y="85" text-anchor="middle" font-weight="bold" font-size="16">Given: has ads</text>
<text x="592.5" y="118" text-anchor="middle" font-size="15">P(rating ≥ 4.5 | ads) = 83 / 291</text>
<text x="592.5" y="146" text-anchor="middle" font-size="18" font-weight="bold" fill="#ef6c00">= 0.285</text>
<text x="592.5" y="184" text-anchor="middle" font-size="12" fill="#555">the row becomes the whole world:</text>
<text x="592.5" y="202" text-anchor="middle" font-size="12" fill="#555">denominator 291</text>
</g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13.0s" repeatCount="indefinite" keyTimes="0.0000;0.2308;0.5385;0.8462" values="0;0;1;0"/>
<text x="592.5" y="85" text-anchor="middle" font-weight="bold" font-size="16">Given: rating ≥ 4.5</text>
<text x="592.5" y="118" text-anchor="middle" font-size="15">P(ads | rating ≥ 4.5) = 83 / 133</text>
<text x="592.5" y="146" text-anchor="middle" font-size="18" font-weight="bold" fill="#00897b">= 0.624</text>
<text x="592.5" y="184" text-anchor="middle" font-size="12" fill="#555">same 83 apps, different world:</text>
<text x="592.5" y="202" text-anchor="middle" font-size="12" fill="#555">denominator 133</text>
</g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13.0s" repeatCount="indefinite" keyTimes="0.0000;0.2308;0.5385;0.8462" values="0;0;0;1"/>
<text x="592.5" y="85" text-anchor="middle" font-weight="bold" font-size="15">Same numerator, two questions</text>
<text x="592.5" y="120" text-anchor="middle" font-size="15" fill="#ef6c00" font-weight="bold">P(high | ads) = 0.285</text>
<text x="592.5" y="148" text-anchor="middle" font-size="15" fill="#00897b" font-weight="bold">P(ads | high) = 0.624</text>
<text x="592.5" y="184" text-anchor="middle" font-size="12" fill="#555">the bar | means "given";</text>
<text x="592.5" y="202" text-anchor="middle" font-size="12" fill="#555">swapping its sides changes the answer</text>
</g>
</svg>