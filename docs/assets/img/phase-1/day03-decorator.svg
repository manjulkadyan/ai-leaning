<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3949ab"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker></defs>
<rect width="720" height="430" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16">@logged moves the name mul to a wrapper</text>
<text x="20" y="52" font-size="13" font-family="Courier New, monospace" fill="#555">@logged</text>
<text x="20" y="70" font-size="13" font-family="Courier New, monospace" fill="#555">def mul(a, b): return a * b      # means: mul = logged(mul)</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0;0.015;0.33;0.345;1" dur="12s" repeatCount="indefinite"/><text x="20" y="410" font-size="13" fill="#555">Step 1: def runs. It builds the function and binds the name mul to it.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.345;0.62;0.635;1" dur="12s" repeatCount="indefinite"/><text x="20" y="410" font-size="13" fill="#555">Step 2: Python calls logged(mul). logged builds wrapper; its cell fn holds the original.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.635;0.97;0.985;1" dur="12s" repeatCount="indefinite"/><text x="20" y="410" font-size="13" fill="#555">Step 3: the name mul is rebound to wrapper. Every call now enters the wrapper first.</text></g>
<rect x="30" y="185" width="90" height="40" rx="20" fill="#fff59d" stroke="#ef6c00" stroke-width="2"/>
<text x="75" y="210" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">mul</text>
<text x="75" y="245" text-anchor="middle" font-size="11" fill="#555">the name</text>
<rect x="440" y="95" width="250" height="75" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="565" y="118" text-anchor="middle" font-weight="bold" fill="#3949ab">original function</text>
<text x="565" y="140" text-anchor="middle" font-size="12" font-family="Courier New, monospace">__name__ = 'mul'</text>
<text x="565" y="159" text-anchor="middle" font-size="12" font-family="Courier New, monospace">return a * b</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0;0.015;0.62;0.635;1" dur="12s" repeatCount="indefinite"/><path d="M120,200 C 250,200 300,135 438,132" fill="none" stroke="#ef6c00" stroke-width="2.5" marker-end="url(#ao)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.345;0.97;0.985;1" dur="12s" repeatCount="indefinite"/><rect x="230" y="255" width="370" height="125" rx="6" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/><text x="415" y="277" text-anchor="middle" font-weight="bold" fill="#00897b">wrapper (built by logged)</text><text x="245" y="300" font-size="12" font-family="Courier New, monospace">print(f"calling {fn.__name__}{args}")</text><text x="245" y="320" font-size="12" font-family="Courier New, monospace">result = fn(*args, **kwargs)</text><text x="245" y="340" font-size="12" font-family="Courier New, monospace">print(f"{fn.__name__} returned {result}")</text><text x="245" y="360" font-size="12" font-family="Courier New, monospace">return result</text><rect x="610" y="300" width="55" height="26" rx="4" fill="#fff3e0" stroke="#ef6c00"/><line x1="600" y1="313" x2="610" y2="313" stroke="#ef6c00" stroke-width="1.5"/><text x="637" y="318" text-anchor="middle" font-size="12" font-weight="bold">fn</text><path d="M637,300 L 600,172" fill="none" stroke="#3949ab" stroke-width="2" marker-end="url(#ab)"/><text x="610" y="345" font-size="11" fill="#3949ab">closure cell:</text><text x="610" y="359" font-size="11" fill="#3949ab">keeps the</text><text x="610" y="373" font-size="11" fill="#3949ab">original alive</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.635;0.97;0.985;1" dur="12s" repeatCount="indefinite"/><path d="M120,210 C 170,240 190,300 228,310" fill="none" stroke="#ef6c00" stroke-width="2.5" marker-end="url(#ao)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.735;0.95;0.965;1" dur="12s" repeatCount="indefinite"/><circle r="7" fill="#e53935"><animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.72;0.92;1" calcMode="linear" path="M120,210 C 170,240 190,300 228,315 L 222,392 L 690,392 L 690,313 L 665,313 L 637,300 L 600,175"/></circle><text x="30" y="290" font-size="12" fill="#e53935">mul(4, 5)</text></g>
</svg>