<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="fg-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e53935"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="280" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-weight="bold">The only doubles near 0.3 (the number line, hugely zoomed in)</text>

  <!-- number line -->
  <line x1="30" y1="140" x2="690" y2="140" stroke="#3949ab" stroke-width="2"/>
  <!-- representable doubles -->
  <g stroke="#3949ab" stroke-width="3">
    <line x1="120" y1="126" x2="120" y2="154"/>
    <line x1="330" y1="126" x2="330" y2="154"/>
    <line x1="540" y1="126" x2="540" y2="154"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#3949ab">
    <text x="120" y="116">0.29999999999999993339</text>
    <text x="300" y="100">0.29999999999999998890</text>
    <text x="560" y="100">0.30000000000000004441</text>
  </g>
  <line x1="320" y1="104" x2="328" y2="124" stroke="#3949ab"/>
  <line x1="552" y1="104" x2="542" y2="124" stroke="#3949ab"/>

  <!-- true 0.3 -->
  <path d="M372,140 l-6,-12 h12 z" fill="#ef6c00"/>
  <text x="372" y="72" text-anchor="middle" fill="#ef6c00" font-size="12">true 0.3</text>
  <line x1="372" y1="76" x2="372" y2="126" stroke="#ef6c00" stroke-dasharray="3 3"/>

  <!-- exact sum, a tie -->
  <circle cx="435" cy="140" r="6" fill="#e53935"/>
  <path d="M438,148 Q488,190 536,148" fill="none" stroke="#e53935" stroke-width="2" marker-end="url(#fg-h)"/>
  <text x="435" y="208" text-anchor="middle" fill="#e53935" font-size="12">exact sum of stored 0.1 and stored 0.2:</text>
  <text x="435" y="223" text-anchor="middle" fill="#e53935" font-size="12">halfway between two doubles, rounds to the right one</text>

  <!-- captions under ticks -->
  <text x="330" y="176" text-anchor="middle" font-size="12" fill="#555">the literal 0.3</text>
  <text x="330" y="190" text-anchor="middle" font-size="12" fill="#555">is stored here</text>
  <text x="600" y="176" text-anchor="middle" font-size="12" fill="#555">0.1 + 0.2</text>
  <text x="600" y="190" text-anchor="middle" font-size="12" fill="#555">ends up here</text>

  <!-- gap bracket -->
  <path d="M330,246 v8 h210 v-8" fill="none" stroke="#555"/>
  <text x="435" y="270" text-anchor="middle" font-size="12" fill="#555">one step between neighbours: 5.55e-17</text>
  <text x="30" y="176" font-size="12" fill="#555">between the ticks:</text>
  <text x="30" y="190" font-size="12" fill="#555">no float exists</text>
</svg>
