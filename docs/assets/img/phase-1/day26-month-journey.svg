<rect x="14" y="178" width="732" height="96" rx="8" fill="#fafafa" stroke="#ddd"/>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="18s" repeatCount="indefinite"/><text x="30" y="206" font-size="16" font-weight="bold">Python: names point at objects</text><text x="30" y="230" font-size="13" fill="#333">lists, dicts, slicing, comprehensions, functions, dataclasses</text><text x="30" y="258" font-family="Menlo, Consolas, monospace" font-size="13" fill="#3949ab">b = a   # same list, not a copy</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="18s" repeatCount="indefinite"/><text x="30" y="206" font-size="16" font-weight="bold">NumPy: one dtype, one block of memory, no loops</text><text x="30" y="230" font-size="13" fill="#333">shape and axis, vectors and cosine, reshape, broadcasting</text><text x="30" y="258" font-family="Menlo, Consolas, monospace" font-size="13" fill="#3949ab">X.mean(axis=0)   # (n, d) → (d,)</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="18s" repeatCount="indefinite"/><text x="30" y="206" font-size="16" font-weight="bold">Matrices: a layer is a matrix multiply</text><text x="30" y="230" font-size="13" fill="#333">row·column, shape rule, transpose, inverse and solve, ReLU, FLOPs</text><text x="30" y="258" font-family="Menlo, Consolas, monospace" font-size="13" fill="#3949ab">(64, 20) @ (20, 50) → (64, 50)</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="18s" repeatCount="indefinite"/><text x="30" y="206" font-size="16" font-weight="bold">pandas: labelled columns you can trust</text><text x="30" y="230" font-size="13" fill="#333">select and filter, clean the mess, groupby, merge, honest charts</text><text x="30" y="258" font-family="Menlo, Consolas, monospace" font-size="13" fill="#3949ab">apps.groupby("category")["rating"].mean()</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="18s" repeatCount="indefinite"/><text x="30" y="206" font-size="16" font-weight="bold">Linear algebra: lengths, directions, structure</text><text x="30" y="230" font-size="13" fill="#333">norms and distances, rank and span, eigenvectors, projections, PCA</text><text x="30" y="258" font-family="Menlo, Consolas, monospace" font-size="13" fill="#3949ab">vals, vecs = np.linalg.eigh(np.cov(Xc.T))</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="18s" repeatCount="indefinite"/><text x="30" y="206" font-size="16" font-weight="bold">Milestone: every station at once</text><text x="30" y="230" font-size="13" fill="#333">matmul and norms from scratch vs NumPy, then a five-plot analysis</text><text x="30" y="258" font-family="Menlo, Consolas, monospace" font-size="13" fill="#3949ab">assert np.allclose(matmul_py(A, B), A @ B)</text></g>
<text x="14" y="302" font-size="12" fill="#555">Each station is built on the one before it: pandas columns are NumPy arrays, and PCA is matrices plus eigenvectors.</text>
