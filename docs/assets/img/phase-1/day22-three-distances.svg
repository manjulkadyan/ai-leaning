<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
  <text x="20" y="28" font-weight="bold" font-size="15">Three ways to measure the distance from A to B</text>
  <g stroke="#e0e0e0">
    <line x1="50" y1="335" x2="50" y2="65"/>
    <line x1="95" y1="335" x2="95" y2="65"/>
    <line x1="140" y1="335" x2="140" y2="65"/>
    <line x1="185" y1="335" x2="185" y2="65"/>
    <line x1="230" y1="335" x2="230" y2="65"/>
    <line x1="275" y1="335" x2="275" y2="65"/>
    <line x1="50" y1="335" x2="275" y2="335"/>
    <line x1="50" y1="290" x2="275" y2="290"/>
    <line x1="50" y1="245" x2="275" y2="245"/>
    <line x1="50" y1="200" x2="275" y2="200"/>
    <line x1="50" y1="155" x2="275" y2="155"/>
    <line x1="50" y1="110" x2="275" y2="110"/>
    <line x1="50" y1="65" x2="275" y2="65"/>
  </g>
  <polyline points="95,290 230,110" fill="none" stroke="#00897b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="225.0 235.0" stroke-dashoffset="225.0">
    <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite" keyTimes="0;0.042;0.208;1" values="225.0;225.0;0;0"/>
  </polyline>
  <polyline points="95,290 140,290 140,245 185,245 185,200 230,200 230,155 230,110" fill="none" stroke="#3949ab" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="315.0 325.0" stroke-dashoffset="315.0">
    <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite" keyTimes="0;0.292;0.542;1" values="315.0;315.0;0;0"/>
  </polyline>
  <polyline points="95,290 95,245 140,200 185,155 230,110" fill="none" stroke="#ef6c00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="235.9 245.9" stroke-dashoffset="235.9">
    <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite" keyTimes="0;0.625;0.792;1" values="235.9;235.9;0;0"/>
  </polyline>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0;0.542" values="0;1"/>
    <text x="126" y="285" font-size="11" fill="#3949ab" text-anchor="middle">1</text><text x="149" y="262" font-size="11" fill="#3949ab" text-anchor="middle">2</text><text x="172" y="240" font-size="11" fill="#3949ab" text-anchor="middle">3</text><text x="194" y="218" font-size="11" fill="#3949ab" text-anchor="middle">4</text><text x="216" y="195" font-size="11" fill="#3949ab" text-anchor="middle">5</text><text x="239" y="172" font-size="11" fill="#3949ab" text-anchor="middle">6</text><text x="239" y="128" font-size="11" fill="#3949ab" text-anchor="middle">7</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0;0.792" values="0;1"/>
    <text x="84" y="264" font-size="11" fill="#ef6c00" text-anchor="middle">1</text><text x="106" y="218" font-size="11" fill="#ef6c00" text-anchor="middle">2</text><text x="152" y="174" font-size="11" fill="#ef6c00" text-anchor="middle">3</text><text x="196" y="128" font-size="11" fill="#ef6c00" text-anchor="middle">4</text>
  </g>
  <circle cx="95" cy="290" r="6" fill="#333"/><text x="87" y="310" font-weight="bold">A [1, 1]</text>
  <circle cx="230" cy="110" r="6" fill="#333"/><text x="240" y="102" font-weight="bold">B [4, 5]</text>
  <text x="50" y="352" font-size="12" fill="#555">grid: 1 square = 1 unit</text>
  <rect x="330" y="50" width="355" height="290" rx="8" fill="#f5f5f5"/>
  <text x="350" y="80" font-size="14">Difference B − A = <tspan font-weight="bold">[3, 4]</tspan></text>
  <text x="350" y="100" font-size="12" fill="#555">every distance below is a norm of this vector</text>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0;0.042" values="0;1"/>
    <rect x="345" y="115" width="325" height="62" rx="6" fill="#e0f2f1"/>
    <text x="358" y="138" font-weight="bold" fill="#00897b">Euclidean (L2): as the crow flies</text>
    <text x="358" y="163">√(3² + 4²) = √25 = <tspan font-weight="bold">5</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0;0.292" values="0;1"/>
    <rect x="345" y="187" width="325" height="62" rx="6" fill="#e8eaf6"/>
    <text x="358" y="210" font-weight="bold" fill="#3949ab">Manhattan (L1): a taxi on a street grid</text>
    <text x="358" y="235">|3| + |4| = <tspan font-weight="bold">7</tspan> blocks, whichever route</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0;0.625" values="0;1"/>
    <rect x="345" y="259" width="325" height="62" rx="6" fill="#fff3e0"/>
    <text x="358" y="282" font-weight="bold" fill="#ef6c00">Chebyshev (L∞): a chess king</text>
    <text x="358" y="307">max(|3|, |4|) = <tspan font-weight="bold">4</tspan> moves (diagonals are free)</text>
  </g>
</svg>
