<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<rect width="700" height="420" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16">Which blocks run: try, except, else, finally</text>
<g font-family="Courier New, monospace" font-size="13">
<rect x="250" y="50" width="200" height="50" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="350" y="72" text-anchor="middle" font-weight="bold">try:</text>
<text x="350" y="90" text-anchor="middle" font-size="12">lr = float(text)</text>
<rect x="60" y="160" width="200" height="50" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
<text x="160" y="182" text-anchor="middle" font-weight="bold">else:</text>
<text x="160" y="200" text-anchor="middle" font-size="12">print("parsed", lr)</text>
<rect x="440" y="160" width="220" height="50" rx="8" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
<text x="550" y="182" text-anchor="middle" font-weight="bold">except ValueError:</text>
<text x="550" y="200" text-anchor="middle" font-size="12">lr = 0.001</text>
<rect x="250" y="260" width="200" height="50" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
<text x="350" y="282" text-anchor="middle" font-weight="bold">finally:</text>
<text x="350" y="300" text-anchor="middle" font-size="12">print("done")</text>
<rect x="250" y="350" width="200" height="40" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
<text x="350" y="375" text-anchor="middle" font-size="12">next statement</text>
</g>
<g fill="none" stroke-width="2">
<path d="M300 100 L160 160 M160 210 L300 260 M350 310 L350 350" stroke="#00897b"/>
<path d="M400 100 L550 160 M550 210 L400 260" stroke="#e53935"/>
</g>
<text x="212" y="126" text-anchor="end" font-size="12" fill="#00897b" font-weight="bold">no exception</text>
<text x="490" y="128" font-size="12" fill="#e53935" font-weight="bold">ValueError raised</text>
<text x="20" y="250" font-size="12" fill="#555">else: only when try</text>
<text x="20" y="266" font-size="12" fill="#555">finished without error</text>
<text x="462" y="282" font-size="12" fill="#555">&#8592; finally: always, on both</text>
<text x="476" y="298" font-size="12" fill="#555">paths (even after return)</text>
<!-- run 1 -->
<g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.5;1" dur="10s" repeatCount="indefinite"/>
<text x="20" y="62" font-size="13" font-weight="bold" fill="#00897b">Run 1: text = "0.01"</text>
<circle r="9" fill="#00897b">
<animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;0;0.25;0.45;0.7;1;1" keyTimes="0;0.04;0.12;0.2;0.3;0.4;1" calcMode="linear" path="M350 75 L160 185 L350 285 L350 370"/>
</circle>
</g>
<!-- run 2 -->
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.52;1" dur="10s" repeatCount="indefinite"/>
<text x="20" y="62" font-size="13" font-weight="bold" fill="#e53935">Run 2: text = "abc"</text>
<circle r="9" fill="#e53935">
<animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;0;0;0.25;0.45;0.7;1;1" keyTimes="0;0.5;0.54;0.62;0.7;0.8;0.9;1" calcMode="linear" path="M350 75 L550 185 L350 285 L350 370"/>
</circle>
</g>
</svg>
