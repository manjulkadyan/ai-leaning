<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif" font-size="13" class="animated">
<text x="14" y="26" font-weight="bold" font-size="15">Week 6 in one picture: each day supplies one piece of a spam filter</text>
<rect x="14" y="44" width="112" height="96" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<rect x="14" y="44" width="112" height="96" rx="8" fill="#fff59d" stroke="#3949ab" stroke-width="3" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/></rect>
<text x="70.0" y="64" text-anchor="middle" font-size="11" fill="#555">Day 36</text>
<text x="70.0" y="88" text-anchor="middle" font-weight="bold" fill="#3949ab">probability</text>
<text x="70.0" y="114" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10.5">P(A) ≈ k / n</text>
<path d="M127 92 L137 92" stroke="#555" stroke-width="1.5"/>
<path d="M133 88 L137 92 L133 96" fill="none" stroke="#555" stroke-width="1.5"/>
<path d="M62.0 158 L70.0 148 L78.0 158 Z" fill="#3949ab" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/></path>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/><rect x="14" y="160" width="732" height="76" rx="8" fill="#ffffff" stroke="#3949ab" stroke-width="1.5"/><text x="30" y="190" font-weight="bold" fill="#3949ab">Day 36: Probability as a long-run frequency.</text><text x="30" y="216" fill="#222">P(spam) = 12 of 30 training messages = 0.4: the prior.</text></g>
<rect x="138" y="44" width="112" height="96" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
<rect x="138" y="44" width="112" height="96" rx="8" fill="#fff59d" stroke="#00897b" stroke-width="3" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/></rect>
<text x="194.0" y="64" text-anchor="middle" font-size="11" fill="#555">Day 37</text>
<text x="194.0" y="88" text-anchor="middle" font-weight="bold" fill="#00897b">distributions</text>
<text x="194.0" y="114" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10.5">a loaded die</text>
<path d="M251 92 L261 92" stroke="#555" stroke-width="1.5"/>
<path d="M257 88 L261 92 L257 96" fill="none" stroke="#555" stroke-width="1.5"/>
<path d="M186.0 158 L194.0 148 L202.0 158 Z" fill="#00897b" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/></path>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/><rect x="14" y="160" width="732" height="76" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><text x="30" y="190" font-weight="bold" fill="#00897b">Day 37: Each class is a loaded die with one face per word.</text><text x="30" y="216" fill="#222">Smoothed, spam's die shows "now" with probability 7/257 ≈ 0.027.</text></g>
<rect x="262" y="44" width="112" height="96" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
<rect x="262" y="44" width="112" height="96" rx="8" fill="#fff59d" stroke="#ef6c00" stroke-width="3" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/></rect>
<text x="318.0" y="64" text-anchor="middle" font-size="11" fill="#555">Day 38</text>
<text x="318.0" y="88" text-anchor="middle" font-weight="bold" fill="#ef6c00">Bayes' rule</text>
<text x="318.0" y="114" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10.5">P(c | words)</text>
<path d="M375 92 L385 92" stroke="#555" stroke-width="1.5"/>
<path d="M381 88 L385 92 L381 96" fill="none" stroke="#555" stroke-width="1.5"/>
<path d="M310.0 158 L318.0 148 L326.0 158 Z" fill="#ef6c00" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/></path>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/><rect x="14" y="160" width="732" height="76" rx="8" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><text x="30" y="190" font-weight="bold" fill="#ef6c00">Day 38: Flip the question: from P(words | spam) to P(spam | words).</text><text x="30" y="216" fill="#222">posterior ∝ likelihood × prior, then divide so the two add to 1.</text></g>
<rect x="386" y="44" width="112" height="96" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<rect x="386" y="44" width="112" height="96" rx="8" fill="#fff59d" stroke="#3949ab" stroke-width="3" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/></rect>
<text x="442.0" y="64" text-anchor="middle" font-size="11" fill="#555">Day 39</text>
<text x="442.0" y="88" text-anchor="middle" font-weight="bold" fill="#3949ab">averages</text>
<text x="442.0" y="114" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10.5">frequency → p</text>
<path d="M499 92 L509 92" stroke="#555" stroke-width="1.5"/>
<path d="M505 88 L509 92 L505 96" fill="none" stroke="#555" stroke-width="1.5"/>
<path d="M434.0 158 L442.0 148 L450.0 158 Z" fill="#3949ab" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/></path>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/><rect x="14" y="160" width="732" height="76" rx="8" fill="#ffffff" stroke="#3949ab" stroke-width="1.5"/><text x="30" y="190" font-weight="bold" fill="#3949ab">Day 39: Counted frequencies estimate probabilities, noisily.</text><text x="30" y="216" fill="#222">30 messages is tiny: add 1 to every count (Laplace smoothing).</text></g>
<rect x="510" y="44" width="112" height="96" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
<rect x="510" y="44" width="112" height="96" rx="8" fill="#fff59d" stroke="#00897b" stroke-width="3" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/></rect>
<text x="566.0" y="64" text-anchor="middle" font-size="11" fill="#555">Day 40</text>
<text x="566.0" y="88" text-anchor="middle" font-weight="bold" fill="#00897b">independence</text>
<text x="566.0" y="114" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10.5">P(a,b)=P(a)P(b)</text>
<path d="M623 92 L633 92" stroke="#555" stroke-width="1.5"/>
<path d="M629 88 L633 92 L629 96" fill="none" stroke="#555" stroke-width="1.5"/>
<path d="M558.0 158 L566.0 148 L574.0 158 Z" fill="#00897b" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/></path>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/><rect x="14" y="160" width="732" height="76" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><text x="30" y="190" font-weight="bold" fill="#00897b">Day 40: The naive step: words independent once the class is known.</text><text x="30" y="216" fill="#222">So a message's likelihood is a product of word probabilities.</text></g>
<rect x="634" y="44" width="112" height="96" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
<rect x="634" y="44" width="112" height="96" rx="8" fill="#fff59d" stroke="#ef6c00" stroke-width="3" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/></rect>
<text x="690.0" y="64" text-anchor="middle" font-size="11" fill="#555">Day 41</text>
<text x="690.0" y="88" text-anchor="middle" font-weight="bold" fill="#ef6c00">naive Bayes</text>
<text x="690.0" y="114" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10.5">Σ log P</text>
<path d="M682.0 158 L690.0 148 L698.0 158 Z" fill="#ef6c00" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/></path>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="12s" repeatCount="indefinite"/><rect x="14" y="160" width="732" height="76" rx="8" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><text x="30" y="190" font-weight="bold" fill="#ef6c00">Day 41: Take logs so the product becomes a sum, then compare two scores.</text><text x="30" y="216" fill="#222">9 of 10 test messages right; the 10th teaches you the most.</text></g>
<text x="14" y="262" font-size="12" fill="#555">The whole filter in one line:</text>
<text x="14" y="284" font-family="Menlo, Consolas, monospace" font-size="12.5">score(class) = log P(class) + Σ count(word) · log P(word | class);  bigger score wins</text>
</svg>