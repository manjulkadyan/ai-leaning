<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
  <text x="20" y="28" font-weight="bold" font-size="15">The expected value is the balance point of the probabilities</text>
  <text x="20" y="48" font-size="12" fill="#555">X = notifications a user opens in a day; bar height = p(x)</text>
  <!-- ground -->
  <line x1="40" y1="264" x2="420" y2="264" stroke="#90a4ae" stroke-width="2"/>
  <!-- plank + bars, rotating about the pivot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" dur="12s" repeatCount="indefinite" keyTimes="0;0.0833;0.2083;0.2917;0.4167;0.5417;0.625;0.75;1" values="0 140 220;0 140 220;8 140 220;0 140 220;0 290 220;-8 290 220;0 290 220;0 200 220;0 200 220"/>
    <rect x="50" y="217" width="360" height="6" rx="2" fill="#555"/>
    <rect x="62" y="137" width="36" height="80" fill="#c5cae9" stroke="#3949ab" stroke-width="1.5"/><text x="80" y="131" text-anchor="middle" font-size="12" fill="#3949ab">0.20</text><text x="80" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a237e">0</text><rect x="122" y="117" width="36" height="100" fill="#c5cae9" stroke="#3949ab" stroke-width="1.5"/><text x="140" y="111" text-anchor="middle" font-size="12" fill="#3949ab">0.25</text><text x="140" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a237e">1</text><rect x="182" y="137" width="36" height="80" fill="#c5cae9" stroke="#3949ab" stroke-width="1.5"/><text x="200" y="131" text-anchor="middle" font-size="12" fill="#3949ab">0.20</text><text x="200" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a237e">2</text><rect x="242" y="157" width="36" height="60" fill="#c5cae9" stroke="#3949ab" stroke-width="1.5"/><text x="260" y="151" text-anchor="middle" font-size="12" fill="#3949ab">0.15</text><text x="260" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a237e">3</text><rect x="302" y="177" width="36" height="40" fill="#c5cae9" stroke="#3949ab" stroke-width="1.5"/><text x="320" y="171" text-anchor="middle" font-size="12" fill="#3949ab">0.10</text><text x="320" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a237e">4</text><rect x="362" y="177" width="36" height="40" fill="#c5cae9" stroke="#3949ab" stroke-width="1.5"/><text x="380" y="171" text-anchor="middle" font-size="12" fill="#3949ab">0.10</text><text x="380" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a237e">5</text>
  </g>
  <!-- pivot -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" keyTimes="0;0.0833;0.2083;0.2917;0.4167;0.5417;0.625;0.75;1" values="140 0;140 0;140 0;140 0;290 0;290 0;290 0;200 0;200 0"/>
    <polygon points="0,223 -18,263 18,263" fill="#ef6c00" stroke="#bf360c" stroke-width="1"/>
  </g>
  <!-- explanation panel -->
  <rect x="440" y="62" width="250" height="150" rx="8" fill="#fff3e0"/>
  <g opacity="1"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0;0.2917;0.625" values="1;0;0"/><text x="570" y="92" text-anchor="middle" font-weight="bold" font-size="16" fill="#ef6c00">Pivot at 1</text>
<text x="570" y="122" text-anchor="middle" font-size="13" fill="#333">more weight sits to the right</text>
<text x="570" y="158" text-anchor="middle" font-size="14">Σ p(x)·(x − 1) = +1.0</text>
<text x="570" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#e53935">tips down to the right</text></g>
  <g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0;0.2917;0.625" values="0;1;0"/><text x="570" y="92" text-anchor="middle" font-weight="bold" font-size="16" fill="#ef6c00">Pivot at 3.5</text>
<text x="570" y="122" text-anchor="middle" font-size="13" fill="#333">now too far right</text>
<text x="570" y="158" text-anchor="middle" font-size="14">Σ p(x)·(x − 3.5) = −1.5</text>
<text x="570" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#e53935">tips down to the left</text></g>
  <g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0;0.2917;0.625" values="0;0;1"/><text x="570" y="92" text-anchor="middle" font-weight="bold" font-size="16" fill="#00897b">Pivot at 2.0 = E[X]</text>
<text x="570" y="122" text-anchor="middle" font-size="13" fill="#333">the balance point</text>
<text x="570" y="158" text-anchor="middle" font-size="14">Σ p(x)·(x − 2) = 0</text>
<text x="570" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#00897b">level: balanced</text></g>
  <rect x="20" y="282" width="670" height="38" rx="6" fill="#e0f2f1"/>
  <text x="355" y="306" text-anchor="middle" font-size="14">E[X] = 0(0.20) + 1(0.25) + 2(0.20) + 3(0.15) + 4(0.10) + 5(0.10) = <tspan font-weight="bold" fill="#00897b">2.0</tspan></text>
</svg>
