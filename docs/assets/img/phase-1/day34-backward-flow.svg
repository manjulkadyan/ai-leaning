<rect x="326" y="325" width="28" height="22" rx="5" fill="#ffcdd2" stroke="#e53935" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;1" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/></rect>
