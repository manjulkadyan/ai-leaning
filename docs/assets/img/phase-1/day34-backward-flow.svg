<text x="376" y="340" text-anchor="middle" font-weight="bold" font-size="12">x</text>
<text x="14" y="308" font-size="12.5" fill="#555" opacity="1">Forward pass done: f = 16. Every Value knows its children and the op that made it.<animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/></text>
<text x="14" y="308" font-size="12.5" fill="#555" opacity="0">backward() sets f.grad = 1: a nudge to f moves f by exactly the same amount.<animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/></text>
<text x="14" y="308" font-size="12.5" fill="#555" opacity="0">f = s**2 calls its _backward: s.grad += 2·s·f.grad = 2·4·1 = 8.<animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/></text>
<text x="14" y="308" font-size="12.5" fill="#555" opacity="0">s = q + z: a sum passes its gradient through unchanged, q.grad += 8, z.grad += 8.<animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/></text>
<text x="14" y="308" font-size="12.5" fill="#555" opacity="0">q = x·y: a product swaps the inputs, x.grad += y·8 = −24, y.grad += x·8 = 16.<animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/></text>
<text x="14" y="308" font-size="12.5" fill="#555" opacity="0">Done. Leaves have no _backward, so z, y and x pass nothing on. One sweep, every gradient.<animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" dur="15s" repeatCount="indefinite"/></text>
</svg>