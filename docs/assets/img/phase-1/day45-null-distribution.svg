<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<text x="20" y="28" font-weight="bold" font-size="15">A p-value: how surprising is 15 heads in 20 flips, if the coin is fair?</text>
<line x1="44" y1="290" x2="518" y2="290" stroke="#90a4ae" stroke-width="1.5"/>
<text x="61.0" y="308" text-anchor="middle" font-size="12">0</text>
<text x="171.0" y="308" text-anchor="middle" font-size="12">5</text>
<text x="281.0" y="308" text-anchor="middle" font-size="12">10</text>
<text x="391.0" y="308" text-anchor="middle" font-size="12">15</text>
<text x="501.0" y="308" text-anchor="middle" font-size="12">20</text>
<text x="281.0" y="328" text-anchor="middle" font-size="12" fill="#555">number of heads in 20 flips, if H₀ (fair coin) is true</text>
<rect x="52" y="290.0" width="18" height="0.0" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="74" y="290.0" width="18" height="0.0" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="96" y="289.8" width="18" height="0.2" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="118" y="288.7" width="18" height="1.3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="140" y="284.7" width="18" height="5.3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="162" y="273.0" width="18" height="17.0" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="184" y="247.5" width="18" height="42.5" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="206" y="205.0" width="18" height="85.0" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="228" y="151.8" width="18" height="138.2" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="250" y="105.8" width="18" height="184.2" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="272" y="87.4" width="18" height="202.6" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="294" y="105.8" width="18" height="184.2" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="316" y="151.8" width="18" height="138.2" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="338" y="205.0" width="18" height="85.0" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="360" y="247.5" width="18" height="42.5" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="382" y="273.0" width="18" height="17.0" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="404" y="284.7" width="18" height="5.3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="426" y="288.7" width="18" height="1.3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="448" y="289.8" width="18" height="0.2" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="470" y="290.0" width="18" height="0.0" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<rect x="492" y="290.0" width="18" height="0.0" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/>
<text x="281.0" y="79.4" text-anchor="middle" font-size="12" fill="#3949ab">0.176</text>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13s" repeatCount="indefinite" keyTimes="0;0.1923;0.9700" values="0;1;0"/><line x1="391.0" y1="70" x2="391.0" y2="290" stroke="#e53935" stroke-width="2" stroke-dasharray="5 3"/><text x="391.0" y="64" text-anchor="middle" font-weight="bold" fill="#e53935" font-size="13">you saw 15</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13s" repeatCount="indefinite" keyTimes="0;0.3846;0.9700" values="0;1;0"/><rect x="382" y="273.0" width="18" height="17.0" fill="#e53935" stroke="#b71c1c" stroke-width="1"/><rect x="404" y="284.7" width="18" height="5.3" fill="#e53935" stroke="#b71c1c" stroke-width="1"/><rect x="426" y="288.7" width="18" height="1.3" fill="#e53935" stroke="#b71c1c" stroke-width="1"/><rect x="448" y="289.8" width="18" height="0.2" fill="#e53935" stroke="#b71c1c" stroke-width="1"/><rect x="470" y="290.0" width="18" height="0.0" fill="#e53935" stroke="#b71c1c" stroke-width="1"/><rect x="492" y="290.0" width="18" height="0.0" fill="#e53935" stroke="#b71c1c" stroke-width="1"/><text x="446.0" y="215" text-anchor="middle" font-size="12" fill="#e53935">P(X ≥ 15)</text><text x="446.0" y="231" text-anchor="middle" font-size="12" fill="#e53935">= 0.0207</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13s" repeatCount="indefinite" keyTimes="0;0.5385;0.9700" values="0;1;0"/><rect x="52" y="290.0" width="18" height="0.0" fill="#e53935" stroke="#b71c1c" stroke-width="1"/><rect x="74" y="290.0" width="18" height="0.0" fill="#e53935" stroke="#b71c1c" stroke-width="1"/><rect x="96" y="289.8" width="18" height="0.2" fill="#e53935" stroke="#b71c1c" stroke-width="1"/><rect x="118" y="288.7" width="18" height="1.3" fill="#e53935" stroke="#b71c1c" stroke-width="1"/><rect x="140" y="284.7" width="18" height="5.3" fill="#e53935" stroke="#b71c1c" stroke-width="1"/><rect x="162" y="273.0" width="18" height="17.0" fill="#e53935" stroke="#b71c1c" stroke-width="1"/><line x1="171.0" y1="70" x2="171.0" y2="290" stroke="#e53935" stroke-width="1.5" stroke-dasharray="2 3"/><text x="116.0" y="215" text-anchor="middle" font-size="12" fill="#e53935">P(X ≤ 5)</text><text x="116.0" y="231" text-anchor="middle" font-size="12" fill="#e53935">= 0.0207</text></g>
<rect x="538" y="52" width="212" height="292" rx="8" fill="#e8eaf6" stroke="#3949ab"/>
<g opacity="1"><animate attributeName="opacity" calcMode="discrete" dur="13s" repeatCount="indefinite" keyTimes="0;0.9700" values="1;0"/><text x="548" y="78" font-size="13" xml:space="preserve">1. Assume nothing is going on:</text><text x="548" y="96" font-size="13" xml:space="preserve">   H₀: the coin is fair. Bars:</text><text x="548" y="114" font-size="13" xml:space="preserve">   how often each count happens.</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13s" repeatCount="indefinite" keyTimes="0;0.1923;0.9700" values="0;1;0"/><text x="548" y="140" font-size="13" xml:space="preserve">2. Compute the test statistic</text><text x="548" y="158" font-size="13" xml:space="preserve">   from the real data: 15 heads.</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13s" repeatCount="indefinite" keyTimes="0;0.3846;0.9700" values="0;1;0"/><text x="548" y="184" font-size="13" xml:space="preserve">3. Add up the probability of</text><text x="548" y="202" font-size="13" xml:space="preserve">   every result at least as</text><text x="548" y="220" font-size="13" xml:space="preserve">   extreme as the one you saw...</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13s" repeatCount="indefinite" keyTimes="0;0.5385;0.9700" values="0;1;0"/><text x="548" y="246" font-size="13" xml:space="preserve">4. ...in both directions</text><text x="548" y="264" font-size="13" xml:space="preserve">   (5 heads is just as lopsided).</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13s" repeatCount="indefinite" keyTimes="0;0.6923;0.9700" values="0;1;0"/><rect x="546" y="282" width="196" height="44" rx="6" fill="#fff59d" stroke="#ef6c00"/><text x="554" y="300" font-weight="bold" font-size="14">p = 0.0207 + 0.0207</text><text x="554" y="318" font-weight="bold" font-size="14">two-sided p = 0.041</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="13s" repeatCount="indefinite" keyTimes="0;0.6923;0.9700" values="0;1;0"/><text x="20" y="372" font-size="12" fill="#555">A fair coin gives a result this lopsided about 4 times in 100. Surprising, but not impossible: that is all a p-value says.</text></g>
</svg>
