<text x="20" y="26" font-weight="bold" font-size="15">uint8 has 8 bits, so it holds 0 to 255. Going past 255 wraps round to 0.</text>
<circle cx="150" cy="182" r="100" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
<line x1="150.0" y1="82.0" x2="150.0" y2="90.0" stroke="#3949ab"/><line x1="188.3" y1="89.6" x2="185.2" y2="97.0" stroke="#3949ab"/><line x1="220.7" y1="111.3" x2="215.1" y2="116.9" stroke="#3949ab"/><line x1="242.4" y1="143.7" x2="235.0" y2="146.8" stroke="#3949ab"/><line x1="250.0" y1="182.0" x2="242.0" y2="182.0" stroke="#3949ab"/><line x1="242.4" y1="220.3" x2="235.0" y2="217.2" stroke="#3949ab"/><line x1="220.7" y1="252.7" x2="215.1" y2="247.1" stroke="#3949ab"/><line x1="188.3" y1="274.4" x2="185.2" y2="267.0" stroke="#3949ab"/><line x1="150.0" y1="282.0" x2="150.0" y2="274.0" stroke="#3949ab"/><line x1="111.7" y1="274.4" x2="114.8" y2="267.0" stroke="#3949ab"/><line x1="79.3" y1="252.7" x2="84.9" y2="247.1" stroke="#3949ab"/><line x1="57.6" y1="220.3" x2="65.0" y2="217.2" stroke="#3949ab"/><line x1="50.0" y1="182.0" x2="58.0" y2="182.0" stroke="#3949ab"/><line x1="57.6" y1="143.7" x2="65.0" y2="146.8" stroke="#3949ab"/><line x1="79.3" y1="111.3" x2="84.9" y2="116.9" stroke="#3949ab"/><line x1="111.7" y1="89.6" x2="114.8" y2="97.0" stroke="#3949ab"/>
<text x="150.0" y="109.0" text-anchor="middle" font-size="12" fill="#555">0</text><text x="228.0" y="187.0" text-anchor="middle" font-size="12" fill="#555">64</text><text x="150.0" y="265.0" text-anchor="middle" font-size="12" fill="#555">128</text><text x="72.0" y="187.0" text-anchor="middle" font-size="12" fill="#555">192</text><line x1="135.3" y1="83.1" x2="133.9" y2="73.2" stroke="#ef6c00" stroke-width="2"/><text x="118.4" y="65.3" text-anchor="middle" font-size="13" font-weight="bold" fill="#ef6c00">250</text><line x1="159.8" y1="82.5" x2="160.8" y2="72.5" stroke="#ef6c00" stroke-width="2"/><text x="171.8" y="64.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#ef6c00">4</text>
<path d="M137.4,96.9 A86,86 0 0 1 158.4,96.4" fill="none" stroke="#ef6c00" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.15;1" dur="8s" calcMode="discrete" repeatCount="indefinite"/></path>
<g><line x1="150" y1="182" x2="150" y2="108" stroke="#e53935" stroke-width="4" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" values="351.562 150 182;351.562 150 182;365.625 150 182;365.625 150 182" keyTimes="0;0.15;0.5;1" dur="8s" repeatCount="indefinite"/></g>
<circle cx="150" cy="182" r="6" fill="#e53935"/>
<text x="150" y="216" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, monospace" opacity="1">250<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.5;1" dur="8s" calcMode="discrete" repeatCount="indefinite"/></text><text x="150" y="216" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#e53935" opacity="0">4<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="8s" calcMode="discrete" repeatCount="indefinite"/></text>
<line x1="310" y1="102" x2="500" y2="102" stroke="#555" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.15;1" dur="8s" calcMode="discrete" repeatCount="indefinite"/></line>
<text x="310" y="60" font-family="Menlo, Consolas, monospace" font-size="14" xml:space="preserve" fill="#222" opacity="1">  250  =   1111 1010<animate attributeName="opacity" values="1;0" keyTimes="0;1" dur="8s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="310" y="90" font-family="Menlo, Consolas, monospace" font-size="14" xml:space="preserve" fill="#222" opacity="0">+  10  =   0000 1010<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.15;1" dur="8s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="310" y="126" font-family="Menlo, Consolas, monospace" font-size="14" xml:space="preserve" fill="#222" opacity="0">= 260  = 1 0000 0100<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;1" dur="8s" calcMode="discrete" repeatCount="indefinite"/></text>
<rect x="383" y="110" width="14" height="22" fill="none" stroke="#e53935" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.45;1" dur="8s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="310" y="160" font-size="12" fill="#e53935" opacity="0">the 9th bit has nowhere to go, so it is dropped<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.45;1" dur="8s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="310" y="196" font-family="Menlo, Consolas, monospace" font-size="14" xml:space="preserve" opacity="0">stored: 0000 0100 = 4<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6;1" dur="8s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="310" y="226" font-size="12" fill="#555" opacity="0">the same as 260 − 256 = 4: arithmetic "modulo 256"<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6;1" dur="8s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="310" y="262" font-size="12" fill="#555">np.array([250], dtype=np.uint8) + 10  →  array([4], dtype=uint8)</text>
<text x="310" y="282" font-size="12" fill="#555">no error, no warning: a brightened pixel turns almost black</text>
</svg>
