<circle cx="90" cy="330" r="3" fill="#333"/>
<rect x="430" y="55" width="270" height="290" rx="8" fill="#e8eaf6"/>
<text x="565" y="84" text-anchor="middle" font-size="13" fill="#555">each step:  v ← A v / ‖A v‖</text>
<g opacity="1"><animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.1167;0.97" values="1;0;1"/>
<text x="565" y="130" text-anchor="middle" font-weight="bold" font-size="18">step 0</text>
<text x="565" y="175" text-anchor="middle" font-size="16" fill="#3949ab">v = [0.000, 1.000]</text>
<text x="565" y="215" text-anchor="middle" font-size="16">angle 90.0°</text>
<text x="565" y="245" text-anchor="middle" font-size="13" fill="#555">45.0° away from the eigen-line</text>
</g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.1167;0.2333" values="0;1;0"/>
<text x="565" y="130" text-anchor="middle" font-weight="bold" font-size="18">step 1</text>
<text x="565" y="175" text-anchor="middle" font-size="16" fill="#3949ab">v = [0.316, 0.949]</text>
<text x="565" y="215" text-anchor="middle" font-size="16">angle 71.6°</text>
<text x="565" y="245" text-anchor="middle" font-size="13" fill="#555">26.6° away from the eigen-line</text>
</g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.2333;0.3500" values="0;1;0"/>
<text x="565" y="130" text-anchor="middle" font-weight="bold" font-size="18">step 2</text>
<text x="565" y="175" text-anchor="middle" font-size="16" fill="#3949ab">v = [0.537, 0.844]</text>
<text x="565" y="215" text-anchor="middle" font-size="16">angle 57.5°</text>
<text x="565" y="245" text-anchor="middle" font-size="13" fill="#555">12.5° away from the eigen-line</text>
</g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.3500;0.4667" values="0;1;0"/>
<text x="565" y="130" text-anchor="middle" font-weight="bold" font-size="18">step 3</text>
<text x="565" y="175" text-anchor="middle" font-size="16" fill="#3949ab">v = [0.639, 0.770]</text>
<text x="565" y="215" text-anchor="middle" font-size="16">angle 50.3°</text>
<text x="565" y="245" text-anchor="middle" font-size="13" fill="#555">5.3° away from the eigen-line</text>
</g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.4667;0.5833" values="0;1;0"/>
<text x="565" y="130" text-anchor="middle" font-weight="bold" font-size="18">step 4</text>
<text x="565" y="175" text-anchor="middle" font-size="16" fill="#3949ab">v = [0.680, 0.733]</text>
<text x="565" y="215" text-anchor="middle" font-size="16">angle 47.2°</text>
<text x="565" y="245" text-anchor="middle" font-size="13" fill="#555">2.2° away from the eigen-line</text>
</g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.5833;0.7000" values="0;1;0"/>
<text x="565" y="130" text-anchor="middle" font-weight="bold" font-size="18">step 5</text>
<text x="565" y="175" text-anchor="middle" font-size="16" fill="#3949ab">v = [0.696, 0.718]</text>
<text x="565" y="215" text-anchor="middle" font-size="16">angle 45.9°</text>
<text x="565" y="245" text-anchor="middle" font-size="13" fill="#555">0.9° away from the eigen-line</text>
</g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.7000;0.9700" values="0;1;0"/>
<text x="565" y="130" text-anchor="middle" font-weight="bold" font-size="18">step 6</text>
<text x="565" y="175" text-anchor="middle" font-size="16" fill="#3949ab">v = [0.703, 0.711]</text>
<text x="565" y="215" text-anchor="middle" font-size="16">angle 45.4°</text>
<text x="565" y="245" text-anchor="middle" font-size="13" fill="#555">0.4° away from the eigen-line</text>
</g>
<text x="565" y="290" text-anchor="middle" font-size="12" fill="#555">the gap shrinks by about λ₂/λ₁ = 2/5</text>
<text x="565" y="307" text-anchor="middle" font-size="12" fill="#555">per step, so v lines up with [1, 1]</text>
<text x="565" y="324" text-anchor="middle" font-size="12" fill="#555">(the dominant eigenvector)</text>
</svg>
