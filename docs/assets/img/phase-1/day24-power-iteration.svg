<line x1="90" y1="330" x2="256.0" y2="129.9" stroke="#9fa8da" stroke-width="1.5" marker-end="url(#d24pg)" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.4375;0.97" values="0;1;0"/></line>
