<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<defs><marker id="d24p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3949ab"/></marker><marker id="d24pg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fa8da"/></marker></defs>
<text x="20" y="28" font-weight="bold" font-size="15">Power iteration: multiply by A, rescale to length 1, repeat</text>
<g stroke="#b0bec5" stroke-width="1.2"><line x1="70" y1="330" x2="390" y2="330"/><line x1="90" y1="345" x2="90" y2="50"/></g>
