<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<rect width="760" height="440" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16">A traceback is the call stack, printed when an exception escapes</text>
<text x="20" y="62" font-weight="bold" fill="#3949ab">The call stack (calls go down)</text>
<g font-size="13">
<rect x="20" y="76" width="230" height="44" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="32" y="96" font-weight="bold">train.py, line 4</text><text x="32" y="112" font-size="12" fill="#555">module level: load_config(lines)</text>
<rect x="20" y="146" width="230" height="44" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="32" y="166" font-weight="bold">config.py, line 10</text><text x="32" y="182" font-size="12" fill="#555">load_config: parse_lr(value)</text>
<rect x="20" y="216" width="230" height="44" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="32" y="236" font-weight="bold">config.py, line 2</text><text x="32" y="252" font-size="12" fill="#555">parse_lr: float(text)</text>
<rect x="20" y="286" width="230" height="44" rx="6" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
<text x="32" y="306" font-weight="bold" fill="#e53935">float('0.0o1')</text><text x="32" y="322" font-size="12" fill="#555">raises ValueError</text>
</g>
<g stroke="#3949ab" stroke-width="1.5" fill="none"><path d="M90 120 V144"/><path d="M90 190 V214"/><path d="M90 260 V284"/></g>
<g fill="#3949ab"><path d="M85 138 L90 146 L95 138 Z"/><path d="M85 208 L90 216 L95 208 Z"/><path d="M85 278 L90 286 L95 278 Z"/></g>
<text x="98" y="137" font-size="11" fill="#555">calls</text>
<!-- exception bubbling up -->
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.07;0.30;0.32;1" dur="14s" repeatCount="indefinite"/>
<circle cx="225" cy="308" r="9" fill="#e53935">
<animate attributeName="cy" values="308;308;98;98" keyTimes="0;0.07;0.30;1" dur="14s" repeatCount="indefinite"/>
</circle>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.07;0.09;0.30;0.32;1" dur="14s" repeatCount="indefinite"/>
<text x="20" y="360" font-size="12" font-weight="bold" fill="#e53935">No except anywhere: the exception</text>
<text x="20" y="376" font-size="12" font-weight="bold" fill="#e53935">climbs out of every frame, and Python</text>
<text x="20" y="392" font-size="12" font-weight="bold" fill="#e53935">prints the stack it passed through.</text>
</g>
<!-- traceback panel -->
<text x="270" y="62" font-weight="bold" fill="#00897b">What Python prints (read it bottom-up)</text>
<rect x="270" y="76" width="470" height="200" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
<g font-family="Courier New, monospace" font-size="12">
<text x="280" y="98">Traceback (most recent call last):</text>
<text x="294" y="120">File "train.py", line 4, in &lt;module&gt;</text>
<text x="309" y="138">config = load_config(lines)</text>
<text x="294" y="160">File "config.py", line 10, in load_config</text>
<text x="309" y="178">config["lr"] = parse_lr(value)</text>
<text x="294" y="200">File "config.py", line 2, in parse_lr</text>
<text x="309" y="218">return float(text)</text>
<text x="280" y="246" font-weight="bold" fill="#e53935">ValueError: could not convert string</text>
<text x="366" y="262" font-weight="bold" fill="#e53935">to float: '0.0o1'</text>
</g>
<!-- reading steps -->
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.36;0.97;1" dur="14s" repeatCount="indefinite"/>
<rect x="274" y="231" width="462" height="38" rx="5" fill="none" stroke="#e53935" stroke-width="2.5"/>
<circle cx="296" cy="306" r="11" fill="#e53935"/><text x="296" y="311" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">1</text>
<text x="314" y="311" font-size="13"><tspan font-weight="bold">Last line:</tspan> which exception, and the message.</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.54;0.97;1" dur="14s" repeatCount="indefinite"/>
<rect x="274" y="186" width="462" height="40" rx="5" fill="none" stroke="#ef6c00" stroke-width="2.5"/>
<circle cx="296" cy="340" r="11" fill="#ef6c00"/><text x="296" y="345" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">2</text>
<text x="314" y="345" font-size="13"><tspan font-weight="bold">Frame above it:</tspan> the exact line that failed.</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.70;0.72;0.97;1" dur="14s" repeatCount="indefinite"/>
<rect x="274" y="105" width="462" height="80" rx="5" fill="none" stroke="#00897b" stroke-width="2.5"/>
<circle cx="296" cy="374" r="11" fill="#00897b"/><text x="296" y="379" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">3</text>
<text x="314" y="379" font-size="13"><tspan font-weight="bold">Frames higher up:</tspan> how the program got there.</text>
<text x="314" y="397" font-size="12" fill="#555">The bad value '0.0o1' came in from train.py's data.</text>
</g>
<text x="20" y="428" font-size="12" fill="#555">"Most recent call last": the outermost call is at the top, the line that raised is at the bottom.</text>
</svg>
