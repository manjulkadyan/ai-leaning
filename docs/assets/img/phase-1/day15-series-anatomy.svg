<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 334" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e53935"/></marker></defs>
<text x="20" y="28" font-weight="bold" font-size="15">A Series = a NumPy array of values + an index of labels (+ a name)</text>
<text x="20" y="50" font-size="12" fill="#555" font-family="Menlo, Consolas, monospace">s = pd.Series([4.5, 3.9, 4.8], index=["chat", "maps", "notes"], name="rating")</text>
<rect x="30" y="66" width="270" height="218" rx="8" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="165" y="274" text-anchor="middle" font-size="13" fill="#555">pd.Series,  name = "rating"</text>
<text x="58" y="129" text-anchor="middle" font-size="11" fill="#9e9e9e">0</text>
<rect x="76" y="104" width="96" height="40" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/><text x="124" y="129" text-anchor="middle" fill="#555" font-weight="bold">"chat"</text>
<rect x="182" y="104" width="96" height="40" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/><text x="230" y="129" text-anchor="middle" fill="#222">4.5</text>
<text x="58" y="169" text-anchor="middle" font-size="11" fill="#9e9e9e">1</text>
<rect x="76" y="144" width="96" height="40" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/><text x="124" y="169" text-anchor="middle" fill="#555" font-weight="bold">"maps"</text>
<rect x="182" y="144" width="96" height="40" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/><text x="230" y="169" text-anchor="middle" fill="#222">3.9</text>
<text x="58" y="209" text-anchor="middle" font-size="11" fill="#9e9e9e">2</text>
<rect x="76" y="184" width="96" height="40" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/><text x="124" y="209" text-anchor="middle" fill="#555" font-weight="bold">"notes"</text>
<rect x="182" y="184" width="96" height="40" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/><text x="230" y="209" text-anchor="middle" fill="#222">4.8</text>
<text x="58" y="248" text-anchor="middle" font-size="10" fill="#9e9e9e">pos</text>
<text x="124" y="248" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">index</text>
<text x="230" y="248" text-anchor="middle" font-size="12" fill="#3949ab" font-weight="bold">values</text>
<path d="M124,104 C124,80 300,96 336,104" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="342" y="102" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">s.index</text>
<text x="342" y="120" font-size="12" fill="#555">Index(['chat', 'maps', 'notes'], dtype='str')</text>
<text x="342" y="136" font-size="12" fill="#555">a lookup table: label → position</text>
<path d="M280,184 L336,184" fill="none" stroke="#3949ab" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="342" y="174" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">s.to_numpy()</text>
<text x="342" y="192" font-size="12" fill="#555">array([4.5, 3.9, 4.8])   a plain NumPy ndarray,</text>
<text x="342" y="208" font-size="12" fill="#555">dtype float64, shape (3,): one block of memory</text>
<rect x="342" y="218" width="62" height="28" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.2"/><text x="373" y="237" text-anchor="middle" font-size="13" fill="#222">4.5</text>
<rect x="404" y="218" width="62" height="28" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.2"/><text x="435" y="237" text-anchor="middle" font-size="13" fill="#222">3.9</text>
<rect x="466" y="218" width="62" height="28" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.2"/><text x="497" y="237" text-anchor="middle" font-size="13" fill="#222">4.8</text>
<text x="534" y="237" font-size="11" fill="#555">8 bytes each</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.15;0.92;0.95;1" dur="8s" repeatCount="indefinite"/><rect x="76" y="144" width="96" height="40" fill="#fff59d" stroke="#e53935" stroke-width="2.5"/><text x="124" y="169" text-anchor="middle" fill="#222" font-weight="bold">"maps"</text></g>
