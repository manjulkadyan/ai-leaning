<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.33;0.92;0.95;1" dur="8s" repeatCount="indefinite"/><rect x="404" y="218" width="62" height="28" fill="#fff59d" stroke="#e53935" stroke-width="2.5"/><text x="435" y="237" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">3.9</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.48;0.92;0.95;1" dur="8s" repeatCount="indefinite"/><rect x="182" y="144" width="96" height="40" fill="#fff59d" stroke="#e53935" stroke-width="2.5"/><text x="230" y="169" text-anchor="middle" fill="#222" font-weight="bold">3.9</text><path d="M172,164 L180,164" stroke="#e53935" stroke-width="2" marker-end="url(#ahr)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.07;0.92;0.95;1" dur="8s" repeatCount="indefinite"/><text x="20" y="304" font-size="12" fill="#555">Lookup <tspan font-family="Menlo, Consolas, monospace" fill="#e53935">s["maps"]</tspan>:  1. find the label "maps" in the index</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.33;0.92;0.95;1" dur="8s" repeatCount="indefinite"/><text x="342" y="304" font-size="12" fill="#555">2. it sits at position 1</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.48;0.92;0.95;1" dur="8s" repeatCount="indefinite"/><text x="490" y="304" font-size="12" fill="#555">3. read values[1] → <tspan font-weight="bold" fill="#e53935">3.9</tspan></text></g>
<text x="20" y="324" font-size="11" fill="#555">Arithmetic like s * 2 runs on the NumPy array; the index just rides along to label the result.</text>
</svg>