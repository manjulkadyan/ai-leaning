<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
  <text x="20" y="28" font-weight="bold" font-size="15">The count matrix X: one row per sentence, one column per vocabulary word</text>

  <!-- row highlights -->
  <rect x="86" y="80" width="268" height="26" rx="4" fill="#e8eaf6" stroke="#3949ab" stroke-width="2" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;1;1" keyTimes="0;0.25;0.5;0.75" dur="12s" repeatCount="indefinite"/></rect>
  <rect x="86" y="184" width="268" height="26" rx="4" fill="#e0f2f1" stroke="#00897b" stroke-width="2" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;1" keyTimes="0;0.25;0.5;0.75" dur="12s" repeatCount="indefinite"/></rect>
  <!-- matching-cell highlights: columns 'the' and 'phone' in rows 0 and 4 -->
  <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1" keyTimes="0;0.25;0.5;0.75" dur="12s" repeatCount="indefinite"/>
    <rect x="92" y="82" width="40" height="22" rx="3" fill="#fff59d" stroke="#ef6c00" stroke-width="2"/>
    <rect x="136" y="82" width="40" height="22" rx="3" fill="#fff59d" stroke="#ef6c00" stroke-width="2"/>
    <rect x="92" y="186" width="40" height="22" rx="3" fill="#fff59d" stroke="#ef6c00" stroke-width="2"/>
    <rect x="136" y="186" width="40" height="22" rx="3" fill="#fff59d" stroke="#ef6c00" stroke-width="2"/>
  </g>

  <!-- column headers -->
  <g font-size="12" font-weight="bold" fill="#555" text-anchor="middle">
    <text x="112" y="70">the</text>
    <text x="156" y="70">phone</text>
    <text x="200" y="70">battery</text>
    <text x="244" y="70">model</text>
    <text x="288" y="70">on</text>
    <text x="330" y="70">…</text>
  </g>
  <!-- row labels -->
  <g font-size="12" fill="#555" text-anchor="end">
    <text x="78" y="98">#0</text><text x="78" y="124">#1</text><text x="78" y="150">#2</text><text x="78" y="176">#3</text>
    <text x="78" y="202">#4</text><text x="78" y="228">#5</text><text x="78" y="254">#6</text><text x="78" y="280">#7</text>
  </g>
  <!-- matrix bracket -->
  <path d="M88,78 h-4 v208 h4" fill="none" stroke="#3949ab" stroke-width="2"/>
  <path d="M352,78 h4 v208 h-4" fill="none" stroke="#3949ab" stroke-width="2"/>
  <!-- values: X[:, [the, phone, battery, model, on]] from the lesson's real output -->
  <g font-size="14" text-anchor="middle" font-family="Menlo, Consolas, monospace">
    <text x="112" y="98">2</text><text x="156" y="98">1</text><text x="200" y="98">1</text><text x="244" y="98">0</text><text x="288" y="98">0</text><text x="330" y="98" fill="#555">…</text>
    <text x="112" y="124">0</text><text x="156" y="124">0</text><text x="200" y="124">1</text><text x="244" y="124">0</text><text x="288" y="124">0</text><text x="330" y="124" fill="#555">…</text>
    <text x="112" y="150">1</text><text x="156" y="150">0</text><text x="200" y="150">0</text><text x="244" y="150">1</text><text x="288" y="150">1</text><text x="330" y="150" fill="#555">…</text>
    <text x="112" y="176">0</text><text x="156" y="176">0</text><text x="200" y="176">0</text><text x="244" y="176">1</text><text x="288" y="176">0</text><text x="330" y="176" fill="#555">…</text>
    <text x="112" y="202">3</text><text x="156" y="202">1</text><text x="200" y="202">0</text><text x="244" y="202">1</text><text x="288" y="202">1</text><text x="330" y="202" fill="#555">…</text>
    <text x="112" y="228">1</text><text x="156" y="228">0</text><text x="200" y="228">0</text><text x="244" y="228">1</text><text x="288" y="228">1</text><text x="330" y="228" fill="#555">…</text>
    <text x="112" y="254">0</text><text x="156" y="254">0</text><text x="200" y="254">0</text><text x="244" y="254">0</text><text x="288" y="254">0</text><text x="330" y="254" fill="#555">…</text>
    <text x="112" y="280">1</text><text x="156" y="280">0</text><text x="200" y="280">0</text><text x="244" y="280">0</text><text x="288" y="280">0</text><text x="330" y="280" fill="#555">…</text>
  </g>
  <text x="220" y="308" text-anchor="middle" font-size="12" fill="#555">5 of the 45 columns shown · X.shape = (8, 45)</text>

  <!-- right-hand explanation, step by step -->
  <g font-size="14">
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0" keyTimes="0;0.25;0.5;0.75" dur="12s" repeatCount="indefinite"/>
      <text x="390" y="110">Each <tspan font-weight="bold">row</tspan> is one sentence as a vector.</text>
      <text x="390" y="136">Each <tspan font-weight="bold">column</tspan> is one word of the vocabulary.</text>
      <text x="390" y="162">X[i, j] = how often word j appears</text>
      <text x="390" y="182">in sentence i.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.25;0.5;0.75" dur="12s" repeatCount="indefinite"/>
      <text x="390" y="110" fill="#3949ab" font-weight="bold">Row #0</text>
      <text x="390" y="134" font-size="13">"The phone battery drains fast when</text>
      <text x="390" y="152" font-size="13">the screen is bright."</text>
      <text x="390" y="180" font-size="13">"the" twice, 8 other words once:</text>
      <text x="390" y="200" font-size="13">‖row 0‖² = 2² + 8 × 1² = 12</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0" keyTimes="0;0.25;0.5;0.75" dur="12s" repeatCount="indefinite"/>
      <text x="390" y="110" fill="#00897b" font-weight="bold">Row #4</text>
      <text x="390" y="134" font-size="13">"The model runs on the phone,</text>
      <text x="390" y="152" font-size="13">without the cloud."</text>
      <text x="390" y="180" font-size="13">"the" three times, 6 other words once:</text>
      <text x="390" y="200" font-size="13">‖row 4‖² = 3² + 6 × 1² = 15</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1" keyTimes="0;0.25;0.5;0.75" dur="12s" repeatCount="indefinite"/>
      <text x="390" y="110" font-weight="bold">Only shared words add to the dot product</text>
      <text x="390" y="140" font-size="13">row 0 · row 4 = <tspan fill="#ef6c00" font-weight="bold">2×3</tspan> ("the") + <tspan fill="#ef6c00" font-weight="bold">1×1</tspan> ("phone") = 7</text>
      <text x="390" y="166" font-size="13">cos = 7 / (√12 × √15) = 7 / √180 ≈ <tspan font-weight="bold">0.522</tspan></text>
      <text x="390" y="200" font-size="13" fill="#e53935">6 of the 7 come from "the":</text>
      <text x="390" y="220" font-size="13" fill="#e53935">the word that means nothing.</text>
    </g>
  </g>
</svg>
