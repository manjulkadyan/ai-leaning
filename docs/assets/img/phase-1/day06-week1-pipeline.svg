  <text x="380" y="352" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" opacity="1">1 · read: sorted(folder.glob("*.jsonl")), one line at a time, from a generator<animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0;0" keyTimes="0;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/></text>
  <text x="380" y="352" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" opacity="0">2 · parse: json.loads each line; bad lines are caught, counted and skipped<animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0;0" keyTimes="0;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/></text>
  <text x="380" y="352" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" opacity="0">3 · tokenize: "My phone's battery…" → ['my', 'phones', 'battery', …]<animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0;0" keyTimes="0;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/></text>
  <text x="380" y="352" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" opacity="0">4 · vocabulary: 45 words → columns, saved to vocab.json and loaded back<animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0;0" keyTimes="0;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/></text>
  <text x="380" y="352" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" opacity="0">5 · count matrix: X.shape = (8, 45); unit rows saved to vectors.npy<animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0;0" keyTimes="0;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/></text>
  <text x="380" y="352" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" opacity="0">6 · rank: unit rows (np.where guards zeros), cosine, argsort → top pairs<animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1;0" keyTimes="0;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/></text>
  <text x="380" y="352" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" opacity="0">Every lesson of the week has a job in the project<animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;0;1" keyTimes="0;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/></text>
