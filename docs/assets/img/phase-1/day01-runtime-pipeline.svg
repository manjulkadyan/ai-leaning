<text x="650.0" y="284" text-anchor="middle" font-size="12" fill="#555">compiled C, C++, CUDA</text>

<line x1="124" y1="269" x2="156" y2="269" stroke="#555" stroke-width="2" marker-end="url(#d1a)"/>
<line x1="308" y1="269" x2="340" y2="269" stroke="#555" stroke-width="2" marker-end="url(#d1a)"/>
<line x1="522" y1="269" x2="558" y2="269" stroke="#555" stroke-width="2" marker-end="url(#d1a)"/>

<path d="M402,242 C402,218 462,218 462,242" fill="none" stroke="#00897b" stroke-width="2" marker-end="url(#d1a)"/>
<text x="470" y="232" font-size="11" fill="#555">repeat</text>
<text x="432" y="312" text-anchor="middle" font-size="12" fill="#e53935">type errors appear only when that line runs</text>
<text x="650" y="312" text-anchor="middle" font-size="12" fill="#ef6c00">the heavy maths runs here</text>
<text x="380" y="378" text-anchor="middle" font-size="13" fill="#555">Kotlin does its checking and compiling before the app ever runs.</text>
<text x="380" y="400" text-anchor="middle" font-size="13" fill="#555">Python compiles and runs in one go, and hands big array maths to native code.</text>
