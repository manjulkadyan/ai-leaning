<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53935"/></marker></defs>
<text x="20" y="26" font-weight="bold" font-size="15">Softmax + cross-entropy on one example (true class: cat)</text>
<text x="130" y="70" text-anchor="middle" font-weight="bold" fill="#3949ab">logits z</text><text x="16" y="115" font-size="13" fill="#555">cat</text><rect x="92" y="94" width="76" height="32" rx="6" fill="#e8eaf6" stroke="#3949ab"/><text x="130" y="115" text-anchor="middle">2.0</text><text x="16" y="175" font-size="13" fill="#555">dog</text><rect x="92" y="154" width="76" height="32" rx="6" fill="#e8eaf6" stroke="#3949ab"/><text x="130" y="175" text-anchor="middle">1.0</text><text x="16" y="235" font-size="13" fill="#555">bird</text><rect x="92" y="214" width="76" height="32" rx="6" fill="#e8eaf6" stroke="#3949ab"/><text x="130" y="235" text-anchor="middle">0.1</text>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.140;0.96" values="0;1;0"/><text x="260" y="70" text-anchor="middle" font-weight="bold" fill="#00897b">exp(z), all positive</text><line x1="172" y1="110" x2="216" y2="110" stroke="#555" marker-end="url(#ah)"/><rect x="222" y="94" width="76" height="32" rx="6" fill="#e0f2f1" stroke="#00897b"/><text x="260" y="115" text-anchor="middle">7.389</text><line x1="172" y1="170" x2="216" y2="170" stroke="#555" marker-end="url(#ah)"/><rect x="222" y="154" width="76" height="32" rx="6" fill="#e0f2f1" stroke="#00897b"/><text x="260" y="175" text-anchor="middle">2.718</text><line x1="172" y1="230" x2="216" y2="230" stroke="#555" marker-end="url(#ah)"/><rect x="222" y="214" width="76" height="32" rx="6" fill="#e0f2f1" stroke="#00897b"/><text x="260" y="235" text-anchor="middle">1.105</text><text x="260" y="280" text-anchor="middle" font-size="13">sum = 11.213</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.320;0.96" values="0;1;0"/><text x="395" y="70" text-anchor="middle" font-weight="bold" fill="#ef6c00">q = exp(z) / sum</text><line x1="302" y1="110" x2="333" y2="110" stroke="#555" marker-end="url(#ah)"/><rect x="337" y="94" width="72.5" height="32" fill="#fff3e0" stroke="#ef6c00"/><text x="415.5" y="115" font-size="13">0.659</text><line x1="302" y1="170" x2="333" y2="170" stroke="#555" marker-end="url(#ah)"/><rect x="337" y="154" width="26.7" height="32" fill="#fff3e0" stroke="#ef6c00"/><text x="369.7" y="175" font-size="13">0.242</text><line x1="302" y1="230" x2="333" y2="230" stroke="#555" marker-end="url(#ah)"/><rect x="337" y="214" width="10.8" height="32" fill="#fff3e0" stroke="#ef6c00"/><text x="353.8" y="235" font-size="13">0.099</text><text x="395" y="280" text-anchor="middle" font-size="13">adds up to 1</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.500;0.96" values="0;1;0"/><text x="590" y="70" text-anchor="middle" font-weight="bold" fill="#e53935">loss = −ln q_cat</text><line x1="475" y1="110" x2="538" y2="110" stroke="#e53935" marker-end="url(#ahr)"/><rect x="542" y="88" width="180" height="44" rx="8" fill="#fff59d"/><text x="632" y="115" text-anchor="middle">−ln 0.659 = <tspan font-weight="bold">0.417</tspan></text><text x="632" y="166" text-anchor="middle" font-size="12" fill="#555">only the true class's</text><text x="632" y="182" text-anchor="middle" font-size="12" fill="#555">probability counts</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.660;0.96" values="0;1;0"/><rect x="20" y="296" width="700" height="76" rx="8" fill="#ffebee"/><text x="36" y="320" font-weight="bold" fill="#e53935">gradient of the loss w.r.t. the logits: q − y</text><text x="60" y="350" font-size="13">cat: 0.659 − 1 = <tspan font-weight="bold" fill="#e53935">-0.341</tspan></text><text x="285" y="350" font-size="13">dog: 0.242 − 0 = <tspan font-weight="bold" fill="#e53935">+0.242</tspan></text><text x="510" y="350" font-size="13">bird: 0.099 − 0 = <tspan font-weight="bold" fill="#e53935">+0.099</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.800;0.96" values="0;1;0"/><line x1="74" y1="110" x2="74" y2="75.9" stroke="#e53935" stroke-width="3" marker-end="url(#ahr)"/><line x1="74" y1="170" x2="74" y2="194.2" stroke="#e53935" stroke-width="3" marker-end="url(#ahr)"/><line x1="74" y1="230" x2="74" y2="239.9" stroke="#e53935" stroke-width="3" marker-end="url(#ahr)"/><text x="130" y="268" text-anchor="middle" font-size="12" fill="#e53935">a GD step: cat up, others down</text></g>
</svg>