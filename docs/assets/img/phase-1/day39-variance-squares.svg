<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
  <text x="20" y="26" font-weight="bold" font-size="15">Variance: square each distance from the mean, then average</text>
  <text x="430" y="70" font-size="12" fill="#555">fair die: each face has p = 1/6</text>
  <text x="430" y="88" font-size="12" fill="#555">arrows: deviation x − μ</text>
  <text x="430" y="106" font-size="12" fill="#555">squares: (x − μ)², drawn to scale</text>
  <line x1="40" y1="110" x2="400" y2="110" stroke="#90a4ae" stroke-width="1.5"/>
  <line x1="70" y1="104" x2="70" y2="116" stroke="#90a4ae"/><circle cx="70" cy="110" r="5" fill="#333"/><text x="70" y="134" text-anchor="middle" font-size="13">1</text><line x1="130" y1="104" x2="130" y2="116" stroke="#90a4ae"/><circle cx="130" cy="110" r="5" fill="#333"/><text x="130" y="134" text-anchor="middle" font-size="13">2</text><line x1="190" y1="104" x2="190" y2="116" stroke="#90a4ae"/><circle cx="190" cy="110" r="5" fill="#333"/><text x="190" y="134" text-anchor="middle" font-size="13">3</text><line x1="250" y1="104" x2="250" y2="116" stroke="#90a4ae"/><circle cx="250" cy="110" r="5" fill="#333"/><text x="250" y="134" text-anchor="middle" font-size="13">4</text><line x1="310" y1="104" x2="310" y2="116" stroke="#90a4ae"/><circle cx="310" cy="110" r="5" fill="#333"/><text x="310" y="134" text-anchor="middle" font-size="13">5</text><line x1="370" y1="104" x2="370" y2="116" stroke="#90a4ae"/><circle cx="370" cy="110" r="5" fill="#333"/><text x="370" y="134" text-anchor="middle" font-size="13">6</text>
  <line x1="220.0" y1="48" x2="220.0" y2="118" stroke="#e53935" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="220.0" y="44" text-anchor="middle" font-size="13" font-weight="bold" fill="#e53935">μ = 3.5</text>
  <line x1="15" y1="320" x2="480" y2="320" stroke="#bdbdbd"/>
  <g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.0429;0.96" values="0;1;0"/><line x1="220.0" y1="64" x2="76" y2="64" stroke="#3949ab" stroke-width="2.5"/><polygon points="70,64 78,59 78,69" fill="#3949ab"/><line x1="70" y1="64" x2="70" y2="104" stroke="#3949ab" stroke-dasharray="2 3"/><rect x="20" y="230.0" width="90.0" height="90.0" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/><text x="65.0" y="223.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#3949ab">6.25</text><text x="65.0" y="338" text-anchor="middle" font-size="12">x = 1</text><text x="65.0" y="354" text-anchor="middle" font-size="12" fill="#3949ab">−2.5</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.1286;0.96" values="0;1;0"/><line x1="220.0" y1="76" x2="136" y2="76" stroke="#3949ab" stroke-width="2.5"/><polygon points="130,76 138,71 138,81" fill="#3949ab"/><line x1="130" y1="76" x2="130" y2="104" stroke="#3949ab" stroke-dasharray="2 3"/><rect x="136.0" y="266.0" width="54.0" height="54.0" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/><text x="163.0" y="259.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#3949ab">2.25</text><text x="163.0" y="338" text-anchor="middle" font-size="12">x = 2</text><text x="163.0" y="354" text-anchor="middle" font-size="12" fill="#3949ab">−1.5</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.2143;0.96" values="0;1;0"/><line x1="220.0" y1="88" x2="196" y2="88" stroke="#3949ab" stroke-width="2.5"/><polygon points="190,88 198,83 198,93" fill="#3949ab"/><line x1="190" y1="88" x2="190" y2="104" stroke="#3949ab" stroke-dasharray="2 3"/><rect x="216.0" y="302.0" width="18.0" height="18.0" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/><text x="225.0" y="295.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#3949ab">0.25</text><text x="225.0" y="338" text-anchor="middle" font-size="12">x = 3</text><text x="225.0" y="354" text-anchor="middle" font-size="12" fill="#3949ab">−0.5</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.3000;0.96" values="0;1;0"/><line x1="220.0" y1="88" x2="244" y2="88" stroke="#00897b" stroke-width="2.5"/><polygon points="250,88 242,83 242,93" fill="#00897b"/><line x1="250" y1="88" x2="250" y2="104" stroke="#00897b" stroke-dasharray="2 3"/><rect x="260.0" y="302.0" width="18.0" height="18.0" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/><text x="269.0" y="295.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#00897b">0.25</text><text x="269.0" y="338" text-anchor="middle" font-size="12">x = 4</text><text x="269.0" y="354" text-anchor="middle" font-size="12" fill="#00897b">+0.5</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.3857;0.96" values="0;1;0"/><line x1="220.0" y1="76" x2="304" y2="76" stroke="#00897b" stroke-width="2.5"/><polygon points="310,76 302,71 302,81" fill="#00897b"/><line x1="310" y1="76" x2="310" y2="104" stroke="#00897b" stroke-dasharray="2 3"/><rect x="304.0" y="266.0" width="54.0" height="54.0" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/><text x="331.0" y="259.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#00897b">2.25</text><text x="331.0" y="338" text-anchor="middle" font-size="12">x = 5</text><text x="331.0" y="354" text-anchor="middle" font-size="12" fill="#00897b">+1.5</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.4714;0.96" values="0;1;0"/><line x1="220.0" y1="64" x2="364" y2="64" stroke="#00897b" stroke-width="2.5"/><polygon points="370,64 362,59 362,69" fill="#00897b"/><line x1="370" y1="64" x2="370" y2="104" stroke="#00897b" stroke-dasharray="2 3"/><rect x="384.0" y="230.0" width="90.0" height="90.0" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/><text x="429.0" y="223.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#00897b">6.25</text><text x="429.0" y="338" text-anchor="middle" font-size="12">x = 6</text><text x="429.0" y="354" text-anchor="middle" font-size="12" fill="#00897b">+2.5</text></g>
  <g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.5857;0.96" values="0;1;0"/><rect x="495" y="140" width="255" height="224" rx="8" fill="#fff3e0"/><text x="622.5" y="164" text-anchor="middle" font-weight="bold" font-size="15" fill="#ef6c00">variance = average area</text><text x="622.5" y="186" text-anchor="middle" font-size="12">6.25 + 2.25 + 0.25 + 0.25 + 2.25 + 6.25</text><text x="622.5" y="204" text-anchor="middle" font-size="12">= 17.5, and 17.5 / 6 = <tspan font-weight="bold">2.92</tspan></text><rect x="591.8" y="238.5" width="61.5" height="61.5" fill="#fff59d" stroke="#ef6c00" stroke-width="2.5"/><text x="622.5" y="274.3" text-anchor="middle" font-size="13" font-weight="bold">2.92</text><text x="622.5" y="322" text-anchor="middle" font-size="13">side = √2.92 = <tspan font-weight="bold" fill="#e53935">1.71</tspan></text><text x="622.5" y="342" text-anchor="middle" font-size="13" fill="#e53935">= standard deviation σ</text></g>
</svg>
