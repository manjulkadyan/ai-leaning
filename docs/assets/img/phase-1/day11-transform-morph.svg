<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
  <defs>
    <marker id="d11i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53935"/></marker>
    <marker id="d11j" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e88e5"/></marker>
  </defs>
  <text x="20" y="28" font-weight="bold" font-size="15">A 2×2 matrix moves î and ĵ, and the whole plane follows</text>
  <!-- grid: origin (230,250), 1 unit = 80px -->
  <g stroke="#eceff1">
    <line x1="70" y1="50" x2="70" y2="320"/><line x1="150" y1="50" x2="150" y2="320"/><line x1="310" y1="50" x2="310" y2="320"/><line x1="390" y1="50" x2="390" y2="320"/>
    <line x1="60" y1="90" x2="430" y2="90"/><line x1="60" y1="170" x2="430" y2="170"/>
  </g>
  <g stroke="#90a4ae" stroke-width="1.5"><line x1="60" y1="250" x2="430" y2="250"/><line x1="230" y1="320" x2="230" y2="50"/></g>
  <g font-size="11" fill="#90a4ae"><text x="386" y="265">2</text><text x="142" y="265">−1</text><text x="218" y="94">2</text></g>
  <!-- ghost of the original unit square -->
  <polygon points="230,250 310,250 310,170 230,170" fill="none" stroke="#9e9e9e" stroke-dasharray="5 4"/>
  <!-- the transformed unit square -->
  <polygon points="230,250 310,250 310,170 230,170" fill="#fff59d" fill-opacity="0.8" stroke="#ef6c00" stroke-width="2">
    <animate attributeName="points" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.08;0.25;0.42;0.5;0.58;0.665;0.75;0.92;0.96;1"
      values="230,250 310,250 310,170 230,170;230,250 310,250 310,170 230,170;230,250 310,250 390,170 310,170;230,250 310,250 390,170 310,170;230,250 310,250 310,170 230,170;230,250 310,250 310,170 230,170;230,250 286.6,193.4 230,136.9 173.4,193.4;230,250 230,170 150,170 150,250;230,250 230,170 150,170 150,250;230,250 286.6,193.4 230,136.9 173.4,193.4;230,250 310,250 310,170 230,170"/>
  </polygon>
  <!-- i-hat (red) -->
  <line x1="230" y1="250" x2="310" y2="250" stroke="#e53935" stroke-width="3.5" marker-end="url(#d11i)">
    <animate attributeName="x2" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.25;0.42;0.5;0.58;0.665;0.75;0.92;0.96;1" values="310;310;310;310;310;310;286.6;230;230;286.6;310"/>
    <animate attributeName="y2" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.25;0.42;0.5;0.58;0.665;0.75;0.92;0.96;1" values="250;250;250;250;250;250;193.4;170;170;193.4;250"/>
  </line>
  <!-- j-hat (blue) -->
  <line x1="230" y1="250" x2="230" y2="170" stroke="#1e88e5" stroke-width="3.5" marker-end="url(#d11j)">
    <animate attributeName="x2" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.25;0.42;0.5;0.58;0.665;0.75;0.92;0.96;1" values="230;230;310;310;230;230;173.4;150;150;173.4;230"/>
    <animate attributeName="y2" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.25;0.42;0.5;0.58;0.665;0.75;0.92;0.96;1" values="170;170;170;170;170;170;193.4;250;250;193.4;170"/>
  </line>
  <text x="318" y="270" fill="#e53935" font-weight="bold" font-size="16">î
    <animate attributeName="x" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.25;0.42;0.5;0.58;0.665;0.75;0.92;0.96;1" values="318;318;318;318;318;318;296;238;238;296;318"/>
    <animate attributeName="y" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.25;0.42;0.5;0.58;0.665;0.75;0.92;0.96;1" values="270;270;270;270;270;270;190;160;160;190;270"/>
  </text>
  <text x="212" y="166" fill="#1e88e5" font-weight="bold" font-size="16">ĵ
    <animate attributeName="x" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.25;0.42;0.5;0.58;0.665;0.75;0.92;0.96;1" values="212;212;318;318;212;212;156;136;136;156;212"/>
    <animate attributeName="y" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.25;0.42;0.5;0.58;0.665;0.75;0.92;0.96;1" values="166;166;166;166;166;166;188;242;242;188;166"/>
  </text>

  <!-- matrix panel -->
  <rect x="460" y="60" width="225" height="250" rx="8" fill="#e8eaf6"/>
  <g>
    <animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" values="1;0;1;0;1" keyTimes="0;0.08;0.42;0.58;0.92"/>
    <text x="572" y="92" text-anchor="middle" font-weight="bold">Identity I</text>
    <text x="530" y="150" text-anchor="middle" fill="#e53935" font-size="18">1</text><text x="580" y="150" text-anchor="middle" fill="#1e88e5" font-size="18">0</text>
    <text x="530" y="185" text-anchor="middle" fill="#e53935" font-size="18">0</text><text x="580" y="185" text-anchor="middle" fill="#1e88e5" font-size="18">1</text>
    <text x="572" y="262" text-anchor="middle" font-size="12" fill="#555">nothing moves</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.08;0.42"/>
    <text x="572" y="92" text-anchor="middle" font-weight="bold">Shear</text>
    <text x="530" y="150" text-anchor="middle" fill="#e53935" font-size="18">1</text><text x="580" y="150" text-anchor="middle" fill="#1e88e5" font-size="18">1</text>
    <text x="530" y="185" text-anchor="middle" fill="#e53935" font-size="18">0</text><text x="580" y="185" text-anchor="middle" fill="#1e88e5" font-size="18">1</text>
    <text x="572" y="262" text-anchor="middle" font-size="12" fill="#555">ĵ slides to [1, 1]; î stays</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.58;0.92"/>
    <text x="572" y="92" text-anchor="middle" font-weight="bold">Rotate 90°</text>
    <text x="530" y="150" text-anchor="middle" fill="#e53935" font-size="18">0</text><text x="580" y="150" text-anchor="middle" fill="#1e88e5" font-size="18">−1</text>
    <text x="530" y="185" text-anchor="middle" fill="#e53935" font-size="18">1</text><text x="580" y="185" text-anchor="middle" fill="#1e88e5" font-size="18">0</text>
    <text x="572" y="262" text-anchor="middle" font-size="12" fill="#555">î → [0, 1], ĵ → [−1, 0]</text>
  </g>
  <!-- brackets and fixed column labels -->
  <path d="M510,128 h-8 v66 h8" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M600,128 h8 v66 h-8" fill="none" stroke="#333" stroke-width="2"/>
  <text x="530" y="218" text-anchor="middle" font-size="12" fill="#e53935">where î</text>
  <text x="530" y="232" text-anchor="middle" font-size="12" fill="#e53935">lands</text>
  <text x="582" y="218" text-anchor="middle" font-size="12" fill="#1e88e5">where ĵ</text>
  <text x="582" y="232" text-anchor="middle" font-size="12" fill="#1e88e5">lands</text>
  <text x="572" y="290" text-anchor="middle" font-size="12" fill="#555">column 1 = î's new home</text>
  <text x="572" y="304" text-anchor="middle" font-size="12" fill="#555">column 2 = ĵ's new home</text>
</svg>
