<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif" font-size="13" class="animated">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3949ab"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e53935"/></marker></defs>
<text x="14" y="24" font-weight="bold" font-size="15">fit_preprocess on train, transform everything with the same numbers</text>
<rect x="20" y="160" width="120" height="50" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="80" y="181" text-anchor="middle" font-weight="bold" fill="#3949ab">train</text><text x="80" y="198" text-anchor="middle" font-size="11" fill="#555">288 apps</text>
<rect x="520" y="160" width="180" height="50" rx="8" fill="#fff" stroke="#3949ab" stroke-width="1.5"/>
<text x="610" y="181" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">transform(df, stats)</text><text x="610" y="198" text-anchor="middle" font-size="11" fill="#555">X_train</text>
<path d="M140 192 L516 192" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="330" y="206" text-anchor="middle" font-size="10" fill="#999">rows</text>
<rect x="20" y="240" width="120" height="50" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
<text x="80" y="261" text-anchor="middle" font-weight="bold" fill="#00897b">validation</text><text x="80" y="278" text-anchor="middle" font-size="11" fill="#555">96 apps</text>
<rect x="520" y="240" width="180" height="50" rx="8" fill="#fff" stroke="#00897b" stroke-width="1.5"/>
<text x="610" y="261" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">transform(df, stats)</text><text x="610" y="278" text-anchor="middle" font-size="11" fill="#555">X_val</text>
<path d="M140 272 L516 272" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="330" y="286" text-anchor="middle" font-size="10" fill="#999">rows</text>
<rect x="20" y="320" width="120" height="50" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
<text x="80" y="341" text-anchor="middle" font-weight="bold" fill="#ef6c00">test</text><text x="80" y="358" text-anchor="middle" font-size="11" fill="#555">96 apps</text>
<rect x="520" y="320" width="180" height="50" rx="8" fill="#fff" stroke="#ef6c00" stroke-width="1.5"/>
<text x="610" y="341" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">transform(df, stats)</text><text x="610" y="358" text-anchor="middle" font-size="11" fill="#555">X_test</text>
<path d="M140 352 L516 352" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="330" y="366" text-anchor="middle" font-size="10" fill="#999">rows</text>
<rect x="250" y="44" width="160" height="90" rx="8" fill="#fff59d" stroke="#555" stroke-width="1.5"/>
<text x="330" y="64" text-anchor="middle" font-weight="bold">stats</text>
<text x="330" y="84" text-anchor="middle" font-size="11" fill="#555">size median 31.35</text>
<text x="330" y="101" text-anchor="middle" font-size="11" fill="#555">7 category columns</text>
<text x="330" y="118" text-anchor="middle" font-size="11" fill="#555">12 means, 12 stds</text>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="1;1;1;1" keyTimes="0.0000;0.2500;0.5000;0.7500" dur="12s" repeatCount="indefinite"/><path d="M80 158 C80 100 160 90 246 89" fill="none" stroke="#3949ab" stroke-width="2.5" marker-end="url(#ahb)"/><text x="112" y="104" font-size="12" font-weight="bold" fill="#3949ab">fit</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;1;1" keyTimes="0.0000;0.2500;0.5000;0.7500" dur="12s" repeatCount="indefinite"/><path d="M410 80 C470 80 500 120 518 168" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M410 100 C450 100 480 150 512 250" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><path d="M410 120 C440 120 470 200 510 330" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;1" keyTimes="0.0000;0.2500;0.5000;0.7500" dur="12s" repeatCount="indefinite"/><path d="M140 330 C200 300 230 200 290 138" fill="none" stroke="#e53935" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ahr)"/><path d="M206 252 l16 16 M222 252 l-16 16" stroke="#e53935" stroke-width="3"/><text x="232" y="232" font-size="11" fill="#e53935">never fit on validation</text><text x="232" y="246" font-size="11" fill="#e53935">or test rows: leakage</text></g>
<text x="360" y="392" text-anchor="middle" font-size="12" fill="#555" opacity="0">Step 1: fit_preprocess reads ONLY the 288 training apps and stores what it learned.<animate attributeName="opacity" calcMode="discrete" values="1;0;0;0" keyTimes="0.0000;0.2500;0.5000;0.7500" dur="12s" repeatCount="indefinite"/></text>
<text x="360" y="392" text-anchor="middle" font-size="12" fill="#555" opacity="0">Step 2: transform applies those same numbers to every set, in the same column order.<animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0.0000;0.2500;0.5000;0.7500" dur="12s" repeatCount="indefinite"/></text>
<text x="360" y="392" text-anchor="middle" font-size="12" fill="#555" opacity="0">Step 3: fitting on test rows would let them shape the features the model trains on.<animate attributeName="opacity" calcMode="discrete" values="0;0;1;0" keyTimes="0.0000;0.2500;0.5000;0.7500" dur="12s" repeatCount="indefinite"/></text>
<text x="360" y="392" text-anchor="middle" font-size="12" fill="#555" opacity="0">Train means come out exactly 0; validation and test means only close to 0, as they should.<animate attributeName="opacity" calcMode="discrete" values="0;0;0;1" keyTimes="0.0000;0.2500;0.5000;0.7500" dur="12s" repeatCount="indefinite"/></text>
</svg>
