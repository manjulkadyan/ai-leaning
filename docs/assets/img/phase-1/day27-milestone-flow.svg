<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0;0" keyTimes="0.0000;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/><text x="14" y="288" font-size="15" font-weight="bold">Prove they are right before timing them</text><text x="14" y="310" font-size="12.5" fill="#333">hand-worked examples, edge shapes, errors, then random matrices vs NumPy</text></g>
