<text x="69.0" y="65" text-anchor="middle" font-weight="bold" fill="#3949ab">1. Split</text>
<text x="69.0" y="83" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10">seed 55</text>
<text x="69.0" y="99" text-anchor="middle" font-size="11" fill="#555">60 / 20 / 20</text>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;1;1;1;1;1" keyTimes="0.0000;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/><circle cx="120" cy="50" r="9" fill="#00897b"/><path d="M115.5 50 l3.5 3.5 l6 -7" fill="none" stroke="#fff" stroke-width="2.3"/></g>
