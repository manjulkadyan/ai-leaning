<text x="317.0" y="65" text-anchor="middle" font-weight="bold" fill="#00897b">3. Derive</text>
<text x="317.0" y="83" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10">(2/n)·Xᵀ(Xw − y)</text>
<text x="317.0" y="99" text-anchor="middle" font-size="11" fill="#555">by hand, on paper</text>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;1;1;1" keyTimes="0.0000;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/><circle cx="368" cy="50" r="9" fill="#00897b"/><path d="M363.5 50 l3.5 3.5 l6 -7" fill="none" stroke="#fff" stroke-width="2.3"/></g>
