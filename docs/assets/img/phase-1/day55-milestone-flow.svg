<text x="689.0" y="65" text-anchor="middle" font-weight="bold" fill="#ef6c00">6. Test once</text>
<text x="689.0" y="83" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10">vs baseline</text>
<text x="689.0" y="99" text-anchor="middle" font-size="11" fill="#555">and vs lstsq</text>
