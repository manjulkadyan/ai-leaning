<text x="380" y="388" text-anchor="middle" font-size="12" fill="#555" opacity="0">Shuffle once with a fixed seed: 288 train, 96 validation, 96 test apps.<animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0;0" keyTimes="0.0000;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/></text>
<text x="380" y="388" text-anchor="middle" font-size="12" fill="#555" opacity="0">Medians, means and stds come from the 288 training apps; target = half the val baseline.<animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0;0" keyTimes="0.0000;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/></text>
<text x="380" y="388" text-anchor="middle" font-size="12" fill="#555" opacity="0">Write one residual, differentiate, pack the n entries back into Xᵀ.<animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0;0" keyTimes="0.0000;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/></text>
<text x="380" y="388" text-anchor="middle" font-size="12" fill="#555" opacity="0">Central differences agree with the formula to about 1e-11.<animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0;0" keyTimes="0.0000;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/></text>
<text x="380" y="388" text-anchor="middle" font-size="12" fill="#555" opacity="0">Batches of 32, reshuffled every epoch; the loss drops below the target.<animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0;0" keyTimes="0.0000;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/></text>
<text x="380" y="388" text-anchor="middle" font-size="12" fill="#555" opacity="0">One look at the test set: MSE 0.1085, against 0.9095 for predicting the mean. Pass.<animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1;0" keyTimes="0.0000;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/></text>
<text x="380" y="388" text-anchor="middle" font-size="12" fill="#555" opacity="0">Every box ticked. Now the report and the Month 2 retrospective.<animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;0;1" keyTimes="0.0000;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571" dur="14s" repeatCount="indefinite"/></text>
