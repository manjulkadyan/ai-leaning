<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<text x="20" y="26" font-weight="bold" font-size="15">MAE adds up the bars; MSE adds up the squares</text>
<text x="20" y="46" font-size="12" fill="#555">The teal line stays fixed: we are only scoring it. 1 unit = 16 px.</text>
<rect x="14" y="58" width="420" height="290" rx="6" fill="#e0f2f1" opacity="0.5"/>
<line x1="30" y1="300.0" x2="430" y2="180.0" stroke="#00897b" stroke-width="3"/>
<rect x="80" y="269.0" width="16.0" height="16.0" fill="#ef6c00" opacity="0.35" stroke="#ef6c00"/><line x1="80" y1="285.0" x2="80" y2="269.0" stroke="#e53935" stroke-width="2.5"/><circle cx="80" cy="269.0" r="5.5" fill="#3949ab"/>
<rect x="150" y="264.0" width="16.0" height="16.0" fill="#ef6c00" opacity="0.35" stroke="#ef6c00"/><line x1="150" y1="264.0" x2="150" y2="280.0" stroke="#e53935" stroke-width="2.5"/><circle cx="150" cy="280.0" r="5.5" fill="#3949ab"/>
<rect x="220" y="235.0" width="8.0" height="8.0" fill="#ef6c00" opacity="0.35" stroke="#ef6c00"/><line x1="220" y1="243.0" x2="220" y2="235.0" stroke="#e53935" stroke-width="2.5"/><circle cx="220" cy="235.0" r="5.5" fill="#3949ab"/>
<rect x="290" y="222.0" width="8.0" height="8.0" fill="#ef6c00" opacity="0.35" stroke="#ef6c00"/><line x1="290" y1="222.0" x2="290" y2="230.0" stroke="#e53935" stroke-width="2.5"/><circle cx="290" cy="230.0" r="5.5" fill="#3949ab"/>
<g><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3000" values="1;0"/><rect x="340" y="191.0" width="16" height="16" fill="#ef6c00" opacity="0.35" stroke="#ef6c00"/><line x1="340" y1="207.0" x2="340" y2="191.0" stroke="#e53935" stroke-width="2.5"/><circle cx="340" cy="191.0" r="6.5" fill="#3949ab" stroke="#fff" stroke-width="1.5"/><text x="332" y="181.0" font-size="12" text-anchor="end" fill="#e53935" font-weight="bold">r = 1, square = 1</text></g>
<g opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3000;0.6000" values="0;1;0"/><rect x="340" y="159.0" width="48" height="48" fill="#ef6c00" opacity="0.35" stroke="#ef6c00"/><line x1="340" y1="207.0" x2="340" y2="159.0" stroke="#e53935" stroke-width="2.5"/><circle cx="340" cy="159.0" r="6.5" fill="#3949ab" stroke="#fff" stroke-width="1.5"/><text x="332" y="149.0" font-size="12" text-anchor="end" fill="#e53935" font-weight="bold">r = 3, square = 9</text></g>
<g opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6000" values="0;1"/><rect x="340" y="127.0" width="80" height="80" fill="#ef6c00" opacity="0.35" stroke="#ef6c00"/><line x1="340" y1="207.0" x2="340" y2="127.0" stroke="#e53935" stroke-width="2.5"/><circle cx="340" cy="127.0" r="6.5" fill="#3949ab" stroke="#fff" stroke-width="1.5"/><text x="332" y="117.0" font-size="12" text-anchor="end" fill="#e53935" font-weight="bold">r = 5, square = 25</text></g>
<text x="30" y="338" font-size="12" fill="#555">Four points 0.5 or 1 unit off; the fifth drifts away.</text>
<rect x="450" y="58" width="256" height="290" rx="8" fill="#fff3e0"/>
<text x="578" y="82" text-anchor="middle" font-weight="bold">Scores of the same line</text>
<text x="465" y="108" font-size="12" fill="#555">bars: 1 + 1 + 0.5 + 0.5 + |r|</text>
<text x="465" y="126" font-size="12" fill="#555">squares: 1 + 1 + 0.25 + 0.25 + r²</text>
<text x="465" y="156" font-size="12" fill="#555">r</text><text x="510" y="156" font-size="12" fill="#555">MAE</text><text x="580" y="156" font-size="12" fill="#555">MSE</text><text x="628" y="156" font-size="11" fill="#555">far pt share</text>
<rect x="458" y="168" width="240" height="24" rx="4" fill="#fff59d" opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3000" values="0.6;0"/></rect>
<g><text x="465" y="184" font-size="13">1</text><text x="510" y="184" font-size="13" fill="#00897b" font-weight="bold">0.8</text><text x="580" y="184" font-size="13" fill="#ef6c00" font-weight="bold">0.7</text><text x="650" y="184" font-size="13">29%</text></g>
<rect x="458" y="196" width="240" height="24" rx="4" fill="#fff59d" opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3000;0.6000" values="0;0.6;0"/></rect>
<g opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3000" values="0;1"/><text x="465" y="212" font-size="13">3</text><text x="510" y="212" font-size="13" fill="#00897b" font-weight="bold">1.2</text><text x="580" y="212" font-size="13" fill="#ef6c00" font-weight="bold">2.3</text><text x="650" y="212" font-size="13">78%</text></g>
<rect x="458" y="224" width="240" height="24" rx="4" fill="#fff59d" opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6000;1.0000" values="0;0.6;0"/></rect>
<g opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6000" values="0;1"/><text x="465" y="240" font-size="13">5</text><text x="510" y="240" font-size="13" fill="#00897b" font-weight="bold">1.6</text><text x="580" y="240" font-size="13" fill="#ef6c00" font-weight="bold">5.5</text><text x="650" y="240" font-size="13">91%</text></g>
<g opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6500" values="0;1"/><text x="465" y="290" font-size="12" fill="#555">Bar 1 → 5: MAE doubles.</text><text x="465" y="308" font-size="12" fill="#555">Square 1 → 25: MSE grows 7.9×,</text><text x="465" y="326" font-size="12" fill="#555">91% of it from one point.</text></g>
<text x="20" y="372" font-size="12" fill="#555">Red bar: the residual |r|. Orange square: r². MAE averages the bars, MSE averages the squares.</text>
</svg>
