  </g>
  <g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3000;1" values="0;1;1"/>
    <text x="466" y="226" font-size="13">2</text><text x="500" y="226" font-size="13">(-2.56, 0.24)</text><text x="630" y="226" font-size="13" fill="#3949ab" font-weight="bold">6.73</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4733;1" values="0;1;1"/>
    <text x="466" y="250" font-size="13">3</text><text x="500" y="250" font-size="13">(-2.05, 0.10)</text><text x="630" y="250" font-size="13" fill="#3949ab" font-weight="bold">4.22</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6467;1" values="0;1;1"/>
    <text x="466" y="274" font-size="13">4</text><text x="500" y="274" font-size="13">(-1.64, 0.04)</text><text x="630" y="274" font-size="13" fill="#3949ab" font-weight="bold">2.69</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6667;1" values="0;1;1"/>
    <text x="460" y="312" font-size="12" fill="#555">Height falls every step, and the steps</text>
    <text x="460" y="328" font-size="12" fill="#555">shrink as the slope flattens out.</text>
  </g>
  <text x="20" y="372" font-size="12" fill="#555">Red: the direction of the gradient, uphill and perpendicular to the contour. Teal: each step, −0.1 × the gradient.</text>
</svg>
