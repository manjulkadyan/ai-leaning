    <text x="96.5" y="183.5" font-size="12" fill="#e53935" font-weight="bold">∇f</text>
  </g>
  <circle r="6" fill="#ef6c00" stroke="#fff" stroke-width="1.5" cx="62.0" cy="140.0">
    <animate attributeName="cx" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1267;0.3000;0.4733;0.6467;1.0000" values="62.0;94.0;119.6;140.1;156.5;156.5"/>
