    <text x="56.2" y="146.5" font-size="12" fill="#e53935" font-weight="bold">∇f</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3867;0.4733;1" values="0;1;0;0"/>
    <line x1="119.6" y1="190.4" x2="73.4" y2="177.4" stroke="#e53935" stroke-width="3" marker-end="url(#d32wr)"/>
    <text x="77.4" y="171.4" font-size="12" fill="#e53935" font-weight="bold">∇f</text>
  </g>
