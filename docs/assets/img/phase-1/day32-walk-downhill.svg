  </g>
  <g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6467;1" values="0;1;1"/>
    <line x1="140.1" y1="196.2" x2="156.5" y2="198.5" stroke="#00897b" stroke-width="2.5" marker-end="url(#d32wt)" opacity="0.6"/>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0400;0.1267;1" values="0;1;0;0"/>
