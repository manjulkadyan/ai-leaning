  <circle cx="222" cy="200" r="4" fill="#3949ab"/><text x="228" y="194" font-size="11" fill="#3949ab">minimum</text>
  <g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1267;1" values="0;1;1"/>
    <line x1="62.0" y1="140.0" x2="94.0" y2="176.0" stroke="#00897b" stroke-width="2.5" marker-end="url(#d32wt)" opacity="0.6"/>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3000;1" values="0;1;1"/>
    <line x1="94.0" y1="176.0" x2="119.6" y2="190.4" stroke="#00897b" stroke-width="2.5" marker-end="url(#d32wt)" opacity="0.6"/>
