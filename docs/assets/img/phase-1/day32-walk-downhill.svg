  </defs>
  <text x="20" y="26" font-weight="bold" font-size="15">Walking downhill: step against the gradient, cross a contour, repeat</text>
  <text x="20" y="46" font-size="12" fill="#555">f(x, y) = x² + 3y²; each contour is drawn at the height of one visited point</text>
  <rect x="14" y="58" width="416" height="290" rx="6" fill="#e8eaf6" opacity="0.45"/>
  <g stroke="#90a4ae" stroke-width="1.2"><line x1="20" y1="200" x2="424" y2="200"/><line x1="222" y1="62" x2="222" y2="344"/></g>
  <g font-size="11" fill="#90a4ae"><text x="414" y="214">x</text><text x="227" y="74">y</text><text x="219" y="214">0</text><text x="296" y="214">2</text><text x="136" y="214">−2</text><text x="376" y="214">4</text><text x="56" y="214">−4</text></g>
  <ellipse cx="222" cy="200" rx="190.8" ry="110.2" fill="none" stroke="#3949ab" stroke-width="1.3" opacity="0.8"/>
