  <text x="54.0" y="128.0" font-size="12" font-weight="bold" fill="#ef6c00">start</text>
  <rect x="445" y="58" width="262" height="290" rx="8" fill="#fff3e0"/>
  <text x="576" y="82" text-anchor="middle" font-weight="bold">The rule, every step</text>
  <text x="460" y="106" font-size="13">∇f = [2x, 6y]</text><text x="560" y="106" font-size="12" fill="#e53935">points uphill</text>
  <text x="460" y="126" font-size="13" fill="#00897b">new point = point − 0.1 · ∇f</text>
  <text x="460" y="154" font-size="12" fill="#555">step</text><text x="500" y="154" font-size="12" fill="#555">point (x, y)</text><text x="630" y="154" font-size="12" fill="#555">height f</text>
  <g opacity="1">
    <text x="466" y="178" font-size="13">0</text><text x="500" y="178" font-size="13">(-4.00, 1.50)</text><text x="630" y="178" font-size="13" fill="#3949ab" font-weight="bold">22.75</text>
