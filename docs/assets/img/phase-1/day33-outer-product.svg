<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
  <text x="20" y="28" font-weight="bold" font-size="15">The gradient for a weight matrix is an outer product: ∂L/∂W = δ xᵀ</text>
  <text x="20" y="48" font-size="12" fill="#555">z = Wx, W has shape (2, 3). δ = ∂L/∂z comes back from the loss; x is the input the layer saw.</text>

  <!-- x along the top -->
  <text x="242" y="98" text-anchor="end" font-weight="bold" fill="#3949ab">xᵀ</text>
  <g fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5">
    <rect x="260" y="66" width="80" height="45" rx="4"/>
    <rect x="350" y="66" width="80" height="45" rx="4"/>
    <rect x="440" y="66" width="80" height="45" rx="4"/>
  </g>
  <!-- delta down the side -->
  <text x="195" y="250" text-anchor="middle" font-weight="bold" fill="#ef6c00">δ</text>
  <g fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5">
    <rect x="160" y="130" width="70" height="55" rx="4"/>
    <rect x="160" y="195" width="70" height="55" rx="4"/>
  </g>
  <!-- the grid for dL/dW -->
  <g fill="#e0f2f1" stroke="#00897b" stroke-width="1.5">
    <rect x="260" y="130" width="80" height="55" rx="4"/>
    <rect x="350" y="130" width="80" height="55" rx="4"/>
    <rect x="440" y="130" width="80" height="55" rx="4"/>
    <rect x="260" y="195" width="80" height="55" rx="4"/>
    <rect x="350" y="195" width="80" height="55" rx="4"/>
    <rect x="440" y="195" width="80" height="55" rx="4"/>
  </g>
  <text x="390" y="272" text-anchor="middle" font-weight="bold" fill="#00897b">∂L/∂W, shape (2, 3) like W</text>

  <!-- moving highlights -->
  <rect x="260" y="66" width="80" height="45" rx="4" fill="#fff59d" stroke="#e53935" stroke-width="3" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.08;0.68;1" values="0;1;0;0"/>
    <animate attributeName="x" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.08;0.18;0.28;0.38;0.48;0.58;0.68;1" values="260;260;350;440;260;350;440;260;260"/>
  </rect>
  <rect x="160" y="130" width="70" height="55" rx="4" fill="#fff59d" stroke="#e53935" stroke-width="3" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.08;0.68;1" values="0;1;0;0"/>
    <animate attributeName="y" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.38;1" values="130;195;195"/>
  </rect>
  <rect x="260" y="130" width="80" height="55" rx="4" fill="none" stroke="#e53935" stroke-width="3" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.08;0.68;1" values="0;1;0;0"/>
    <animate attributeName="x" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.08;0.18;0.28;0.38;0.48;0.58;0.68;1" values="260;260;350;440;260;350;440;260;260"/>
    <animate attributeName="y" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.38;1" values="130;195;195"/>
  </rect>

  <!-- labels on top of highlights -->
  <g text-anchor="middle" font-size="16">
    <text x="300" y="95">2</text><text x="390" y="95">−1</text><text x="480" y="95">0.5</text>
    <text x="195" y="163">1</text><text x="195" y="228">−0.25</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="300" y="62">x₁</text><text x="390" y="62">x₂</text><text x="480" y="62">x₃</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="end">
    <text x="153" y="162">δ₁</text><text x="153" y="227">δ₂</text>
  </g>

  <!-- the cells filling in -->
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#00897b">
    <text x="300" y="163" opacity="0">2<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.11;1" values="0;1;1"/></text>
    <text x="390" y="163" opacity="0">−1<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.21;1" values="0;1;1"/></text>
    <text x="480" y="163" opacity="0">0.5<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.31;1" values="0;1;1"/></text>
    <text x="300" y="228" opacity="0">−0.5<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.41;1" values="0;1;1"/></text>
    <text x="390" y="228" opacity="0">0.25<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.51;1" values="0;1;1"/></text>
    <text x="480" y="228" opacity="0">−0.125<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.61;1" values="0;1;1"/></text>
  </g>

  <!-- right panel -->
  <rect x="545" y="66" width="160" height="184" rx="8" fill="#e8eaf6"/>
  <text x="625" y="90" text-anchor="middle" font-weight="bold">Each cell</text>
  <text x="625" y="114" text-anchor="middle">∂L/∂Wᵢⱼ = δᵢ · xⱼ</text>
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.08;0.68;1" values="0;1;0;0"/>
    <text x="625" y="146" text-anchor="middle" font-size="12" fill="#555">row i: how much the</text>
    <text x="625" y="162" text-anchor="middle" font-size="12" fill="#555">loss wants output i</text>
    <text x="625" y="178" text-anchor="middle" font-size="12" fill="#555">to change (δᵢ)</text>
    <text x="625" y="202" text-anchor="middle" font-size="12" fill="#555">column j: how big the</text>
    <text x="625" y="218" text-anchor="middle" font-size="12" fill="#555">input on that wire</text>
    <text x="625" y="234" text-anchor="middle" font-size="12" fill="#555">was (xⱼ)</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.68;1" values="0;1;1"/>
    <text x="625" y="146" text-anchor="middle" font-size="13">(2, 1) times (1, 3)</text>
    <text x="625" y="166" text-anchor="middle" font-size="13">→ (2, 3)</text>
    <text x="625" y="196" text-anchor="middle" font-size="13" fill="#00897b">np.outer(delta, x)</text>
    <text x="625" y="226" text-anchor="middle" font-size="12" fill="#555">zero input → zero</text>
    <text x="625" y="242" text-anchor="middle" font-size="12" fill="#555">gradient for its column</text>
  </g>

  <text x="20" y="300" font-size="12" fill="#555">Weight Wᵢⱼ connects input j to output i, so its gradient is "error at output i" times "signal on input j".</text>
  <text x="20" y="318" font-size="12" fill="#555">Numbers: δ = [1, −0.25] and x = [2, −1, 0.5], the same as the lesson's code.</text>
</svg>
