<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
<text x="20" y="28" font-weight="bold" font-size="15">One row of W = one neuron's weights</text>
<g opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.25;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/><rect x="46" y="77" width="164" height="42" rx="5" fill="#fff59d" stroke="#3949ab" stroke-width="2.5"/><rect x="236" y="95" width="54" height="114" rx="5" fill="#fff59d" stroke="#3949ab" stroke-width="2.5"/><rect x="326" y="77" width="54" height="42" rx="5" fill="#fff59d" stroke="#3949ab" stroke-width="2.5"/><rect x="416" y="77" width="60" height="42" rx="5" fill="#fff59d" stroke="#3949ab" stroke-width="2.5"/><circle cx="565" cy="98.0" r="20" fill="#fff59d"/><text x="360" y="285" text-anchor="middle" fill="#3949ab" font-weight="bold">neuron 1:  0.5·2 + (−0.2)·1 + 0.1·3 + 0.4 = 1.5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.25;0.5" dur="8s" repeatCount="indefinite" calcMode="discrete"/><rect x="46" y="113" width="164" height="42" rx="5" fill="#fff59d" stroke="#00897b" stroke-width="2.5"/><rect x="236" y="95" width="54" height="114" rx="5" fill="#fff59d" stroke="#00897b" stroke-width="2.5"/><rect x="326" y="113" width="54" height="42" rx="5" fill="#fff59d" stroke="#00897b" stroke-width="2.5"/><rect x="416" y="113" width="60" height="42" rx="5" fill="#fff59d" stroke="#00897b" stroke-width="2.5"/><circle cx="565" cy="134.0" r="20" fill="#fff59d"/><text x="360" y="285" text-anchor="middle" fill="#00897b" font-weight="bold">neuron 2:  0·2 + 1·1 + (−1)·3 + 0 = −2</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.75" dur="8s" repeatCount="indefinite" calcMode="discrete"/><rect x="46" y="149" width="164" height="42" rx="5" fill="#fff59d" stroke="#ef6c00" stroke-width="2.5"/><rect x="236" y="95" width="54" height="114" rx="5" fill="#fff59d" stroke="#ef6c00" stroke-width="2.5"/><rect x="326" y="149" width="54" height="42" rx="5" fill="#fff59d" stroke="#ef6c00" stroke-width="2.5"/><rect x="416" y="149" width="60" height="42" rx="5" fill="#fff59d" stroke="#ef6c00" stroke-width="2.5"/><circle cx="565" cy="170.0" r="20" fill="#fff59d"/><text x="360" y="285" text-anchor="middle" fill="#ef6c00" font-weight="bold">neuron 3:  0.3·2 + 0.3·1 + 0.3·3 + (−1) = 0.8</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.75;1.0" dur="8s" repeatCount="indefinite" calcMode="discrete"/><rect x="46" y="185" width="164" height="42" rx="5" fill="#fff59d" stroke="#e53935" stroke-width="2.5"/><rect x="236" y="95" width="54" height="114" rx="5" fill="#fff59d" stroke="#e53935" stroke-width="2.5"/><rect x="326" y="185" width="54" height="42" rx="5" fill="#fff59d" stroke="#e53935" stroke-width="2.5"/><rect x="416" y="185" width="60" height="42" rx="5" fill="#fff59d" stroke="#e53935" stroke-width="2.5"/><circle cx="565" cy="206.0" r="20" fill="#fff59d"/><text x="360" y="285" text-anchor="middle" fill="#e53935" font-weight="bold">neuron 4:  (−0.4)·2 + 0.2·1 + 0.6·3 + 0.1 = 1.3</text></g>
