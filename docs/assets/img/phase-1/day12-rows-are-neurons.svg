<line x1="480" y1="170.0" x2="548" y2="170.0" stroke="#ef6c00" stroke-dasharray="4 3"/>
<circle cx="565" cy="170.0" r="15" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
