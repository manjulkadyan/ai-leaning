<g font-size="12" fill="#555" text-anchor="middle"><text x="128.0" y="245">W  (4 neurons × 3 inputs)</text><text x="263" y="245">x  (3)</text><text x="353" y="245">b  (4)</text><text x="446" y="245">z  (4)</text><text x="620" y="245">each output belongs</text><text x="620" y="260">to one neuron</text></g>
<text x="360" y="322" text-anchor="middle" font-size="12" fill="#555">Row i of W · x, plus b_i, is neuron i's output. A single W @ x + b computes all four at once.</text>
