<text x="590" y="103.0" font-size="12" fill="#3949ab">neuron 1 → z1</text>
<line x1="480" y1="134.0" x2="548" y2="134.0" stroke="#00897b" stroke-dasharray="4 3"/>
<circle cx="565" cy="134.0" r="15" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
