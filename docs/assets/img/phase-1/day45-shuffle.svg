<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite" keyTimes="0;0.5200;0.6933" values="0;1;0"/><circle cx="508.9" cy="238" r="6" fill="#3949ab"/></g>
<g opacity="1"><animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite" keyTimes="0;0.1733" values="1;0"/><text x="722.2" y="220" text-anchor="middle" font-size="12" fill="#e53935">real</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite" keyTimes="0;0.6933;0.9700" values="0;1;0"/><circle cx="437.8" cy="238" r="6" fill="#e53935"/><circle cx="461.5" cy="238" r="6" fill="#3949ab"/><circle cx="485.2" cy="238" r="6" fill="#3949ab"/><circle cx="508.9" cy="238" r="6" fill="#3949ab"/><circle cx="508.9" cy="222" r="6" fill="#3949ab"/><circle cx="532.6" cy="238" r="6" fill="#3949ab"/><circle cx="556.3" cy="238" r="6" fill="#3949ab"/><circle cx="556.3" cy="222" r="6" fill="#3949ab"/><circle cx="556.3" cy="206" r="6" fill="#3949ab"/><circle cx="580.0" cy="238" r="6" fill="#3949ab"/><circle cx="580.0" cy="222" r="6" fill="#3949ab"/><circle cx="603.7" cy="238" r="6" fill="#3949ab"/><circle cx="603.7" cy="222" r="6" fill="#3949ab"/><circle cx="603.7" cy="206" r="6" fill="#3949ab"/><circle cx="627.4" cy="238" r="6" fill="#3949ab"/><circle cx="651.1" cy="238" r="6" fill="#3949ab"/><circle cx="651.1" cy="222" r="6" fill="#3949ab"/><circle cx="674.8" cy="238" r="6" fill="#3949ab"/><circle cx="698.5" cy="238" r="6" fill="#3949ab"/><circle cx="722.2" cy="238" r="6" fill="#e53935"/><rect x="20" y="80" width="370" height="160" rx="8" fill="#fff3e0" stroke="#ef6c00"/><text x="36" y="108" font-weight="bold" font-size="14">All 20 ways to pick 3 "games" of 6</text><text x="36" y="134" font-size="13">If the labels meant nothing, each split</text><text x="36" y="152" font-size="13">would be equally likely.</text><text x="36" y="178" font-size="13">Only 2 of 20 are as extreme as the real one</text><text x="36" y="196" font-size="13">(the real split and its mirror image):</text><text x="36" y="224" font-weight="bold" font-size="15" fill="#e53935">p = 2 / 20 = 0.10</text></g>
<text x="20" y="345" font-size="12" fill="#555">The real labelling is the most extreme split possible, yet p is still 0.10: six apps can never give strong evidence.</text>
</svg>
