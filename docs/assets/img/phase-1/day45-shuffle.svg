<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite" keyTimes="0;0.3467;0.6933" values="0;1;0"/><circle cx="651.1" cy="238" r="6" fill="#3949ab"/></g>
