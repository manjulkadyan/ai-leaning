<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Helvetica, Arial, sans-serif" font-size="14" class="animated">
  <defs>
    <marker id="dpa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3949ab"/></marker>
    <marker id="dpb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00897b"/></marker>
  </defs>
  <text x="20" y="28" font-weight="bold" font-size="15">The dot product is a length times a shadow</text>
  <g stroke="#eceff1"><line x1="56" y1="94" x2="56" y2="302"/><line x1="108" y1="94" x2="108" y2="302"/><line x1="160" y1="94" x2="160" y2="302"/><line x1="212" y1="94" x2="212" y2="302"/><line x1="264" y1="94" x2="264" y2="302"/><line x1="316" y1="94" x2="316" y2="302"/><line x1="368" y1="94" x2="368" y2="302"/><line x1="56" y1="302" x2="368" y2="302"/><line x1="56" y1="250" x2="368" y2="250"/><line x1="56" y1="198" x2="368" y2="198"/><line x1="56" y1="146" x2="368" y2="146"/><line x1="56" y1="94" x2="368" y2="94"/></g>
  <g stroke="#90a4ae" stroke-width="1.5"><line x1="48" y1="250" x2="376" y2="250"/><line x1="160" y1="302" x2="160" y2="86"/></g>
  <g font-size="11" fill="#90a4ae"><text x="48" y="266">-2</text><text x="100" y="266">-1</text><text x="208" y="266">1</text><text x="260" y="266">2</text><text x="312" y="266">3</text><text x="364" y="266">4</text></g>
  <rect x="415" y="120" width="250" height="165" rx="8" fill="#fff" stroke="#c5cae9"/>
  <line x1="160" y1="250" x2="316" y2="250" stroke="#3949ab" stroke-width="4" marker-end="url(#dpa)"/>
  <text x="310" y="296" font-weight="bold" fill="#3949ab">a = [3, 0]</text>
  <g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.25" calcMode="discrete" dur="14s" repeatCount="indefinite"/>
    <rect x="160" y="238" width="156" height="8" fill="#ef6c00" opacity="0.85"/>
    <line x1="316" y1="198" x2="316" y2="250" stroke="#555" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="316" y1="198" x2="316" y2="250" stroke="#e53935" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="324.0" y="218.0" font-size="12" fill="#e53935">a − b</text>
    <line x1="160" y1="250" x2="316" y2="198" stroke="#00897b" stroke-width="3" marker-end="url(#dpb)"/>
    <text x="324" y="188" font-weight="bold" fill="#00897b" text-anchor="start">b = [3, 1]</text>
    <g font-size="14">
      <text x="430" y="150" fill="#00897b" font-weight="bold">b = [3, 1]   θ ≈ 18°</text>
      <text x="430" y="178" fill="#ef6c00">shadow of b on a = 3</text>
      <text x="430" y="216" fill="#333">a · b = ‖a‖ × shadow</text>
      <text x="470" y="240" fill="#333" font-weight="bold">= 3 × 3 = 9</text>
      <text x="430" y="268" fill="#555" font-size="12">check: 3·3 + 0·1 = 9</text>
    </g>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.25;0.5" calcMode="discrete" dur="14s" repeatCount="indefinite"/>
    <rect x="160" y="238" width="104" height="8" fill="#ef6c00" opacity="0.85"/>
    <line x1="264" y1="146" x2="264" y2="250" stroke="#555" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="264" y1="146" x2="316" y2="250" stroke="#e53935" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="298.0" y="192.0" font-size="12" fill="#e53935">a − b</text>
    <line x1="160" y1="250" x2="264" y2="146" stroke="#00897b" stroke-width="3" marker-end="url(#dpb)"/>
    <text x="272" y="136" font-weight="bold" fill="#00897b" text-anchor="start">b = [2, 2]</text>
    <g font-size="14">
      <text x="430" y="150" fill="#00897b" font-weight="bold">b = [2, 2]   θ = 45°</text>
      <text x="430" y="178" fill="#ef6c00">shadow of b on a = 2</text>
      <text x="430" y="216" fill="#333">a · b = ‖a‖ × shadow</text>
      <text x="470" y="240" fill="#333" font-weight="bold">= 3 × 2 = 6</text>
      <text x="430" y="268" fill="#555" font-size="12">check: 3·2 + 0·2 = 6</text>
    </g>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.75" calcMode="discrete" dur="14s" repeatCount="indefinite"/>
    <circle cx="160" cy="242" r="6" fill="#ef6c00"/>
    <line x1="160" y1="146" x2="160" y2="250" stroke="#555" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="160" y1="146" x2="316" y2="250" stroke="#e53935" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="246.0" y="192.0" font-size="12" fill="#e53935">a − b</text>
    <line x1="160" y1="250" x2="160" y2="146" stroke="#00897b" stroke-width="3" marker-end="url(#dpb)"/>
    <text x="150" y="136" font-weight="bold" fill="#00897b" text-anchor="start">b = [0, 2]</text>
    <g font-size="14">
      <text x="430" y="150" fill="#00897b" font-weight="bold">b = [0, 2]   θ = 90°</text>
      <text x="430" y="178" fill="#ef6c00">shadow of b on a = 0</text>
      <text x="430" y="216" fill="#333">a · b = ‖a‖ × shadow</text>
      <text x="470" y="240" fill="#333" font-weight="bold">= 3 × 0 = 0</text>
      <text x="430" y="268" fill="#555" font-size="12">check: 3·0 + 0·2 = 0</text>
    </g>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.75" calcMode="discrete" dur="14s" repeatCount="indefinite"/>
    <rect x="56" y="238" width="104" height="8" fill="#ef6c00" opacity="0.85"/>
    <line x1="56" y1="146" x2="56" y2="250" stroke="#555" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="56" y1="146" x2="316" y2="250" stroke="#e53935" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="194.0" y="192.0" font-size="12" fill="#e53935">a − b</text>
    <line x1="160" y1="250" x2="56" y2="146" stroke="#00897b" stroke-width="3" marker-end="url(#dpb)"/>
    <text x="52" y="132" font-weight="bold" fill="#00897b" text-anchor="start">b = [−2, 2]</text>
    <g font-size="14">
      <text x="430" y="150" fill="#00897b" font-weight="bold">b = [−2, 2]   θ = 135°</text>
      <text x="430" y="178" fill="#ef6c00">shadow of b on a = −2</text>
      <text x="430" y="216" fill="#333">a · b = ‖a‖ × shadow</text>
      <text x="470" y="240" fill="#333" font-weight="bold">= 3 × (−2) = −6</text>
      <text x="430" y="268" fill="#555" font-size="12">check: 3·(−2) + 0·2 = −6</text>
    </g>
  </g>
  <text x="430" y="105" font-size="12" fill="#555">orange bar: b's shadow on a's line</text>
  <text x="20" y="325" font-size="12" fill="#555">The dashed red side a − b closes the triangle used in the law-of-cosines derivation.</text>
</svg>
